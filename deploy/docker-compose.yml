version: '3.8'

services:
  backoffice:
    build: ./backoffice
    network_mode: host
    volumes:
      - ./backoffice/application.properties:/app/application.properties:ro
      - /opt/kaedigital/paykesho/logs/backoffice:/logs/backoffice
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_LOCATION: file:/app/application.properties
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/paykesho_db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_in_production}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-default_remember_me_key_change_in_production}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  client-portal:
    build: ./client-portal
    network_mode: host
    volumes:
      - ./client-portal/application.properties:/app/application.properties:ro
      - /opt/kaedigital/paykesho/logs/client-portal:/logs/client-portal
