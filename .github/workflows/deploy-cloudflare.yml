name: Deploy PayKesho to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify container health and capture runtime errors
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "Starting Cloudflare Worker error tail..."
          npx wrangler tail paykesho-web --format json --status error > /tmp/paykesho-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 5

          echo "Starting PayKesho health probe..."
          response=$(curl -sS --max-time 100 -w "\nHTTP_STATUS:%{http_code}" https://paykesho-web.amukenam1.workers.dev/health)
          status=$?

          kill $TAIL_PID 2>/dev/null || true
          wait $TAIL_PID 2>/dev/null || true

          echo "===== HEALTH RESPONSE ====="
          echo "$response"
          echo "===== CLOUDFLARE RUNTIME ERRORS ====="
          cat /tmp/paykesho-tail.log || true
          echo "===== END RUNTIME ERRORS ====="

          if [ $status -ne 0 ]; then
            echo "Health request failed at the network level."
            exit $status
          fi

          code=$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS://p')
          if [ "$code" != "200" ]; then
            echo "PayKesho container health check failed with HTTP $code."
            exit 1
          fi
