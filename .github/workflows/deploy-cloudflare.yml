name: PayKesho Production Deployment

# Manual fallback for when Cloudflare Workers Builds cannot build the container
# images (e.g. "The Docker CLI is needed ... but could not be launched").
# Runs the same command Workers Builds runs (`wrangler deploy`) on a GitHub
# runner, which has Docker. Manual-only: it never runs on push, so GitHub
# Actions billing/runner availability cannot block or surprise production.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare dashboard →
# My Profile → API Tokens → "Edit Cloudflare Workers" template). The Worker's
# own secrets stay in Cloudflare and are not touched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy the selected branch to production
        required: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first."; exit 1; }
          docker info > /dev/null
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Deploy Worker and containers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8c8191e662926fe60800fd014adabe0b
        run: npx wrangler deploy
