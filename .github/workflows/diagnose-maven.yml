name: PayKesho Maven Build Diagnostic

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  maven-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Build client portal
        run: mvn -B -ntp -pl webparent/client-portal -am clean package -Dmaven.test.skip=true -Djacoco.skip=true
