
name: Publish Paykesho Container Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Unique image release tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paykesho-image-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish five images
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag and Dockerfiles
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$ ]]; then
            echo "Invalid release tag."
            exit 1
          fi

          for file in \
            Dockerfile.cloudflare \
            Dockerfile.client.cloudflare \
            Dockerfile.payment.cloudflare \
            Dockerfile.merchant.cloudflare \
            Dockerfile.employer.cloudflare
          do
            if [[ ! -f "$file" ]]; then
              echo "Missing Dockerfile: $file"
              exit 1
            fi
          done

          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Cloudflare authentication
        run: npx --yes wrangler@4.142.0 whoami

      - name: Build all five images
        shell: bash
        run: |
          set -euo pipefail

          while IFS='|' read -r image dockerfile; do
            echo "Building ${image}:${RELEASE_TAG}"

            docker buildx build \
              --file "$dockerfile" \
              --tag "${image}:${RELEASE_TAG}" \
              --load \
              .
          done <<'IMAGES'
          paykesho-web|Dockerfile.cloudflare
          paykesho-client|Dockerfile.client.cloudflare
          paykesho-payment|Dockerfile.payment.cloudflare
          paykesho-merchant|Dockerfile.merchant.cloudflare
          paykesho-employer|Dockerfile.employer.cloudflare
          IMAGES

      - name: Publish all five images
        shell: bash
        run: |
          set -euo pipefail

          for image in \
            paykesho-web \
            paykesho-client \
            paykesho-payment \
            paykesho-merchant \
            paykesho-employer
          do
            echo "Publishing ${image}:${RELEASE_TAG}"
            npx --yes wrangler@4.142.0 containers push \
              "${image}:${RELEASE_TAG}"
          done

      - name: List published images
        run: npx --yes wrangler@4.142.0 containers images list
