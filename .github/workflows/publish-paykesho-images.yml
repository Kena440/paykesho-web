name: Publish PayKesho Container Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Unique image release tag, for example 2026-10-27-1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paykesho-image-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish the shared PayKesho image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag, Dockerfile, and credentials
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$ ]]; then
            echo "Invalid release tag."
            exit 1
          fi

          test -f Dockerfile.cloudflare
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Cloudflare authentication
        run: npx --yes wrangler@4.142.0 whoami

      - name: Build shared PayKesho image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile.cloudflare \
            --tag "paykesho-platform:$RELEASE_TAG" \
            --load \
            .

      - name: Publish image to Cloudflare Containers registry
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 containers push "paykesho-platform:$RELEASE_TAG"

      - name: List images in Cloudflare registry
        run: npx --yes wrangler@4.142.0 containers images list
