
name: Publish Paykesho Container Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Unique release tag, e.g. release-2026-10-27-1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paykesho-image-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.142.0

      - name: Verify Cloudflare authentication
        run: wrangler whoami

      - name: Build and publish all five images
        shell: bash
        run: |
          set -euo pipefail

          while IFS='|' read -r image dockerfile; do
            echo "Building ${image}:${RELEASE_TAG}"

            docker buildx build \
              --file "$dockerfile" \
              --tag "${image}:${RELEASE_TAG}" \
              --load \
              .

            echo "Publishing ${image}:${RELEASE_TAG}"

            wrangler containers push \
              "${image}:${RELEASE_TAG}"
          done <<'IMAGES'
          paykesho-web|Dockerfile.cloudflare
          paykesho-client|Dockerfile.client.cloudflare
          paykesho-payment|Dockerfile.payment.cloudflare
          paykesho-merchant|Dockerfile.merchant.cloudflare
          paykesho-employer|Dockerfile.employer.cloudflare
          IMAGES
