name: Build check

on:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Commons (unit tests)
        run: mvn -B -f commons/pom.xml install
      - name: Phase 1 PIN and webhook regression tests
        run: mvn -B -f webparent/pom.xml -pl client-portal,payment-service,backoffice -am -Dtest=TransactionPinServiceTest,TransactionControllerPinTest,LencoWebhookEventServiceTest,KycReviewServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Services (compile)
        run: mvn -B -f webparent/pom.xml -DskipTests package

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lenco test double (unit tests)
        run: npm run test:worker

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is committed. Remove it and use Cloudflare secrets." && exit 1
          fi
