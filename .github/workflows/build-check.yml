name: Build check

on:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Commons (unit tests)
        run: mvn -B -f commons/pom.xml install
      - name: Services (compile)
        run: mvn -B -f webparent/pom.xml -DskipTests package

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is committed. Remove it and use Cloudflare secrets." && exit 1
          fi
