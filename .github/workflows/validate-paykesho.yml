name: Validate PayKesho Customer Journey

on:
  push:
    branches:
      - feature/paykesho-customer-journey
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Compile customer portal
        run: mvn -B -ntp -pl webparent/client-portal -am package -DskipTests -Djacoco.skip=true

      - name: Compile back-office
        run: mvn -B -ntp -pl webparent/backoffice -am package -DskipTests -Djacoco.skip=true
