name: PayKesho Compile Check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -pl webparent/backoffice -am package -Dmaven.test.skip=true -Djacoco.skip=true
      - run: mvn -B -ntp -pl webparent/client-portal -am package -Dmaven.test.skip=true -Djacoco.skip=true
      - run: mvn -B -ntp -pl webparent/payment-service -am package -Dmaven.test.skip=true -Djacoco.skip=true
