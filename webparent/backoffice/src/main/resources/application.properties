server.port=8080
spring.application.name=backoffice
#server.servlet.context-path=/institutions
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/paykesho_db
spring.datasource.username=root
spring.datasource.password=p@ssw0rd
# HikariCP settings
spring.datasource.hikari.maximum-pool-size=50          
spring.datasource.hikari.connection-timeout=10000     
spring.datasource.hikari.minimum-idle=5               
spring.datasource.hikari.max-lifetime=1800000          
spring.datasource.hikari.idle-timeout=300000           
spring.datasource.hikari.leak-detection-threshold=5000  
spring.datasource.hikari.pool-name=SpringBootHikariCP
spring.datasource.hikari.validation-timeout=3000
# JPA settings - AUTO DATABASE SCHEMA UPDATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Auto-create missing tables and columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Scheduled Tasks Configuration
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=5

# File-based Logging Configuration
logging.config=classpath:logback-spring.xml
logging.file.path=/logs/${spring.application.name}
logging.level.root=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.security=WARN
logging.level.org.paykesho.backoffice=WARN
logging.level.org.paykesho.backoffice.security=WARN
notification.service.url=http://localhost:8085
file.service.url=http://localhost:8086
# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true
# Database monitoring and connection pool health
spring.datasource.hikari.register-mbeans=true
management.metrics.export.jmx.enabled=true
# Security for actuator endpoints
management.endpoints.web.base-path=/actuator
management.security.enabled=false
# Rate Limiting Configuration
paykesho.security.rate-limiting.enabled=${RATE_LIMITING_ENABLED:false}
# Note: Set to false for development, true for production