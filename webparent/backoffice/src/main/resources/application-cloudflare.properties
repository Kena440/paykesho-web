server.port=8080
spring.application.name=paykesho-backoffice
spring.datasource.url=${PAYKESHO_DB_URL}
spring.datasource.username=${PAYKESHO_DB_USERNAME}
spring.datasource.password=${PAYKESHO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=validate
# Supabase exposes the application database in the default public schema.
# Do not force the non-existent/optional app schema during container startup.
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.org.paykesho.backoffice.adminauth=INFO
