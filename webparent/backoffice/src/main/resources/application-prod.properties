server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
# HikariCP settings
spring.datasource.hikari.maximum-pool-size=50          
spring.datasource.hikari.connection-timeout=30000     
spring.datasource.hikari.minimum-idle=10               
spring.datasource.hikari.max-lifetime=1800000          
spring.datasource.hikari.idle-timeout=300000           
spring.datasource.hikari.leak-detection-threshold=5000  
spring.datasource.hikari.pool-name=SpringBootHikariCP
# JPA settings - AUTO DATABASE SCHEMA UPDATE (PRODUCTION)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Auto-create missing tables and columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Scheduled Tasks Configuration
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=5
# Logging settings
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 
notification.service.url=http://localhost:8085
file.service.url=http://localhost:8086