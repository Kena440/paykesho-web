<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Voucher Mgt','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Voucher Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <a class="btn btn-primary shadow-sm" th:href="@{/vouchers}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> My Vouchers
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/vouchers/request}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Request
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">A list of your recorded vouchers.</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped w-100" id="datatables-reponsive">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Code</th>
                                        <th>Client</th>
                                        <th>Amount</th>
                                        <th>Approved</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="voucher, voucherStat : ${voucherList}">
                                        <td class="hideable-column">[[${voucherStat.count}]]</td>
                                        <td>
                                            <span class="font-weight-normal">
                                                <a th:href="@{'/vouchers/view/'+${voucher.id}}"
                                                   title="voucher View">
                                                    <span class="font-weight-normal"> [[${voucher.reference}]]</span>
                                                </a>
                                            </span>
                                        </td>
                                        <td><span class="font-weight-normal">[[${voucher.client}]] - <small>[[${voucher.client.organization}]]</small></span>
                                        </td>
                                        <td><span class="font-weight-normal"
                                                  th:replace="fragments/fragments :: format_currency(${voucher.amount})"></span>
                                        </td>
                                        <td>
                                            <th:block th:if="${voucher.approved == true}">
                                                <div class="badge bg-success">
                                                    Approved
                                                </div>
                                            </th:block>
                                            <th:block th:if="${voucher.approved == false}">
                                                <div class="badge bg-danger">
                                                    Pending Approval
                                                </div>
                                            </th:block>
                                        </td>
                                        <td><span class="font-weight-normal">[[${voucher.requestDate}]]</span></td>
                                        <td>
                                            <th:block th:if="${voucher.approved == false}">
                                                <a class="dropdown-item" href="#">
                                                    <div th:replace="fragments/fragments :: approve('voucher', '/vouchers/approve/' + ${voucher.id})"></div>
                                                </a>
                                                &nbsp;
                                                <a class="dropdown-item text-danger" href="#">
                                                    <div th:replace="fragments/fragments :: reject('voucher', '/vouchers/reject/' + ${voucher.id})"></div>
                                                </a>
                                                &nbsp;
                                                <!--       <a class="dropdown-item text-danger" href="#">
                                                           <div th:replace="fragments/fragments :: adjust('voucher', '/vouchers/adjust/' + ${voucher.id})"></div>
                                                       </a>-->
                                            </th:block>
                                        </td>

                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/vouchers}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'voucher');
        });
    });

    currencySymbol = "[[${CURRENCY_SYMBOL}]]";
    thousandPointType = "[[${THOUSAND_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    decimalPointType = "[[${DECIMAL_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    currencySymbolPosition = "[[${CURRENCY_SYMBOL_POSITION}]]";
    decimalDigits = "[[${DECIMAL_DIGITS}]]";

    prefixCurrencySymbol = currencySymbolPosition === 'before price' ? currencySymbol : '';
    suffixCurrencySymbol = currencySymbolPosition === 'after price' ? currencySymbol : '';
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Datatables Responsive
        $("#datatables-reponsive").DataTable({
            destroy: true,
            responsive: true
        });
    });
</script>

</body>
</html>
