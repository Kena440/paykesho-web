<!DOCTYPE html>
<html data-bs-theme="light" data-layout="fluid" data-sidebar-behavior="sticky"
      data-sidebar-position="left" data-sidebar-theme="dark" lang="en"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Business Error','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card shadow-lg border-0">
                            <div class="card-body text-center p-5">
                                <!-- Error Icon -->
                                <div class="mb-4">
                                    <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
                                </div>

                                <!-- Error Title -->
                                <h2 class="mb-3 text-dark">Business Logic Error</h2>

                                <!-- Error Message -->
                                <div class="alert alert-warning mb-4" role="alert">
                                    <h5 class="alert-heading">
                                        <i class="fas fa-info-circle me-2"></i>What happened?
                                    </h5>
                                    <p class="mb-0" th:text="${errorMessage ?: 'A business rule validation failed.'}">
                                        A business rule validation failed.
                                    </p>
                                </div>

                                <!-- Error Details -->
                                <div class="row text-start mb-4">
                                    <div class="col-sm-6">
                                        <strong>Error Code:</strong><br>
                                        <span class="text-muted" th:text="${errorCode ?: 'BUSINESS_ERROR'}">BUSINESS_ERROR</span>
                                    </div>
                                    <div class="col-sm-6">
                                        <strong>Timestamp:</strong><br>
                                        <span class="text-muted"
                                              th:text="${timestamp ?: #dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}">
                                            2024-01-01 12:00:00
                                        </span>
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="d-flex gap-3 justify-content-center">
                                    <button class="btn btn-primary" onclick="history.back()">
                                        <i class="fas fa-arrow-left me-2"></i>Go Back
                                    </button>
                                    <a class="btn btn-outline-secondary" th:href="@{/}">
                                        <i class="fas fa-home me-2"></i>Dashboard
                                    </a>
                                    <button class="btn btn-outline-info" onclick="window.location.reload()">
                                        <i class="fas fa-redo me-2"></i>Retry
                                    </button>
                                </div>

                                <!-- Help Section -->
                                <div class="mt-4 pt-4 border-top">
                                    <h6 class="text-muted mb-2">Need Help?</h6>
                                    <p class="small text-muted mb-0">
                                        If this error persists, please contact support with the error code above.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="fragments/fragments :: js_code"></footer>

<script>
    // Auto-refresh after 30 seconds if it's a temporary error
    setTimeout(function () {
        const errorCode = '[[${errorCode}]]';
        if (errorCode && errorCode.includes('TEMPORARY')) {
            window.location.reload();
        }
    }, 30000);

    // Log error for monitoring
    console.error('Business Error:', {
        code: '[[${errorCode}]]',
        message: '[[${errorMessage}]]',
        timestamp: '[[${timestamp}]]',
        path: '[[${path}]]'
    });
</script>

</body>
</html>
