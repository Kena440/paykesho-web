<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('User Mgt','none')"></head>
<body>
<div th:replace="fragments/fragments :: loader"></div>
<!--<nav th:replace="fragments/fragments :: nav"></nav>-->
<div class="container-fluid bg-soft">
    <div class="row">
        <div class="col-12">
            <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
            <main class="content">
                <div th:replace="fragments/fragments :: topbar"></div>
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-4">
                    <div class="d-block mb-4 mb-md-0">
                        <nav aria-label="breadcrumb" class="d-none d-md-inline-block">
                            <ol class="breadcrumb breadcrumb-dark breadcrumb-transparent">
                                <li class="breadcrumb-item"><a href="#"><span class="fas fa-home"></span></a></li>
                                <li class="breadcrumb-item"><a href="#">User Mgt</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Users Form</li>
                            </ol>
                        </nav>
                    </div>
                    <div class="btn-toolbar mb-2 mb-md-0"><a th:href="@{/users}" class="btn btn-sm btn-primary"><span
                            class="fas fa-backward"></span> <span>Back to Users</span></a>
                        <div class="btn-group ml-3">
                            <button type="button" class="btn btn-sm btn-outline-secondary">Share</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary">Export</button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-xl-12">
                        <div class="card card-body bg-white border-light shadow-sm mb-4">
                            <form enctype="multipart/form-data"
                                  method="post"
                                  onsubmit="return checkEmailUnique(this)"
                                  th:action="@{/users/save}"
                                  th:object="${user}">
                                <input id="id" th:field="*{id}" type="hidden"/>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <h2 class="h5 mb-4">General information</h2>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label for="first_name">First Name</label>
                                                    <input
                                                            class="form-control" id="first_name" maxlength="45"
                                                            minlength="2" placeholder="First Name" required
                                                            th:field="*{firstName}"
                                                            type="text"></div>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label for="last_name">Last Name</label>
                                                    <input class="form-control" id="last_name" maxlength="45"
                                                           minlength="2" placeholder="Last Name" required
                                                           th:field="*{lastName}"
                                                           type="text">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row align-items-center">
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label>Roles</label>
                                                    <br>
                                                    <th:block th:each="role : ${roleList}">
                                                        <label>
                                                            <input class="m-2"
                                                                   th:field="*{roles}"
                                                                   th:value="${role.id}"
                                                                   type="checkbox"
                                                            />
                                                            [[${role.name}]] - <small>[[${role.description}]]</small>
                                                        </label>
                                                        <br>
                                                    </th:block>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label for="email">Email</label> <input
                                                        class="form-control" id="email"
                                                        maxlength="128"
                                                        minlength="8" placeholder="Email address" required
                                                        th:field="*{email}"
                                                        type="email"></div>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label>Password</label>
                                                    <input class="form-control"
                                                           maxlength="20"
                                                           minlength="6"
                                                           placeholder="Password"
                                                           required
                                                           th:field="*{password}"
                                                           th:if="${user.id == null}"
                                                           type="password">
                                                    <input class="form-control"
                                                           maxlength="20"
                                                           minlength="6"
                                                           placeholder="Password"
                                                           th:field="*{password}"
                                                           th:if="${user.id != null}"
                                                           type="password"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <h2 class="h5 my-4"></h2>
                                        <div class="row">
                                            <div class="col-12 col-sm-6 col-xl-12">
                                                <div class="card card-body bg-white border-light shadow-sm mb-4">
                                                    <h2 class="h5 mb-4">Select profile photo</h2>
                                                    <div class="d-xl-flex align-items-center">
                                                        <div>
                                                            <div class="user-avatar xl-avatar mb-3"><img class="rounded"
                                                                                                         id="thumbnail"
                                                                                                         th:src="@{${user.photosImagePath}}"
                                                                                                         alt="change avatar">
                                                            </div>
                                                        </div>
                                                        <div class="file-field">
                                                            <div class="d-flex justify-content-xl-center ml-xl-3">
                                                                <div class="d-flex"><span class="icon icon-md"><span
                                                                        class="fas fa-paperclip mr-3"></span></span>
                                                                    <input accept="image/png, image/jpeg" capture="user"
                                                                           type="file"
                                                                           id="fileImage"
                                                                           name="image">
                                                                    <div class="d-md-block text-left">
                                                                        <div class="font-weight-normal text-dark mb-1">
                                                                            Choose
                                                                            Image
                                                                        </div>
                                                                        <div class="text-gray small">JPG, GIF or PNG.
                                                                            Max size
                                                                            of 800K
                                                                        </div>
                                                                        <div class="text-gray small">
                                                                            <small class="text-muted">
                                                                                <p class="font-size-xs text-muted"
                                                                                   id="fileImageName"
                                                                                   th:if="${user.photos == null}">
                                                                                <p class="font-size-xs text-muted"
                                                                                   id="fileImageName"
                                                                                   th:if="${user.photos != null}"
                                                                                   th:text="${user.photos}">
                                                                                </p>
                                                                            </small>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-12 mb-4 mb-xl-0">
                                                <div class="card card-body bg-white border-light">
                                                    <h2 class="h5 mb-4">Activation</h2>
                                                    <ul class="list-group list-group-flush">
                                                        <li class="list-group-item d-flex align-items-center justify-content-between px-0 border-bottom">
                                                            <div>
                                                                <h3 class="h6 mb-1">Enabled</h3>
                                                            </div>
                                                            <div>
                                                                <div class="custom-control custom-switch"><input
                                                                        type="checkbox"
                                                                        class="custom-control-input"
                                                                        th:field="*{enabled}"
                                                                        id="enabledInput"
                                                                        checked="checked">
                                                                    <label class="custom-control-label"
                                                                           for="enabledInput"></label></div>
                                                            </div>
                                                        </li>
                                                        <li class="list-group-item d-flex align-items-center justify-content-between px-0 border-bottom">
                                                            <div>
                                                                <h3 class="h6 mb-1">Not Locked?</h3>
                                                            </div>
                                                            <div>
                                                                <div class="custom-control custom-switch"><input
                                                                        type="checkbox"
                                                                        class="custom-control-input"
                                                                        id="accountNonLocked"
                                                                        th:field="*{accountNonLocked}">
                                                                    <label class="custom-control-label"
                                                                           for="accountNonLocked"></label></div>
                                                            </div>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <button type="submit" class="btn btn-primary">Save All</button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>
</div>
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkEmailUnique(form) {
        url = "[[@{/users/rest/check-email}]]";
        userEmail = $("#email").val();
        userId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {id: userId, email: userEmail, _csrf: csrfValue};

        $.post(url, params, function (response) {
            if (response == "OK") {
                form.submit();
            } else if (response == "Duplicated") {
                showWarningModal("There is another user having the email " + userEmail);
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>

</body>

</html>
