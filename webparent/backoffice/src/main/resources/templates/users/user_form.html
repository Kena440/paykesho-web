<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('User Mgt','none')"></head>
<body>

<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>User Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <a class="btn btn-primary shadow-sm" th:href="@{/users}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> List Users
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/users/new}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Add User
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-xl-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">Record users onto the system.</h6>
                            </div>
                            <div class="card-body">
                                <form enctype="multipart/form-data"
                                      method="post"
                                      onsubmit="return checkEmailUnique(this)"
                                      th:action="@{/users/save}"
                                      th:object="${user}">
                                    <input id="id" th:field="*{id}" type="hidden"/>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">First Name</label>
                                                <input
                                                        class="form-control" id="first_name" maxlength="45"
                                                        minlength="2" placeholder="First Name" required
                                                        th:field="*{firstName}"
                                                        type="text">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Last Name</label>
                                                <input
                                                        class="form-control" id="last_name" maxlength="45"
                                                        minlength="2" placeholder="Last Name" required
                                                        th:field="*{lastName}"
                                                        type="text">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Roles</label>
                                                <br>
                                                <th:block th:each="role : ${roleList}">
                                                    <label>
                                                        <input class="m-2"
                                                               th:field="*{roles}"
                                                               th:value="${role.id}"
                                                               type="checkbox"
                                                        />
                                                        [[${role.name}]] - <small>[[${role.description}]]</small>
                                                    </label>
                                                    <br>
                                                </th:block>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Email</label>
                                                <input
                                                        class="form-control" id="email" maxlength="100"
                                                        minlength="2" placeholder="Email" required
                                                        th:field="*{email}"
                                                        type="email">
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label">Password</label>
                                                <input class="form-control"
                                                       maxlength="20"
                                                       minlength="6"
                                                       placeholder="Password"
                                                       required
                                                       th:field="*{password}"
                                                       th:if="${user.id == null}"
                                                       type="password">
                                                <input class="form-control"
                                                       maxlength="20"
                                                       minlength="6"
                                                       placeholder="Password"
                                                       th:field="*{password}"
                                                       th:if="${user.id != null}"
                                                       type="password">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <img
                                                        alt="loading..."
                                                        class="rounded"
                                                        id="thumbnail"
                                                        style="height: 100px; width: 100px"
                                                        th:src="@{${user.photoPath}}">
                                                <hr>
                                                <label class="form-label">File input</label>
                                                <input accept="image/png, image/jpeg"
                                                       capture="user"
                                                       class="form-control"
                                                       id="fileImage"
                                                       name="image"
                                                       type="file" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-check m-0">
                                                    <input class="form-check-input" id="enabledInput"
                                                           th:field="*{enabled}"
                                                           type="checkbox">
                                                    <span class="form-check-label">Enabled</span>
                                                </label>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-check m-0">
                                                    <input class="form-check-input" id="accountNonLocked"
                                                           th:field="*{accountNonLocked}"
                                                           type="checkbox">
                                                    <span class="form-check-label">Not Locked?</span>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <button class="btn btn-primary" type="submit">Submit</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/modal_fragment :: modal_dialog"></div>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkEmailUnique(form) {
        url = "[[@{/users/rest/check-email}]]";
        userEmail = $("#email").val();
        userId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {id: userId, email: userEmail, _csrf: csrfValue};

        $.post(url, params, function (response) {
            if (response == "OK") {
                form.submit();
            } else if (response == "Duplicated") {
                showWarningModal("There is another user having the email " + userEmail);
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>

</body>

</html>
