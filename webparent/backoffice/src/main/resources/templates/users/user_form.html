<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('User Mgt','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">

                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    User Management
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    [[${pageTitle}]]
                                </h1>

                            </div>
                            <div class="col-auto">

                                <!-- Navigation (button group) -->
                                <div class="nav btn-group d-inline-flex d-none" role="tablist">
                                    <button aria-controls="dealsListPane" aria-selected="true"
                                            class="btn btn-white active"
                                            data-bs-target="#dealsListPane" data-bs-toggle="tab" id="dealsListTab"
                                            role="tab">
                                        <span class="fe fe-list"></span>
                                    </button>
                                    <button aria-controls="dealsCardsPane" aria-selected="false" class="btn btn-white"
                                            data-bs-target="#dealsCardsPane" data-bs-toggle="tab" id="dealsCardsTab"
                                            role="tab">
                                        <span class="fe fe-sidebar"></span>
                                    </button>
                                </div> <!-- / .nav -->

                                <!-- Buttons -->
                                <a class="btn btn-primary ms-2" th:href="@{/users}">
                                    Users
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Nav -->
                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                    <li class="nav-item d-none">
                                        <a class="nav-link text-nowrap active" href="#!">
                                            Total <span
                                                class="badge rounded-pill bg-secondary-soft"></span>
                                        </a>
                                    </li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form enctype="multipart/form-data"
                      method="post"
                      onsubmit="return checkEmailUnique(this)"
                      th:action="@{/users/save}"
                      th:object="${user}">
                    <input id="id" th:field="*{id}" type="hidden"/>

                    <div class="row justify-content-between align-items-center">
                        <div class="col">
                            <div class="row align-items-center">
                                <div class="col-auto">

                                    <!-- Avatar -->
                                    <div class="avatar">
                                        <img alt="..." class="avatar-img rounded-circle"
                                             id="thumbnail" th:src="@{${user.photosImagePath}}">
                                    </div>

                                </div>
                                <div class="col ms-n2">

                                    <!-- Heading -->
                                    <h4 class="mb-1">
                                        Your avatar
                                    </h4>

                                    <!-- Text -->
                                    <small class="text-muted">
                                        <p class="font-size-xs text-muted" id="fileImageName"
                                           th:if="${user.photos == null}">
                                        <p class="font-size-xs text-muted" id="fileImageName"
                                           th:if="${user.photos != null}" th:text="${user.photos}">
                                        </p>
                                    </small>

                                </div>
                            </div> <!-- / .row -->
                        </div>
                        <div class="col-auto">

                            <input th:field="*{photos}" type="hidden">
                            <input accept="image/png, image/jpeg" capture="user" class="m-2 form-control" id="fileImage"
                                   name="image" type="file">

                        </div>
                    </div> <!-- / .row -->

                    <!-- Divider -->
                    <hr class="my-5">

                    <div class="row">
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    First name
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="fnameInput" maxlength="45"
                                       minlength="2" placeholder="First Name" required
                                       th:field="*{firstName}"
                                       type="text">
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- Last name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Last name
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="lnameInput" maxlength="45"
                                       minlength="2" placeholder="Last Name" required
                                       th:field="*{lastName}"
                                       type="text">
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Roles
                                </label>
                                <br>
                                <!-- Input -->
                                <th:block th:each="role : ${roleList}">
                                    <label>
                                        <input class="m-2"
                                               th:field="*{roles}"
                                               th:value="${role.id}"
                                               type="checkbox"
                                        />
                                        [[${role.name}]] - <small>[[${role.description}]]</small>
                                    </label>
                                    <br>
                                </th:block>
                            </div>

                        </div>
                        <div class="col-12 col-md-3">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Enabled
                                </label>

                                <!-- Input -->
                                <input class="form-check-input is-invalid" id="enabledInput" th:field="*{enabled}"
                                       type="checkbox">
                            </div>

                        </div>
                        <div class="col-12 col-md-3">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Not Locked?
                                </label>

                                <!-- Input -->
                                <input class="form-check-input is-invalid" id="accountNonLocked"
                                       th:field="*{accountNonLocked}"
                                       type="checkbox">
                            </div>

                        </div>
                        <div class="col-12">

                            <!-- Email address -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="mb-1">
                                    Email address
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="email"
                                       maxlength="128"
                                       minlength="8" placeholder="Email address" required
                                       th:field="*{email}"
                                       type="email">
                            </div>

                        </div>
                        <div class="col-12">

                            <!-- Phone -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Password
                                </label>

                                <!-- Input -->
                                <input class="form-control"
                                       maxlength="20" minlength="6"
                                       placeholder="Password" required
                                       th:field="*{password}"
                                       th:if="${user.id == null}"
                                       type="password">
                                <input class="form-control"
                                       maxlength="20" minlength="6"
                                       placeholder="Password"
                                       th:field="*{password}"
                                       th:if="${user.id != null}"
                                       type="password">

                            </div>

                        </div>

                    </div> <!-- / .row -->

                    <div class="col-12 col-md-6" sec:authorize="hasAnyAuthority('Admin','SuperAdmin')">
                        <button class="btn btn-primary" type="submit">Submit</button>
                        <button class="btn btn-secondary" id="btnCancel" type="button">Cancel</button>
                    </div>


                </form>

                <br><br>

            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkEmailUnique(form) {
        url = "[[@{/users/rest/check-email}]]";
        userEmail = $("#email").val();
        userId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {id: userId, email: userEmail, _csrf: csrfValue};

        $.post(url, params, function (response) {
            if (response == "OK") {
                form.submit();
            } else if (response == "Duplicated") {
                showWarningModal("There is another user having the email " + userEmail);
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>

</body>
