<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('User Mgt','none')"></head>

<body>


<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">

                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    User Management
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    Users
                                </h1>

                            </div>
                            <div class="col-auto">

                                <!-- Navigation (button group) -->
                                <div class="nav btn-group d-inline-flex d-none" role="tablist">
                                    <button aria-controls="dealsListPane" aria-selected="true"
                                            class="btn btn-white active"
                                            data-bs-target="#dealsListPane" data-bs-toggle="tab" id="dealsListTab"
                                            role="tab">
                                        <span class="fe fe-list"></span>
                                    </button>
                                    <button aria-controls="dealsCardsPane" aria-selected="false" class="btn btn-white"
                                            data-bs-target="#dealsCardsPane" data-bs-toggle="tab" id="dealsCardsTab"
                                            role="tab">
                                        <span class="fe fe-sidebar"></span>
                                    </button>
                                </div> <!-- / .nav -->

                                <!-- Buttons -->
                                <a class="btn btn-primary ms-2" sec:authorize="hasAnyAuthority('Admin','SuperAdmin')"
                                   th:href="@{/users/new}">
                                    Add User
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Nav -->
                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                    <li class="nav-item">
                                        <a class="nav-link text-nowrap active" href="#!">
                                            Total <span
                                                class="badge rounded-pill bg-secondary-soft">[[${totalItems}]]</span>
                                        </a>
                                    </li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div> <!-- / .row -->
    </div>

    <div class="tab-content">
        <div aria-labelledby="dealsListTab" class="tab-pane fade show active" id="dealsListPane" role="tabpanel">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <div class="col-12">

                        <!-- Card -->
                        <div class="card"
                             id="dealsList">
                            <div class="card-header">
                                <div class="row align-items-center">
                                    <div th:replace="fragments/fragments :: search_form()"></div>
                                    <div class="col-auto me-n3">

                                        <!-- Select -->
                                        <form>
                                            <select class="form-select form-select-sm form-control-flush"
                                                    data-choices='{"searchEnabled": false}'>
                                                <option selected>5 per page</option>
                                                <option>10 per page</option>
                                                <option>All</option>
                                            </select>
                                        </form>

                                    </div>
                                    <div class="col-auto">

                                        <!-- Dropdown -->
                                        <div class="dropdown">

                                            <button class="btn btn-sm btn-white" onclick="clearFilter()" type="button">
                                                <i class="fe fe-sliders me-1"></i> Clear <span
                                                    class="badge bg-primary ms-1 d-none">0</span>
                                            </button>

                                        </div>

                                    </div>
                                </div> <!-- / .row -->
                            </div>
                            <div class="table-responsive">
                                <table class="table table-sm table-hover table-nowrap card-table"
                                       th:if="${userList.size() > 0}">
                                    <thead>
                                    <tr>
                                        <th class="list-sort text-muted" scope="col">
                                            <a class="disabled" href="#">#</a>
                                        </th>
                                        <th class="list-sort text-muted" scope="col" style="width: 6%">
                                            <a class="disabled" href="#">Photo</a>
                                        </th>
                                        <th class="list-sort text-muted" scope="col"
                                            style="width: 15%"
                                            th:replace="fragments/fragments :: column_Link('email', 'Email','none')">
                                        </th>
                                        <th scope="col"
                                            th:replace="fragments/fragments :: column_Link('firstName', 'First Name', 'none')">
                                        </th>
                                        <th scope="col"
                                            th:replace="fragments/fragments :: column_Link('lastName', 'Last Name', 'none')">
                                        </th>
                                        <th class="list-sort text-muted" scope="col">
                                            <a class="disabled" href="#"> Roles </a>
                                        </th>
                                        <th:block sec:authorize="hasAnyAuthority('Admin','SuperAdmin')">
                                            <th scope="col"
                                                th:replace="fragments/fragments :: column_Link('enabled', 'Enabled', 'none')">
                                            </th>
                                            <th class="list-sort text-muted" scope="col">
                                                <a class="disabled" href="#">Action</a>
                                            </th>
                                        </th:block>
                                    </tr>
                                    </thead>
                                    <tbody class="list fs-base">
                                    <tr th:each="user, userStat : ${userList}">
                                        <td class="hideable-column">[[${userStat.count}]]</td>
                                        <td class="avatar avatar-xxl">
                                            <span class="fas fa-portrait fa-3x" th:if="${user.photos == null}"></span>
                                            <img alt=""
                                                 class="avatar-img rounded img-fluid"
                                                 th:if="${user.photos != null}"
                                                 th:src="@{${user.photosImagePath}}">
                                        </td>
                                        <td class="hideable-column">[[${user.email}]]</td>
                                        <td>[[${user.firstName}]]</td>
                                        <td>[[${user.lastName}]]</td>
                                        <td>[[${user.roles}]]</td>
                                        <th:block sec:authorize="hasAnyAuthority('Admin','SuperAdmin')">
                                            <td>
                                                <div th:replace="fragments/fragments :: status(${user.enabled}, 'user', '/users/' + ${user.id})"></div>
                                            </td>
                                            <td>
                                                <div th:replace="fragments/fragments :: edit('user', '/users/edit/' + ${user.id})"></div>
                                                &nbsp;
                                                <div th:replace="fragments/fragments :: delete(${user.id}, 'user', '/users/delete/' + ${user.id}, true)"></div>
                                            </td>
                                        </th:block>

                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="card-footer d-flex justify-content-between">

                                <div th:replace="fragments/fragments :: pagnation('users')"></div>

                            </div>
                        </div>

                    </div>
                </div> <!-- / .row -->
            </div>
        </div>
    </div>

</div><!-- / .main-content -->
<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/users}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'user');
        });
    });
</script>
</body>


</html>
