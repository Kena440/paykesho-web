<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('User Mgt','none')"></head>
<body>

<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>User Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <a class="btn btn-primary shadow-sm" th:href="@{/users}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> List Users
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/users/new}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Add User
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">A list of recorded users.</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped w-100" id="datatables-reponsive">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Photo</th>
                                        <th>Email</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Roles</th>
                                        <th>Enabled</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user, userStat : ${userList}">
                                        <td class="hideable-column">[[${userStat.count}]]</td>
                                        <td>
                                            <a class="d-flex align-items-center" href="#">
                                                <img alt="Avatar" class="user-avatar rounded-circle mr-3"
                                                     style="max-height: 100px; max-width: 100px"
                                                     th:if="${user.photos != null}" th:src="@{${user.photoPath}}">
                                            </a>
                                        </td>
                                        <td><span class="font-weight-normal">[[${user.email}]]</span></td>
                                        <td><span class="font-weight-normal">[[${user.firstName}]]</span></td>
                                        <td><span class="font-weight-normal">[[${user.lastName}]]</span></td>
                                        <td><span class="font-weight-normal">[[${user.roles}]]</span></td>
                                        <td>
                                            <div th:replace="fragments/fragments :: status(${user.enabled}, 'user', '/users/' + ${user.id})"></div>
                                        </td>
                                        <td>
                                            <a class="dropdown-item" href="#">
                                                <div th:replace="fragments/fragments :: edit('user', '/users/edit/' + ${user.id})"></div>
                                            </a>
                                            &nbsp;
                                            <a class="dropdown-item text-danger" href="#">
                                                <div th:replace="fragments/fragments :: delete(${user.id}, 'user', '/users/delete/' + ${user.id}, true)"></div>
                                            </a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/merchants}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'merchant');
        });
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Datatables Responsive
        $("#datatables-reponsive").DataTable({
            destroy: true,
            responsive: true
        });
    });
</script>

</body>
</html>
