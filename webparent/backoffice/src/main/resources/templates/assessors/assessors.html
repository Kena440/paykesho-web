<!DOCTYPE html>
<html lang="en">

<!-- Mirrored from dashkit.goodthemes.co/ by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 11 May 2022 13:04:22 GMT -->
<!-- Added by HTTrack -->
<meta http-equiv="content-type" content="text/html;charset=utf-8"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Staff Member Mgt','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">

                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Assessor Management
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    Assessors
                                </h1>

                            </div>
                            <div class="col-auto">

                                <!-- Navigation (button group) -->
                                <div class="nav btn-group d-inline-flex d-none" role="tablist">
                                    <button class="btn btn-white active" id="dealsListTab" data-bs-toggle="tab"
                                            data-bs-target="#dealsListPane" role="tab" aria-controls="dealsListPane"
                                            aria-selected="true">
                                        <span class="fe fe-list"></span>
                                    </button>
                                    <button class="btn btn-white" id="dealsCardsTab" data-bs-toggle="tab"
                                            data-bs-target="#dealsCardsPane" role="tab" aria-controls="dealsCardsPane"
                                            aria-selected="false">
                                        <span class="fe fe-sidebar"></span>
                                    </button>
                                </div> <!-- / .nav -->

                                <!-- Buttons -->
                                <a th:href="@{/assessors/new}" class="btn btn-primary ms-2">
                                    Add Assessor
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Nav -->
                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                    <li class="nav-item">
                                        <a href="#!" class="nav-link text-nowrap active">
                                            Total <span
                                                class="badge rounded-pill bg-secondary-soft">[[${totalItems}]]</span>
                                        </a>
                                    </li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div> <!-- / .row -->
    </div>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="dealsListPane" role="tabpanel" aria-labelledby="dealsListTab">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <div class="col-12">

                        <!-- Card -->
                        <div class="card"
                             data-list='{"valueNames": ["item-name", "item-stage", "item-amount", "item-owner", "item-contacted"], "page": 10, "pagination": {"paginationClass": "list-pagination"}}'
                             id="dealsList">
                            <div class="card-header">
                                <div class="row align-items-center">
                                    <div th:replace="fragments/fragments :: search_form()"></div>
                                    <div class="col-auto me-n3">

                                        <!-- Select -->
                                        <form>
                                            <select class="form-select form-select-sm form-control-flush"
                                                    data-choices='{"searchEnabled": false}'>
                                                <option selected>5 per page</option>
                                                <option>10 per page</option>
                                                <option>All</option>
                                            </select>
                                        </form>

                                    </div>
                                    <div class="col-auto">

                                        <!-- Dropdown -->
                                        <div class="dropdown">

                                            <button class="btn btn-sm btn-white" type="button" onclick="clearFilter()">
                                                <i class="fe fe-sliders me-1"></i> Clear <span
                                                    class="badge bg-primary ms-1 d-none">0</span>
                                            </button>

                                        </div>

                                    </div>
                                </div> <!-- / .row -->
                            </div>
                            <div class="table-responsive">
                                <table class="table table-sm table-hover table-nowrap card-table"
                                       th:if="${assessorList.size() > 0}">
                                    <thead>
                                    <tr>
                                        <th scope="col" class="list-sort text-muted">
                                            <a href="#" class="disabled">#</a>
                                        </th>
                                        <th scope="col"
                                            th:replace="fragments/fragments :: column_Link('name', 'Name', 'none')">
                                        </th>
                                        <th scope="col" class="list-sort text-muted"
                                            style="width: 15%"
                                            th:replace="fragments/fragments :: column_Link('email', 'Email','none')">
                                        </th>
                                        <th scope="col" class="list-sort text-muted"
                                            style="width: 15%"
                                            th:replace="fragments/fragments :: column_Link('genderType', 'Gender','none')">
                                        </th>
                                        <th scope="col"
                                            th:replace="fragments/fragments :: column_Link('enabled', 'Enabled', 'none')">
                                        </th>
                                        <th scope="col" class="list-sort text-muted">
                                            <a href="#" class="disabled">Action</a>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody class="list fs-base">
                                    <tr th:each="assessor, assessorStat : ${assessorList}">
                                        <td class="hideable-column">[[${assessorStat.count}]]</td>
                                        <td>[[${assessor.name}]]</td>
                                        <td class="hideable-column">
                                            [[${assessor.email}]]
                                        </td>
                                        <td>
                                            [[${assessor.genderType}]]
                                        </td>
                                        <td>
                                            <div th:replace="fragments/fragments :: status(${assessor.enabled}, 'assessor', '/assessors/' + ${assessor.id})"></div>
                                        </td>
                                        <td>
                                            <a class="fe fe-eye"
                                               title="View Staff Member"
                                               th:href="@{'/assessors/view/'+${assessor.id}}">
                                            </a>
                                            &nbsp;
                                            <div th:replace="fragments/fragments :: edit('assessor', '/assessors/edit/' + ${assessor.id})"></div>
                                            &nbsp;
                                            <div th:replace="fragments/fragments :: delete(${assessor.id}, 'assessor', '/assessors/delete/' + ${assessor.id}, true)"></div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="card-footer d-flex justify-content-between">

                                <div th:replace="fragments/fragments :: pagnation('assessors')"></div>

                            </div>
                        </div>

                    </div>
                </div> <!-- / .row -->
            </div>
        </div>
    </div>

</div><!-- / .main-content -->
<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript" th:src="@{/assets/js/common_list.js}"></script>
<script>
    moduleURL = "[[@{/assessors}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'assessor');
        });
    });
</script>
</body>


</html>
