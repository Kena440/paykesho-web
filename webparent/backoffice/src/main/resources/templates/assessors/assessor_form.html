<!DOCTYPE html>
<html lang="en">

<!-- Mirrored from dashkit.goodthemes.co/ by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 11 May 2022 13:04:22 GMT -->

<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Staff Member Mgt','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">

                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Assessor Management
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    [[${pageTitle}]]
                                </h1>

                            </div>
                            <div class="col-auto">

                                <!-- Navigation (button group) -->
                                <div class="nav btn-group d-inline-flex d-none" role="tablist">
                                    <button aria-controls="dealsListPane" aria-selected="true"
                                            class="btn btn-white active"
                                            data-bs-target="#dealsListPane" data-bs-toggle="tab" id="dealsListTab"
                                            role="tab">
                                        <span class="fe fe-list"></span>
                                    </button>
                                    <button aria-controls="dealsCardsPane" aria-selected="false" class="btn btn-white"
                                            data-bs-target="#dealsCardsPane" data-bs-toggle="tab" id="dealsCardsTab"
                                            role="tab">
                                        <span class="fe fe-sidebar"></span>
                                    </button>
                                </div> <!-- / .nav -->

                                <!-- Buttons -->
                                <a class="btn btn-primary ms-2" th:href="@{/assessors}">
                                    Assessors
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Nav -->
                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                    <li class="nav-item d-none">
                                        <a class="nav-link text-nowrap active" href="#!">
                                            Total <span
                                                class="badge rounded-pill bg-secondary-soft"></span>
                                        </a>
                                    </li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form method="post"
                      onsubmit="return checkEmailUnique(this)"
                      th:action="@{/assessors/save}"
                      th:object="${assessor}">
                    <input id="id" th:field="*{id}" type="hidden"/>

                    <div class="row justify-content-between align-items-center">
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Title
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="title" maxlength="45"
                                       minlength="2" placeholder=" Title" required
                                       th:field="*{title}"
                                       type="text">
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Name
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="fnameInput" maxlength="45"
                                       minlength="2" placeholder=" Name" required
                                       th:field="*{name}"
                                       type="text">
                            </div>

                        </div>

                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Gender
                                </label>

                                <!-- Input -->
                                <select class="form-select mb-3" data-choices th:field="*{genderType}">
                                    <option value="">Select...</option>
                                    <th:block
                                            th:each="ps : ${T(org.commons.enums.GenderType).values()}">
                                        <option class="track-status-text" th:defaultDescription="${ps.name()}"
                                                th:selected="${ps == assessor.genderType}"
                                                th:text="${ps}"
                                                th:value="${ps}">
                                        </option>
                                    </th:block>
                                </select>
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Auth
                                </label>

                                <!-- Input -->
                                <select class="form-select mb-3" data-choices th:field="*{authenticationType}">
                                    <option value="">Select...</option>
                                    <th:block
                                            th:each="ps : ${T(org.commons.enums.AuthenticationType).values()}">
                                        <option class="track-status-text" th:defaultDescription="${ps.name()}"
                                                th:selected="${ps == assessor.authenticationType}"
                                                th:text="${ps}"
                                                th:value="${ps}">
                                        </option>
                                    </th:block>
                                </select>
                            </div>

                        </div>

                        <div class="col-12 col-md-6">

                            <!-- Email address -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="mb-1">
                                    Email address
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="email"
                                       maxlength="128"
                                       minlength="8" placeholder="Email address"
                                       th:field="*{email}"
                                       type="email">
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- Phone -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Phone Number
                                </label>

                                <!-- Input -->
                                <input class="form-control mb-3" data-inputmask="'mask': '(999)999-9999'"
                                       placeholder="(___)___-____"
                                       th:field="*{phoneNumber}" type="text">

                            </div>

                        </div>

                        <div class="col-12 col-md-2">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Enabled
                                </label>

                                <!-- Input -->
                                <input class="form-check-input is-invalid" id="enabledInput" th:field="*{enabled}"
                                       type="checkbox">
                            </div>

                        </div>

                    </div> <!-- / .row -->

                    <div class="col-12 col-md-6">
                        <button class="btn btn-primary" type="submit">Save</button>
                        <button class="btn btn-secondary" id="btnCancel" type="button">Cancel</button>
                    </div>


                </form>

                <br><br>

            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkEmailUnique(form) {
        url = "[[@{/assessors/rest/check-email}]]";
        userEmail = $("#email").val();
        userId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {id: userId, email: userEmail, _csrf: csrfValue};

        $.post(url, params, function (response) {
            if (response === "OK") {
                form.submit();
            } else if (response === "Duplicated") {
                showWarningModal("There is another user having the email " + userEmail);
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>

</body>


</html>
