<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
>
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('IGA','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-10">

                <!-- Header -->
                <div class="header mt-md-5">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Income Generating Activities - Revolving Fund
                                </h6>

                            </div>
                            <div class="col-auto">


                            </div>
                        </div> <!-- / .row -->
                    </div>
                </div>

                <!-- Content -->
                <div class="card card-body p-5">
                    <div class="row">
                        <div class="col text-end">

                            <!-- Badge -->

                        </div>
                    </div> <!-- / .row -->
                    <div class="row">
                        <div class="col text-center">

                            <!-- Logo -->
                            <img alt="..." class="img-fluid mb-4" style="max-width: 4.5rem;"
                                 th:src="@{/assets/img/logo.svg}">

                            <!-- Title -->
                            <h2 class="mb-2">
                                CHURCHES HEALTH ASSOCIATION OF ZAMBIA
                            </h2>

                            <h2 class="text-muted mb-2">
                                Outstanding Loan Balances Summary :
                                <time datetime="2018-04-23"
                                      th:replace="fragments/fragments :: format_date(${currentDate})"></time>
                            </h2>
                        </div>
                    </div>
                    <hr>
                    <div class="row" th:if="${igaLoans.size() > 0}">
                        <div class="col-12">

                            <!-- Table -->
                            <div class="table-responsive">
                                <table class="table my-4">
                                    <thead>
                                    <tr>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Item</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">CHI</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Period</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Principal</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Interest</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Total Loan</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Total Owing</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Nature</span>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="loan, loanStat : ${igaLoans}">
                                        <td class="px-0">
                                            [[${loanStat.count}]]
                                        </td>
                                        <td class="px-0">
                                            [[${loan.facility.name}]]
                                        </td>
                                        <td class="px-0">
                                            <time datetime="2018-04-23"
                                                  th:replace="fragments/fragments :: format_date(${loan.loanDate})"></time>
                                        </td>
                                        <td class="px-0">
                                             <span class="h3"
                                                   th:replace="fragments/fragments :: format_currency(${loan.principalAmount})"></span>
                                        </td>
                                        <td class="px-0">
                                             <span class="h3"
                                                   th:replace="fragments/fragments :: format_currency(${loan.interestAmount})"></span>
                                        </td>
                                        <td class="px-0">
                                             <span class="h3"
                                                   th:replace="fragments/fragments :: format_currency(${loan.totalLoanAmount})"></span>
                                        </td>
                                        <td class="px-0">
                                             <span class="h3"
                                                   th:replace="fragments/fragments :: format_currency(${loan.totalOwing})"></span>
                                        </td>
                                        <td class="px-0">
                                            [[${loan.loanPurpose}]]
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="px-0 border-top border-top-2">Total</td>
                                        <td class="px-0 border-top border-top-2"></td>
                                        <td class="px-0 border-top border-top-2"></td>
                                        <td class="px-0 border-top border-top-2">
                                            <strong><span class="h3"
                                                          th:replace="fragments/fragments :: format_currency(${totalPrincipal})"></span></strong>
                                        </td>
                                        <td class="px-0 border-top border-top-2">
                                            <strong><span class="h3"
                                                          th:replace="fragments/fragments :: format_currency(${totalInterest})"></span></strong>
                                        </td>
                                        <td class="px-0 border-top border-top-2">
                                            <strong><span class="h3"
                                                          th:replace="fragments/fragments :: format_currency(${totalLoanAmount})"></span></strong>
                                        </td>
                                        <td class="px-0 border-top border-top-2">
                                            <strong><span class="h3"
                                                          th:replace="fragments/fragments :: format_currency(${totalOwing})"></span></strong>
                                        </td>
                                        <td class="px-0 border-top border-top-2"></td>
                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    contextPath = "[[@{/}]]";
    const csrfHeaderName = "[[${_csrf.headerName}]]";
    let csrfValue = "[[${_csrf.token}]]";

    currencySymbol = "[[${CURRENCY_SYMBOL}]]";
    thousandPointType = "[[${THOUSAND_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    decimalPointType = "[[${DECIMAL_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    currencySymbolPosition = "[[${CURRENCY_SYMBOL_POSITION}]]";
    decimalDigits = "[[${DECIMAL_DIGITS}]]";

    prefixCurrencySymbol = currencySymbolPosition === 'before price' ? currencySymbol : '';
    suffixCurrencySymbol = currencySymbolPosition === 'after price' ? currencySymbol : '';

</script>
<script th:src="@{/assets/js/iga/loan_form_details.js}" type="text/javascript"></script>

</body>
