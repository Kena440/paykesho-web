<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Merchant Mgt','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Merchant Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <a class="btn btn-primary shadow-sm" th:href="@{/merchants}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> List Merchants
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/merchants/new}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Add Merchant
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">A list of recorded merchants.</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped w-100" id="datatables-reponsive">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Photo</th>
                                        <th>Name</th>
                                        <th>Code</th>
                                        <th>Type</th>
                                        <th>Enabled</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="merchant, merchantStat : ${merchantList}">
                                        <td class="hideable-column">[[${merchantStat.count}]]</td>
                                        <td>
                                            <a class="d-flex align-items-center" href="#">
                                                <img alt="Avatar" class="user-avatar mr-3"
                                                     style="max-height: 100px; max-width: 100px"
                                                     th:if="${merchant.photos != null}"
                                                     th:src="@{${merchant.photoPath}}">
                                            </a>
                                        </td>
                                        <td>
                                            <span class="font-weight-normal">
                                                <a th:href="@{'/merchants/view/'+${merchant.id}}"
                                                   title="Assessment View">
                                                    <span class="font-weight-normal"> [[${merchant.name}]]</span>
                                                </a>
                                            </span>
                                        </td>
                                        <td><span class="font-weight-normal">[[${merchant.code}]]</span></td>
                                        <td><span class="font-weight-normal">[[${merchant.merchantType}]]</span></td>
                                        <td>
                                            <div th:replace="fragments/fragments :: status(${merchant.enabled}, 'merchant', '/merchants/' + ${merchant.id})"></div>
                                        </td>
                                        <td>
                                            <a class="dropdown-item" href="#">
                                                <div th:replace="fragments/fragments :: edit('merchant', '/merchants/edit/' + ${merchant.id})"></div>
                                            </a>
                                            &nbsp;
                                            <a class="dropdown-item text-danger" href="#">
                                                <div th:replace="fragments/fragments :: delete(${merchant.id}, 'merchant', '/merchants/delete/' + ${merchant.id}, true)"></div>
                                            </a>
                                        </td>
                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/merchants}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'merchant');
        });
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Datatables Responsive
        $("#datatables-responsive").DataTable({
            destroy: true,
            responsive: true,
            error: function (xhr, error, thrown) {
                console.error('DataTable error:', error, thrown);
                showErrorAlert('Failed to load data table. Please refresh the page.');
            }
        });
    });
</script>

</body>
</html>
