<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Merchant Mgt','none')"></head>
<body>
<div th:replace="fragments/fragments :: loader"></div>
<!--<nav th:replace="fragments/fragments :: nav"></nav>-->
<div class="container-fluid bg-soft">
    <div class="row">
        <div class="col-12">
            <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
            <main class="content">
                <input id="longitude" th:value="${merchant.longitude}" type="hidden"/>
                <input id="latitude" th:value="${merchant.latitude}" type="hidden"/>
                <div th:replace="fragments/fragments :: topbar"></div>
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-4">
                    <div class="d-block mb-4 mb-md-0">
                        <nav aria-label="breadcrumb" class="d-none d-md-inline-block">
                            <ol class="breadcrumb breadcrumb-dark breadcrumb-transparent">
                                <li class="breadcrumb-item"><a href="#"><span class="fas fa-home"></span></a></li>
                                <li class="breadcrumb-item"><a href="#">Organization Mgt</a></li>
                                <li aria-current="page" class="breadcrumb-item active">Organization View</li>
                            </ol>
                        </nav>
                    </div>
                    <div class="btn-toolbar mb-2 mb-md-0"><a class="btn btn-sm btn-primary"
                                                             th:href="@{/merchants}"><span
                            class="fas fa-list"></span> <span>Organizations</span></a>
                        <div class="btn-group ml-3">
                            <button class="btn btn-sm btn-outline-secondary" type="button">Share</button>
                            <button class="btn btn-sm btn-outline-secondary" type="button">Export</button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-xl-12">
                        <div class="card card-body bg-white border-light shadow-sm mb-4">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <h2 class="h5 mb-4">Merchant information</h2>
                                    <div class="row">
                                        <div class="col-md-12 mb-1">
                                            <div class="card card-body bg-white border-light shadow-sm mb-1">
                                                <div class="d-xl-flex align-items-center">
                                                    <div>
                                                        <div class="merchant-avatar xl-avatar mb-3"><img
                                                                alt="change avatar"
                                                                class="rounded"
                                                                id="thumbnail"
                                                                style="height: 100px; width: 140px"
                                                                th:src="@{${merchant.photosImagePath}}">
                                                        </div>
                                                    </div>
                                                    <div class="file-field">
                                                        <div class="d-flex justify-content-xl-center ml-xl-3">
                                                            <div class="d-flex">
                                                                <div class="d-md-block text-left">
                                                                    <div class="font-weight-normal text-dark mb-1">
                                                                        [[${merchant.name}]]
                                                                        ([[${merchant.merchantType}]])
                                                                    </div>
                                                                    <div class="font-weight-normal text-dark mb-1">
                                                                        [[${merchant.phoneNumber}]], [[${merchant.email}]]
                                                                    </div>
                                                                    <div class="font-weight-normal text-dark mb-1">
                                                                        [[${merchant.district}]],
                                                                        [[${merchant.province}]]
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <hr>
                                        <div class="col-md-12 mb-3">
                                            <div class="card card-body bg-white border-light shadow-sm mb-4">
                                                <div id="map" style='width: 100%; height: 400px'></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <h2 class="h5 my-4"></h2>
                                    <div class="row">
                                        <div class="col-12 col-sm-6 col-xl-12">

                                        </div>
                                        <div class="col-12 mb-4 mb-xl-0">

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/merchants}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'merchant');
        });
    });
</script>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiY2hhemRldmVsb3BlcjcwIiwiYSI6ImNsOG11dXptNTBjc2Mzb3A2aTg3aXkzMmQifQ.EpRXqn3-sQCu8qEu9l7nCA';
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v11',
        zoom: 15,
        center: [$("#longitude").val(), $("#latitude").val()]
    });

    const marker1 = new mapboxgl.Marker()
        .setLngLat([$("#longitude").val(), $("#latitude").val()])
        .addTo(map);

    map.addControl(
        new MapboxGeocoder({
            accessToken: mapboxgl.accessToken,
            mapboxgl: mapboxgl
        })
    );

</script>

</body>

</html>
