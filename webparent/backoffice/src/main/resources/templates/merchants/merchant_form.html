<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Merchant Mgt','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Merchant Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <a class="btn btn-primary shadow-sm" th:href="@{/merchants}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> List Merchants
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/merchants/new}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Add Merchant
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-xl-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">Record merchants onto the system.</h6>
                            </div>
                            <div class="card-body">
                                <form enctype="multipart/form-data"
                                      method="post"
                                      onsubmit="return checkMerchantUnique(this)"
                                      th:action="@{/merchants/save}"
                                      th:object="${merchant}">
                                    <input id="id" th:field="*{id}" type="hidden"/>
                                    <input id="longitude" th:field="*{longitude}" type="hidden"/>
                                    <input id="latitude" th:field="*{latitude}" type="hidden"/>
                                    <input id="code" th:field="*{code}" type="hidden"/>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Name</label>
                                                <input
                                                        class="form-control" id="name" maxlength="45"
                                                        minlength="2" placeholder="Name" required
                                                        th:field="*{name}"
                                                        type="text">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Type</label>
                                                <select class="form-control" required th:field="*{merchantType}">
                                                    <option value="">Select...</option>
                                                    <th:block
                                                            th:each="ps : ${T(org.commons.enums.MerchantType).values()}">
                                                        <option th:defaultDescription="${ps.name()}"
                                                                th:text="${ps}"
                                                                th:value="${ps}">
                                                        </option>
                                                    </th:block>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Phone Number</label>
                                                <input
                                                        class="form-control" id="phoneNumber" maxlength="45"
                                                        minlength="2" placeholder="Phone Number" required
                                                        th:field="*{phoneNumber}"
                                                        type="text">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Email</label>
                                                <input
                                                        class="form-control" id="email" maxlength="100"
                                                        minlength="2" placeholder="Email" required
                                                        th:field="*{email}"
                                                        type="email">
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label">Details</label>
                                                <textarea class="form-control" id="details" placeholder="Details"
                                                          required
                                                          rows="3" th:field="*{details}"></textarea>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Services</label>
                                                <textarea class="form-control" id="servicesOffered"
                                                          placeholder="Services" required
                                                          rows="3" th:field="*{servicesOffered}"></textarea>
                                            </div>
                                        </div>
                                        <div class="col-md-6">

                                            <div class="mb-3">
                                                <img
                                                        alt="loading..."
                                                        class="rounded"
                                                        id="thumbnail"
                                                        style="height: 100px; width: 100px"
                                                        th:src="@{${merchant.photoPath}}">
                                                <hr>
                                                <label class="form-label">File input</label>
                                                <input accept="image/png, image/jpeg"
                                                       capture="user"
                                                       class="form-control"
                                                       id="fileImage"
                                                       name="image"
                                                       required type="file">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-check m-0">
                                                    <input class="form-check-input" id="enabledInput"
                                                           th:field="*{enabled}"
                                                           type="checkbox">
                                                    <span class="form-check-label">Enabled</span>
                                                </label>
                                            </div>
                                            <hr>
                                            <div class="mb-3">
                                                <label class="form-label">Location</label>
                                                <div class="text-center">
                                                    <div id="map" style='width: 100%; height: 250px'></div>
                                                    <pre id="info"></pre>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <button class="btn btn-primary" type="submit">Submit</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/modal_fragment :: modal_dialog"></div>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkMerchantUnique(form) {
        url = "[[@{/merchants/rest/check-merchant}]]";
        merchantName = $("#name").val();
        merchantType = $("#merchantType").val();
        merchantId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {id: merchantId, merchantName: merchantName, merchantType: merchantType, _csrf: csrfValue};

        $.post(url, params, function (response) {
            if (response == "OK") {
                form.submit();
            } else if (response == "Duplicated") {
                showWarningModal("There is another merchant having the name " + merchantName);
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>
<script>
    var map = L.map('map').setView([-13.1189121, 28.5589884], 4.8); // Center map and set zoom level

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var marker = L.marker([$("#latitude").val(), $("#longitude").val()]).addTo(map);

    map.on('mousemove', function (e) {
        document.getElementById('info').innerHTML =
            JSON.stringify({x: e.containerPoint.x, y: e.containerPoint.y}) + // container point (x, y)
            '<br />' +
            JSON.stringify({lng: e.latlng.lng, lat: e.latlng.lat}); // longitude, latitude of event
    });

    function add_marker(e) {
        var coordinates = e.latlng; // Get the clicked location

        // Update latitude and longitude input fields
        $("#longitude").val(coordinates.lng);
        $("#latitude").val(coordinates.lat);

        // Update marker position
        marker.setLatLng(coordinates).addTo(map);
    }

    // Add click event to place a marker on the map
    map.on('click', add_marker);
</script>

</body>
</html>
