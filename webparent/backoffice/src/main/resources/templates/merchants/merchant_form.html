<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Merchant Mgt','none')"></head>
<body>
<div th:replace="fragments/fragments :: loader"></div>
<!--<nav th:replace="fragments/fragments :: nav"></nav>-->
<div class="container-fluid bg-soft">
    <div class="row">
        <div class="col-12">
            <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
            <main class="content">
                <div th:replace="fragments/fragments :: topbar"></div>
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-4">
                    <div class="d-block mb-4 mb-md-0">
                        <nav aria-label="breadcrumb" class="d-none d-md-inline-block">
                            <ol class="breadcrumb breadcrumb-dark breadcrumb-transparent">
                                <li class="breadcrumb-item"><a href="#"><span class="fas fa-home"></span></a></li>
                                <li class="breadcrumb-item"><a href="#">Merchant Mgt</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Merchants Form</li>
                            </ol>
                        </nav>
                    </div>
                    <div class="btn-toolbar mb-2 mb-md-0"><a th:href="@{/merchants}"
                                                             class="btn btn-sm btn-primary"><span
                            class="fas fa-backward"></span> <span>Back to Merchants</span></a>
                        <div class="btn-group ml-3">
                            <button type="button" class="btn btn-sm btn-outline-secondary">Share</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary">Export</button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-xl-12">
                        <div class="card card-body bg-white border-light shadow-sm mb-4">
                            <form enctype="multipart/form-data"
                                  method="post"
                                  onsubmit="return checkMerchantUnique(this)"
                                  th:action="@{/merchants/save}"
                                  th:object="${merchant}">
                                <input id="id" th:field="*{id}" type="hidden"/>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <h2 class="h5 mb-4">General information</h2>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label for="name">Name</label>
                                                    <input
                                                            class="form-control" id="name" maxlength="45"
                                                            minlength="2" placeholder="Name" required
                                                            th:field="*{name}"
                                                            type="text"></div>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label>Type</label>
                                                    <select class="custom-select" th:field="*{merchantType}">
                                                        <option value="">Select...</option>
                                                        <th:block
                                                                th:each="ps : ${T(org.commons.enums.MerchantType).values()}">
                                                            <option th:defaultDescription="${ps.name()}"
                                                                    th:text="${ps}"
                                                                    th:value="${ps}">
                                                            </option>
                                                        </th:block>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label for="name">Phone Number</label>
                                                    <input
                                                            class="form-control" id="phoneNumber" maxlength="45"
                                                            minlength="2" placeholder="Phone Number" required
                                                            th:field="*{phoneNumber}"
                                                            type="text"></div>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <div class="form-group"><label for="email">Email</label>
                                                    <input
                                                            class="form-control" id="email" maxlength="100"
                                                            minlength="2" placeholder="Email" required
                                                            th:field="*{email}"
                                                            type="email"></div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-12 mb-3">
                                                <div class="form-group"><label for="details">Details</label>
                                                    <textarea class="form-control" id="details" placeholder="Details"
                                                              required
                                                              th:field="*{details}" rows="3"></textarea>

                                                </div>

                                                <div class="form-group"><label for="servicesOffered">Services
                                                    Offered</label>
                                                    <textarea class="form-control" id="servicesOffered"
                                                              placeholder="Services" required
                                                              th:field="*{servicesOffered}" rows="3"></textarea>

                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <h2 class="h5 my-4"></h2>
                                        <div class="row">
                                            <div class="col-12 col-sm-6 col-xl-12">
                                                <div class="card card-body bg-white border-light shadow-sm mb-4">
                                                    <h2 class="h5 mb-4">Select profile photo</h2>
                                                    <div class="d-xl-flex align-items-center">
                                                        <div>
                                                            <div class="merchant-avatar xl-avatar mb-3"><img
                                                                    class="rounded"
                                                                    id="thumbnail"
                                                                    th:src="@{${merchant.photosImagePath}}"
                                                                    alt="change avatar">
                                                            </div>
                                                        </div>
                                                        <div class="file-field">
                                                            <div class="d-flex justify-content-xl-center ml-xl-3">
                                                                <div class="d-flex"><span class="icon icon-md"><span
                                                                        class="fas fa-paperclip mr-3"></span></span>
                                                                    <input accept="image/png, image/jpeg"
                                                                           capture="user"
                                                                           type="file"
                                                                           id="fileImage"
                                                                           name="image">
                                                                    <div class="d-md-block text-left">
                                                                        <div class="font-weight-normal text-dark mb-1">
                                                                            Choose
                                                                            Image
                                                                        </div>
                                                                        <div class="text-gray small">JPG, GIF or PNG.
                                                                            Max size
                                                                            of 800K
                                                                        </div>
                                                                        <div class="text-gray small">
                                                                            <small class="text-muted">
                                                                                <p class="font-size-xs text-muted"
                                                                                   id="fileImageName"
                                                                                   th:if="${merchant.photos == null}">
                                                                                <p class="font-size-xs text-muted"
                                                                                   id="fileImageName"
                                                                                   th:if="${merchant.photos != null}"
                                                                                   th:text="${merchant.photos}">
                                                                                </p>
                                                                            </small>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-12 mb-4 mb-xl-0">
                                                <div class="card card-body bg-white border-light">
                                                    <h2 class="h5 mb-4">Activation</h2>
                                                    <ul class="list-group list-group-flush">
                                                        <li class="list-group-item d-flex align-items-center justify-content-between px-0 border-bottom">
                                                            <div>
                                                                <h3 class="h6 mb-1">Enabled</h3>
                                                            </div>
                                                            <div>
                                                                <div class="custom-control custom-switch"><input
                                                                        type="checkbox"
                                                                        class="custom-control-input"
                                                                        th:field="*{enabled}"
                                                                        id="enabledInput"
                                                                        checked="checked">
                                                                    <label class="custom-control-label"
                                                                           for="enabledInput"></label></div>
                                                            </div>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <button type="submit" class="btn btn-primary">Save All</button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>
</div>
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkMerchantUnique(form) {
        url = "[[@{/merchants/rest/check-merchant}]]";
        merchantName = $("#name").val();
        merchantType = $("#merchantType").val();
        merchantId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {id: merchantId, merchantName: merchantName, merchantType: merchantType, _csrf: csrfValue};

        $.post(url, params, function (response) {
            if (response == "OK") {
                form.submit();
            } else if (response == "Duplicated") {
                showWarningModal("There is another merchant having the name " + merchantName);
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>

</body>

</html>
