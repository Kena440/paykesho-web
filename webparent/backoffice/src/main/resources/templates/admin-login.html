<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PayKesho | Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#081b2a,#123b4d 55%,#0a2435);color:#fff;padding:24px}.shell{width:min(440px,100%)}.brand{text-align:center;margin-bottom:24px}.brand img{width:96px;height:64px;object-fit:contain;margin-bottom:10px}.brand h1{margin:0;font-size:28px}.brand p{margin:7px 0 0;color:#a9c3cf;font-size:14px}.card{background:rgba(255,255,255,.98);color:#17212b;border-radius:20px;padding:32px;box-shadow:0 25px 70px rgba(0,0,0,.32)}.eyebrow{color:#1687a8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}h2{margin:0 0 22px;font-size:24px}label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}input{width:100%;padding:14px 15px;border:1px solid #d7e0e5;border-radius:10px;outline:none;font-size:15px;margin-bottom:17px;background:#fff}input:focus{border-color:#1687a8;box-shadow:0 0 0 3px rgba(22,135,168,.12)}button{width:100%;border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:700;color:#fff;background:#0b7285;cursor:pointer}.remember{display:flex;align-items:center;gap:8px;margin:-3px 0 20px;font-size:13px;color:#56636c}.remember input{width:auto;margin:0}.alert{padding:11px 13px;border-radius:9px;margin-bottom:16px;font-size:13px}.error{background:#fff0f0;color:#a12626;border:1px solid #f1c5c5}.success{background:#eefaf3;color:#1f7040;border:1px solid #c9ead6}.footer{text-align:center;color:#91aab5;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="shell">
<div class="brand"><img th:src="@{/images/paykeshologo.png}" alt="PayKesho"><h1>PayKesho</h1><p>Back Office Administration</p></div>
<div class="card"><div class="eyebrow">Secure access</div><h2>Sign in to your admin account</h2>
<div class="alert error" th:if="${param.error}">Incorrect email or password. Please try again.</div>
<div class="alert success" th:if="${param.logout}">You have been signed out successfully.</div>
<form method="post" th:action="@{/login}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" placeholder="admin@paykesho.com" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
<label class="remember"><input type="checkbox" name="remember-me" value="true"> Remember me for 7 days</label>
<button type="submit">Sign in to PayKesho</button>
</form></div>
<div class="footer">PayKesho secure administration portal</div>
</div>
</body>
</html>
