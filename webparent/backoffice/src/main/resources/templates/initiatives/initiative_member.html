<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Initiatives','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">

                <!-- Header -->
                <div class="header mt-md-5">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Initiatives
                                </h6>

                            </div>
                            <div class="col-auto">


                            </div>
                        </div> <!-- / .row -->
                    </div>
                </div>

                <!-- Content -->
                <div class="card card-body p-5">
                    <div class="row">
                        <div class="col text-end">

                            <!-- Badge -->


                            <th:block th:if="${initiative.enabled == true}">
                                <div class="badge bg-success">
                                    Enabled
                                </div>
                            </th:block>
                            <th:block th:if="${initiative.enabled == false}">
                                <div class="badge bg-danger">
                                    Not enabled
                                </div>
                            </th:block>
                        </div>
                    </div> <!-- / .row -->
                    <div class="row">
                        <div class="col text-center">

                            <!-- Title -->
                            <h2 class="mb-2">
                                <a th:href="@{'/initiatives/view/'+${initiative.id}}">
                                    [[${initiative.name}]]
                                </a>
                            </h2>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-12 col-md-6">

                            <!-- Heading -->
                            <h6 class="text-uppercase text-muted">
                                Name
                            </h6>

                            <!-- Text -->
                            <p class="text-muted mb-4">
                                <strong class="text-body">[[${memberInstitution}]]</strong>
                            </p>

                        </div>
                        <div class="col-12 col-md-6 text-md-end">
                            <!-- Heading -->
                            <h6 class="text-uppercase text-muted">
                                Details
                            </h6>

                            <!-- Text -->
                            <p class="text-muted mb-4">
                                <strong class="text-body">[[${initiative.details}]]</strong>
                            </p>

                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-12 col-md-6">

                            <!-- Heading -->
                            <h6 class="text-uppercase text-muted">
                                Payments
                            </h6>
                        </div>
                        <div class="col-12 col-md-6 text-md-end">
                            <button class="btn btn-primary" data-bs-target="#exampleModal" data-bs-toggle="modal"
                                    sec:authorize="hasAnyAuthority('MicroFin')" type="button">
                                <span class="fe fe-file-plus"></span>
                            </button>
                        </div>
                    </div>
                    <div class="row" th:if="${paymentList.size() > 0}">
                        <div class="col-12">

                            <!-- Table -->
                            <div class="table-responsive">
                                <table class="table my-4">
                                    <thead>
                                    <tr>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">#</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Amount</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Description</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Date</span>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="init, initStat : ${paymentList}">
                                        <td class="px-0">
                                            [[${initStat.count}]]
                                        </td>
                                        <td class="px-0">
                                            <span class="h3"
                                                  th:replace="fragments/fragments :: format_currency(${init.amount})"></span>
                                        </td>
                                        <td class="px-0">
                                            [[${init.description}]]
                                        </td>
                                        <td class="px-0">
                                            <time datetime="2018-04-23"
                                                  th:replace="fragments/fragments :: format_date(${init.paymentDate})"></time>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="px-0 border-top border-top-2">Total</td>
                                        <td class="px-0 border-top border-top-2">
                                            <strong><span class="h3"
                                                          th:replace="fragments/fragments :: format_currency(${initiativeMemberTotalRemittedFromPaymentItems})"></span></strong>
                                        </td>
                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div> <!-- / .row -->
    </div>

    <!-- Modal -->
    <div aria-hidden="true" aria-labelledby="exampleModalLabel" class="modal fade" id="exampleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Add Payment Record</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>

                <form method="post"
                      th:action="@{/initiatives/save-member-payment}">
                    <input id="initiativeId" name="initiativeId" th:value="${initiative.id}"
                           type="hidden"/>
                    <input id="memberInstitution" name="memberInstitution" th:value="${memberInstitution.id}"
                           type="hidden"/>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Date
                                    </label>
                                    <input class="form-control" name="paymentDate" required type="date">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Amount
                                    </label>
                                    <input class="form-control" name="amount" required type="number">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Description
                                    </label>
                                    <textarea class="form-control" name="description" required rows="3"
                                              type="text"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer" sec:authorize="hasAnyAuthority('MicroFin')">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                        <button class="btn btn-primary" type="submit">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div><!-- / .main-content -->
<footer th:replace="fragments/modal_fragment :: remove_member_modal"></footer>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    contextPath = "[[@{/}]]";
    const csrfHeaderName = "[[${_csrf.headerName}]]";
    let csrfValue = "[[${_csrf.token}]]";

    currencySymbol = "[[${CURRENCY_SYMBOL}]]";
    thousandPointType = "[[${THOUSAND_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    decimalPointType = "[[${DECIMAL_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    currencySymbolPosition = "[[${CURRENCY_SYMBOL_POSITION}]]";
    decimalDigits = "[[${DECIMAL_DIGITS}]]";

    prefixCurrencySymbol = currencySymbolPosition === 'before price' ? currencySymbol : '';
    suffixCurrencySymbol = currencySymbolPosition === 'after price' ? currencySymbol : '';

    $(document).ready(function () {
        $(".link-remove-member").on("click", function (e) {
            e.preventDefault();
            showRemoveMemberModal($(this), 'iga');
        });
    });

    function showRemoveMemberModal(link, entityName) {
        entityId = link.attr("entityId");
        $("#yesRemoveMemberButton").attr("href", link.attr("href"))
        $("#removeMemberText").text("Are you sure you want to remove this member from this initiative ?");
        $("#removeMemberModal").modal("show");
    }
</script>
<script th:src="@{/assets/js/iga/loan_form_details.js}" type="text/javascript"></script>

</body>

</html>
