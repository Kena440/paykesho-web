<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
    <div class="row">
        <div class="col-12 col-md-6">

            <!-- Heading -->
            <h6 class="text-uppercase">
                Registered Assessors : [[${assessmentAssessors.size()}]]
            </h6>
        </div>
        <div class="col-12 col-md-6 text-md-end">
            <button class="btn btn-primary" data-bs-target="#assessorModal" data-bs-toggle="modal"
                    type="button">
                <span class="fe fe-file-plus"></span>
                Assessor
            </button>
            <a class="btn btn-primary" th:href="@{'/events/export/excel/attendees/' + ${assessment.id}}">
                <span class="fe fe-printer"></span>
                Export
            </a>
        </div>
    </div>
    <div class="row" th:if="${assessmentAssessors.size() > 0}">
        <div class="col-6">
            <input class="form-control" id="searchAssessorInput" placeholder="Search..." type="text">
        </div>
        <div class="col-12">

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-sm table-bordered my-4" id="assessorTable">
                    <thead>
                    <tr>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Assessment Reg</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Name</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Email</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Date</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Action</span>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="assessor, assessorStat : ${assessmentAssessors}">

                        <td class="px-0 text-center">
                            <small>[[${assessor.assessmentRegId}]]</small>
                        </td>
                        <td class="px-0 text-center" style="width: auto;">
                            <small>[[${assessor.assessor.name}]]</small>
                        </td>
                        <td class="px-0 text-center">
                            <small>[[${assessor.assessor.email}]]</small>
                        </td>
                        <td class="px-0 text-sm-center">
                            <small>
                                <time datetime="2018-04-23"
                                      th:replace="fragments/fragments :: format_date(${assessor.createdDate})"></time>
                            </small>
                        </td>
                        <td class="px-0 text-center">
                            <th:block sec:authorize="hasAnyAuthority('General', 'Admin')">
                                <a class="fe fe-edit" th:href="@{'/assessments/assessor/edit/'+${assessor.id}}"
                                   title="Edit">
                                </a>
                                &nbsp;
                                &nbsp;
                                &nbsp;
                                <a class="fe fe-trash" th:href="@{'/assessments/assessor/delete/'+${assessor.id}}"
                                   title="Delete">
                                </a>
                            </th:block>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <hr>
                <button class="btn btn-primary" id="showMoreBtn">Show More</button>
                <!--<div th:replace="fragments/fragments :: pagnation('attendees')"></div>-->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let currentIndex = 0;

            document.querySelector('#searchAssessorInput').addEventListener('input', function () {
                var searchQuery = this.value.toLowerCase();
                currentIndex = 0;
                var rows = document.querySelectorAll('#assessorTable tbody tr');
                rows.forEach(function (row) {
                    var rowData = row.textContent.toLowerCase();
                    if (rowData.includes(searchQuery)) {
                        row.style.display = 'table-row';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });

    </script>

</div>
</body>
</html>
