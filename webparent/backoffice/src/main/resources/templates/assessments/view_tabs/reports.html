<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">

    <div class="row">
        <div class="col-12 col-md-12">
            <div class="card mb-3">
                <div class="card-header">
                    <h4 class="card-header-title">Response Count Per Question</h4>
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="response : ${responseCountPerQuestion}">
                            <strong th:text="${response.key.question}">Question text</strong>:
                            <span th:text="${response.value}">Response count</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-12">
            <div class="card mb-3">
                <div class="card-header">
                    <h4 class="card-header-title">Answer Distribution Per Question</h4>
                </div>
                <div class="card-body">
                    <div class="col-12" th:each="entry, iterStat : ${distributionPerQuestion}">
                        <div class="card mb-3">
                            <div class="card-header">
                                <h4 th:text="${entry.key.question}">Question text</h4>
                            </div>
                            <div class="card-body">
                                <canvas th:attr="id='chart' + ${iterStat.count}"></canvas>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item" th:each="distEntry : ${entry.value}">
                                        <span th:text="${distEntry.key}">Answer choice</span>:
                                        <span th:text="${distEntry.value}">Count</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    /* Extracting data for charts */
    var distributionPerQuestion = /*[[${distributionPerQuestion}]]*/ {};
    var chartData = [];

    Object.keys(distributionPerQuestion).forEach((key, index) => {
        var question = distributionPerQuestion[key];
        var labels = Object.keys(question);
        var data = Object.values(question);
        chartData.push({ labels: labels, data: data, index: index + 1 });
    });

    chartData.forEach(item => {
        var ctx = document.getElementById('chart' + item.index).getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: item.labels,
                datasets: [{
                    label: 'Responses',
                    data: item.data,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
</script>
</body>
</html>
