<script type="text/javascript">
    contextPath = "[[@{/}]]";

    $(document).ready(function () {
        $("#assessmentUpdateMessage").richText();
    })

    const inactivityTimeout = 1000; // in seconds
    let countdownValue = inactivityTimeout;

    function refreshPage() {
        location.reload(true);
    }

    function updateCountdown() {
        document.getElementById('countdown').textContent = `Refreshing in ${countdownValue} seconds`;
    }

    function resetTimer() {
        clearTimeout(inactivityTimer);
        countdownValue = inactivityTimeout;
        updateCountdown();
        inactivityTimer = setTimeout(refreshPage, inactivityTimeout * 1000);
    }

    document.addEventListener('mousemove', resetTimer);
    document.addEventListener('keydown', resetTimer);

    let inactivityTimer = setTimeout(refreshPage, inactivityTimeout * 1000);

    // Update countdown every second
    setInterval(function () {
        countdownValue -= 1;
        if (countdownValue >= 0) {
            updateCountdown();
        }
    }, 1000);

</script>
<script>
    function showOptionsField() {
        var questionType = document.getElementsByName("questionType")[0].value;
        var optionsField = document.getElementById("optionsField");
        if (questionType === "MULTIPLE_CHOICE" || questionType === "CHECKBOX") {
            optionsField.style.display = "block";
        } else {
            optionsField.style.display = "none";
        }
    }

    function addOption() {
        var optionsList = document.getElementById("optionsList");
        var optionInput = document.createElement("input");
        optionInput.setAttribute("type", "text");
        optionInput.setAttribute("class", "form-control mb-2");
        optionInput.setAttribute("name", "options");
        optionInput.setAttribute("placeholder", "Enter option");
        optionsList.appendChild(optionInput);
    }

    // Call showOptionsField initially to show/hide options field based on initial question type
    showOptionsField();
</script>

    $.get(distributionDisaggregatedUrl, function (response) {

            data: {
                labels: ['Completed Interviews', 'Total Interviews'],
                datasets: [{
                    data: [response.completedInterviews, response.totalInterviews],
                    backgroundColor: ['rgba(54, 162, 235, 0.2)', 'rgba(255, 99, 132, 0.2)'],
                    borderColor: ['rgba(54, 162, 235, 1)', 'rgba(255, 99, 132, 1)'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                legend: {
                    position: 'bottom'
                }
            }
        });
    });
    $.get(completionTimeUrl, function (response) {
        var ctx = document.getElementById('completionTimeChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Average Time', 'Min Time', 'Max Time'],
                datasets: [{
                    label: 'Completion Time (minutes)',
                    data: [response.averageTime, response.minTime, response.maxTime],
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    yAxes: [{
                        ticks: {
                            beginAtZero: true
                        }
                    }]
                },
                responsive: true,
                legend: {
                    position: 'bottom'
                }
            }
        });
    });
</script>
