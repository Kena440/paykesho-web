<!DOCTYPE html>
<html lang="en">
<head th:replace="fragments/fragments :: page_head('Assessment Mgt','none')"></head>
<body>
<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">
    <nav th:replace="fragments/fragments :: topbar"></nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">
                                <h6 class="header-pretitle">Assessment Management</h6>
                                <h1 class="header-title text-truncate">[[${pageTitle}]]</h1>
                            </div>
                            <div class="col-auto">
                                <a class="btn btn-primary ms-2"
                                   th:href="@{'/assessments/view/'+${assessmentForm.assessment.id}}">
                                    Back
                                </a>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- Form -->
                <div id="accordion">
                    <!-- Header -->
                    <div class="header mt-md-5">
                        <div class="header-body">
                            <h1 class="header-title">[[${assessmentForm.assessment.name}]] -</h1>
                            <p class="header-subtitle">[[${assessmentForm.formName}]]</p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 col-md-6">
                            <div class="card mb-3">
                                <div class="card-body">
                                    <h5>Number of Interviews Conducted</h5>
                                    <p>[[${numberOfInterviews}]]</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="card mb-3">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-12 col-md-6" th:if="${assessmentForm.formTarget.defaultDescription() == T(org.commons.enums.FormTarget).FACILITY.name()}">
                                            <h5>Facilities</h5>
                                            <p>[[${facilities}]]</p>
                                        </div>
                                        <div class="col-12 col-md-6" th:if="${assessmentForm.formTarget.defaultDescription() == T(org.commons.enums.FormTarget).DISTRICT.name()}">
                                            <h5>DHO</h5>
                                            <p>[[${districts}]]</p>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 col-md-12">
                            <div class="accordion" id="accordionExample">
                                <div class="accordion-item">
                                    <h2 class="accordion-header">
                                        <button aria-controls="collapseOne" aria-expanded="true"
                                                class="accordion-button collapsed" data-bs-target="#collapseOne"
                                                data-bs-toggle="collapse" type="button">
                                            Results
                                        </button>
                                    </h2>
                                    <div class="accordion-collapse collapse show" data-bs-parent="#accordionExample"
                                         id="collapseOne">
                                        <div class="accordion-body">
                                            <div class="row">
                                                <!-- Charts will be appended here by jQuery -->
                                                <div class="row" id="charts-container"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div> <!-- / .row -->
    </div>
    <input id="assessmentId" name="aId" th:value="${assessmentForm.id}" type="hidden">
</div><!-- / .main-content -->
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    $(document).ready(function () {
        var questionDataMap = /*[[${questionDataMap}]]*/ {};
        var chartsContainer = $('#charts-container');

        $.each(questionDataMap, function (question, distribution) {
            var questionText = question;
            var labels = Object.keys(distribution);
            var data = Object.values(distribution);
            var chartId = 'chart' + labels.join('').replace(/\s+/g, '');

            chartsContainer.append(
                '<div class="col-12 col-md-12">' +
                '<div class="card mb-3">' +
                '  <div class="card-header">' +
                '    <h4 class="card-header-title">' + questionText + '</h4>' +
                '  </div>' +
                '  <div class="card-body">' +
                '    <canvas id="' + chartId + '"></canvas>' +
                '  </div>' +
                '</div>' +
                '</div>'
            );

            var ctx = document.getElementById(chartId).getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Responses',
                        data: data,
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        });
    });
</script>
</body>
</html>
