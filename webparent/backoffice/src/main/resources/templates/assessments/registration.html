<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Assessment Mgt','none')"></head>

<body>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Assessment Management
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    [[${pageTitle}]]
                                </h1>

                            </div>
                            <div class="col-auto">
                                <!-- Buttons -->
                                <a class="btn btn-primary ms-2 d-none" th:href="@{/assessments}">
                                    Assessments
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row">
                            <div class="col text-center">

                                <!-- Title -->
                                <h2 class="mb-2">
                                    <img alt="..." class="img-fluid mb-4" style="max-width: 4.5rem;"
                                         th:src="@{/assets/img/logo.svg}">
                                    &nbsp;
                                    <a th:href="@{'/assessments/view/'+${assessment.id}}">
                                        [[${assessment.name}]]
                                    </a>
                                </h2>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-12 col-md-4">

                                <!-- Heading -->
                                <h6 class="text-uppercase text-muted">
                                    Name
                                </h6>

                                <!-- Text -->
                                <p class="text-muted mb-4">
                                    <strong class="text-body">[[${assessment.name}]]</strong>
                                </p>


                            </div>
                            <div class="col-12 col-md-4 text-center">

                                <img alt="..." class="img-fluid mb-4" style="max-width: 8.5rem;"
                                     th:src="@{${qrCodeContent}}">


                            </div>
                            <div class="col-12 col-md-4 text-md-end">
                                <!-- Heading -->
                                <h6 class="text-uppercase text-muted">
                                    Details
                                </h6>

                                <!-- Text -->
                                <p class="text-muted mb-4">
                                    <strong class="text-body">[[${assessment.details}]]</strong>
                                </p>
                                <!-- Text -->
                                <p class="mb-4">
                                    <time datetime="2018-04-23"
                                          th:replace="fragments/fragments :: format_date(${assessment.assessmentDate})"></time>
                                </p>


                            </div>
                        </div>
                        <hr>
                        <div class="card">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-12 col-lg-4 order-lg-2">

                                        <!-- Image -->
                                        <div class="text-center">
                                            <img alt="..." class="img-fluid mt-n5 mt-lg-0 mb-4 me-md-n5"
                                                 style="max-width: 272px;"
                                                 th:src="@{/assets/img/sign_up_n6im.svg}">
                                        </div>

                                    </div>
                                    <div class="col-12 col-lg-4 px-4 py-3 order-lg-1">

                                        <!-- Title -->
                                        <!--  <h2>
                                              Attendee
                                          </h2>

                                          &lt;!&ndash; Content &ndash;&gt;
                                          <p class="text-muted">
                                              Register as a participant here
                                          </p>

                                          &lt;!&ndash; Button &ndash;&gt;
                                          <a class="btn btn-primary lift"
                                             th:href="@{'/assessments/registration/attendee/' + ${assessment.id}}">
                                              Attendee
                                          </a>-->

                                    </div>
                                </div> <!-- / .row -->
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Form -->
            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>

</body>


</html>
