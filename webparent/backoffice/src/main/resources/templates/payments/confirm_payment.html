<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
>
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Finance','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">

                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Finance
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    [[${pageTitle}]]
                                </h1>

                            </div>
                            <div class="col-auto">

                                <!-- Navigation (button group) -->
                                <div class="nav btn-group d-inline-flex d-none" role="tablist">
                                    <button aria-controls="dealsListPane" aria-selected="true"
                                            class="btn btn-white active"
                                            data-bs-target="#dealsListPane" data-bs-toggle="tab" id="dealsListTab"
                                            role="tab">
                                        <span class="fe fe-list"></span>
                                    </button>
                                    <button aria-controls="dealsCardsPane" aria-selected="false" class="btn btn-white"
                                            data-bs-target="#dealsCardsPane" data-bs-toggle="tab" id="dealsCardsTab"
                                            role="tab">
                                        <span class="fe fe-sidebar"></span>
                                    </button>
                                </div> <!-- / .nav -->

                                <!-- Buttons -->
                                <a class="btn btn-primary ms-2" th:href="@{/payments}">
                                    All Payments
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Nav -->
                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                    <li class="nav-item d-none">
                                        <a class="nav-link text-nowrap active" href="#!">
                                            Total <span
                                                class="badge rounded-pill bg-secondary-soft"></span>
                                        </a>
                                    </li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <div class="row">
                    <div class="col-12 col-md-6">

                        <!-- Last name -->
                        <div class="form-group">

                            <!-- Label -->
                            <label class="form-label">
                                Member Institution
                            </label>

                            <!-- Input -->
                            <select class="form-select mb-3" data-choices id="memberInstitution"
                                    name="memberInstitution">
                                <option value="">Select...</option>
                                <th:block th:each="vh : ${memberInstitutionList}">
                                    <option th:value="${vh.id}">
                                        [[${vh}]]
                                    </option>
                                </th:block>
                            </select>
                        </div>

                    </div>

                </div> <!-- / .row -->
                <hr>
                <div class="row" id="invoiceDiv">
                    <div class="col-12 col-md-10">

                        <!-- Last name -->
                        <div class="form-group">

                            <!-- Label -->
                            <label class="form-label">
                                Invoices
                            </label>

                            <table class="table table-sm table-nowrap" id="invoiceTable">
                                <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Currency</th>
                                    <th scope="col">Amount</th>
                                    <th scope="col">Date</th>
                                    <th scope="col">Action</th>
                                </tr>
                                </thead>
                                <tbody id="invoiceTableBody"></tbody>
                            </table>

                        </div>
                    </div>
                </div>

            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 2502400; // 2502.4KB
    let memberInstitution;
    let invoiceDiv;
    let invoiceTable;
    let memberInstitutionInvoices = [];

    $(document).ready(function () {
        memberInstitution = $("#memberInstitution");
        invoiceDiv = $("#invoiceDiv");
        invoiceTable = $("#invoiceTable");
        invoiceDiv.hide();

        memberInstitution.on("change", function (e) {
            e.preventDefault();
            /*    invoiceDiv.hide();

                if ($("#invoiceTable tr").length > 0) {
                    $("#invoiceTable").find('tbody').empty();
                    console.log("emptied");
                }
    */
            if (memberInstitutionInvoices.length > 0) {
                memberInstitutionInvoices.pop();
                loadInvoicesForInstitutions();
            }
        })
    });

    function loadInvoicesForInstitutions() {
        let selectedInstitution = $("#memberInstitution option:selected");
        let memberInstitutionId = selectedInstitution.val();
        let url = moduleURL + "invoices/rest/list-by-institution/" + memberInstitutionId;

        $.get(url, function (responseJSON) {
            $.each(responseJSON, function (index, item) {
                memberInstitutionInvoices.push(item);
            })
        }).done(function () {
            showToastMessage("All invoices have been loaded");
        }).fail(function () {
            showToastMessage("Error loading invoices");
        });

        if (memberInstitutionInvoices.length > 0) invoiceDiv.show();

        $.each(memberInstitutionInvoices, function (index, item) {
            $("#invoiceTable tbody").append('<tr>' +
                '<td>' + item.serial + '</td>' +
                '<td>' + item.currency + '</td>' +
                '<td>' + item.netAmount + '</td>' +
                '<td>' + item.invoiceDate + '</td>' +
                '</tr>');
        });

        console.log("loaded");
    }

    function showToastMessage(message) {
        $("#toastMessage").text(message);
        $(".toast").toast('show');
    }

</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>
</body>

</html>
