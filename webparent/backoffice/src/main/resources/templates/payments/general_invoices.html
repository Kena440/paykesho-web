<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Finance Mgt','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">

                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Admin
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    Unpaid Invoices
                                </h1>

                            </div>
                            <div class="col-auto">

                                <!-- Navigation (button group) -->
                                <div class="nav btn-group d-inline-flex d-none" role="tablist">
                                    <button aria-controls="dealsListPane" aria-selected="true"
                                            class="btn btn-white active"
                                            data-bs-target="#dealsListPane" data-bs-toggle="tab" id="dealsListTab"
                                            role="tab">
                                        <span class="fe fe-list"></span>
                                    </button>
                                    <button aria-controls="dealsCardsPane" aria-selected="false" class="btn btn-white"
                                            data-bs-target="#dealsCardsPane" data-bs-toggle="tab" id="dealsCardsTab"
                                            role="tab">
                                        <span class="fe fe-sidebar"></span>
                                    </button>
                                </div> <!-- / .nav -->

                            </div>
                        </div> <!-- / .row -->
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Nav -->
                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                    <li class="nav-item">
                                        <a class="nav-link text-nowrap active" href="#!">
                                            Total <span
                                                class="badge rounded-pill bg-secondary-soft">[[${totalItems}]]</span>
                                        </a>
                                    </li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div> <!-- / .row -->
    </div>

    <div class="tab-content">
        <div aria-labelledby="dealsListTab" class="tab-pane fade show active" id="dealsListPane" role="tabpanel">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <div class="col-12">

                        <!-- Card -->
                        <div class="card"
                             data-list='{"valueNames": ["item-name", "item-stage", "item-amount", "item-owner", "item-contacted"], "page": 10, "pagination": {"paginationClass": "list-pagination"}}'
                             id="dealsList">
                            <div class="card-header">
                                <div class="row align-items-center">
                                    <div th:replace="fragments/fragments :: search_form()"></div>
                                    <div class="col-auto me-n3">

                                        <!-- Select -->
                                        <form>
                                            <select class="form-select form-select-sm form-control-flush"
                                                    data-choices='{"searchEnabled": false}'>
                                                <option selected>5 per page</option>
                                                <option>10 per page</option>
                                                <option>All</option>
                                            </select>
                                        </form>

                                    </div>
                                    <div class="col-auto">

                                        <!-- Dropdown -->
                                        <div class="dropdown">

                                            <button class="btn btn-sm btn-white" onclick="clearFilter()" type="button">
                                                <i class="fe fe-sliders me-1"></i> Clear <span
                                                    class="badge bg-primary ms-1 d-none">0</span>
                                            </button>

                                        </div>

                                    </div>
                                </div> <!-- / .row -->
                            </div>
                            <div class="table-responsive">
                                <table class="table table-sm table-hover table-nowrap card-table"
                                       th:if="${invoiceList.size() > 0}">
                                    <thead>
                                    <tr>
                                        <th class="list-sort text-muted" scope="col">
                                            <a class="disabled" href="#">#</a>
                                        </th>
                                        <th class="list-sort text-muted" scope="col"
                                            style="width: 15%"
                                            th:replace="fragments/fragments :: column_Link('invoiceType', 'Type','none')">
                                        </th>
                                        <th class="list-sort text-muted" scope="col"
                                            style="width: 15%"
                                            th:replace="fragments/fragments :: column_Link('serial', 'Serial','none')">
                                        </th>
                                        <th class="list-sort text-muted" scope="col"
                                            style="width: 15%"
                                            th:replace="fragments/fragments :: column_Link('recipientName', 'Recipient','none')">
                                        </th>
                                        <th scope="col"
                                            th:replace="fragments/fragments :: column_Link('currency', 'Currency', 'none')">
                                        </th>
                                        <th scope="col"
                                            th:replace="fragments/fragments :: column_Link('netAmount', 'Invoice Amount', 'none')">
                                        </th>
                                        <th scope="col"
                                            th:replace="fragments/fragments :: column_Link('invoiceDate', 'Invoice Date', 'none')">
                                        </th>
                                        <th scope="col"
                                            th:replace="fragments/fragments :: column_Link('paid', 'Status', 'none')">
                                        </th>
                                        <th class="list-sort text-muted" scope="col">
                                            <a class="disabled" href="#">Action</a>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody class="list fs-base">
                                    <tr th:each="invoice, invoiceStat : ${invoiceList}">
                                        <td class="hideable-column">[[${invoiceStat.count}]]</td>
                                        <td>
                                            <th:block
                                                    th:if="${invoice.invoiceType == T(org.commons.enums.InvoiceType).SINGLE}">
                                                <div class="badge bg-info">
                                                    Single
                                                </div>
                                            </th:block>
                                            <th:block
                                                    th:if="${invoice.invoiceType == T(org.commons.enums.InvoiceType).BULK}">
                                                <div class="badge bg-secondary">
                                                    Bulk
                                                </div>
                                            </th:block>
                                        </td>
                                        <td>[[${invoice.serial}]]</td>
                                        <td>[[${invoice.recipientName}]]</td>
                                        <td>[[${invoice.currency.code}]]</td>
                                        <td>[[${invoice.netAmount}]]</td>
                                        <td>
                                            <time datetime="2018-04-23"
                                                  th:replace="fragments/fragments :: format_date(${invoice.invoiceDate})"></time>
                                        </td>
                                        <td>
                                            <th:block th:if="${invoice.paid == true}">
                                                <div class="badge bg-success">
                                                    Paid
                                                </div>
                                            </th:block>
                                            <th:block th:if="${invoice.paid == false}">
                                                <div class="badge bg-danger">
                                                    Pending Payment
                                                </div>
                                            </th:block>
                                        </td>
                                        <td>
                                            <a class="fe fe-file"
                                               th:href="@{'/general-invoices/view/'+${invoice.id}}"
                                               title="View Invoice">
                                            </a>
                                            <th:block th:if="${invoice.approved == true}">
                                                <th:block sec:authorize="hasAnyAuthority('Finance', 'ELASAH')">
                                                    <a class="fe fe-check-circle"
                                                       th:href="@{'/general-payments/invoice-payment/'+${invoice.id}}"
                                                       title="Confirm Payment">
                                                    </a>
                                                    &nbsp;
                                                    <a class="fe fe-file"
                                                       th:href="@{'/general-payments/receipt/'+${invoice.id}}"
                                                       title="View Receipt">
                                                    </a>
                                                    <!--<div th:replace="fragments/fragments :: confirm_payment(${invoice.id}, 'invoice', '/payments/save/' + ${invoice.id}, true)"></div>-->
                                                    <!--Add link to payment confirmation page showing payment items history and also invoice values-->

                                                </th:block>
                                            </th:block>
                                            <th:block th:if="${invoice.approved == false}">
                                                <div class="badge bg-danger">
                                                    Pending Approval
                                                </div>
                                            </th:block>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="card-footer d-flex justify-content-between">

                                <div th:replace="fragments/fragments :: pagnation('invoices')"></div>

                            </div>
                        </div>

                    </div>
                </div> <!-- / .row -->
            </div>
        </div>
    </div>

</div><!-- / .main-content -->
<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/modal_fragment :: confirm_payment_modal"></footer>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/general-payments/confirm}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'invoice');
        });

        $(".link-confirm-payment").on("click", function (e) {
            e.preventDefault();
            showConfirmPaymentModal($(this), 'invoice');
        });
    });

    function showConfirmPaymentModal(link, entityName) {
        entityId = link.attr("entityId");
        $("#yesPaymentButton").attr("href", link.attr("href"))
        $("#confirmPaymentText").text("Are you sure you want to confirm payment of this invoice ?");
        $("#confirmPaymentModal").modal("show");
    }
</script>
</body>

</html>
