<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="divDonationItemDetails" th:fragment="content">
    <th:block th:each="detail, status : ${memberInstitutionDonation.donationItems}">
        <div class="row" th:id="'divDetail' + ${status.index}">
            <input name="detailIDs" th:value="${detail.id}" type="hidden">
            <div class="col-12 col-md-3">
                <div class="form-group">
                    <label class="form-label">
                        Description
                    </label>
                    <input class="form-control" name="description" th:value="${detail.description}"
                           type="text">
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="form-group">
                    <label class="form-label">
                        Amount
                    </label>
                    <input class="form-control" name="amount" th:value="${detail.amount}"
                           type="number">
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="form-group">
                    <label class="form-label">
                        Action
                    </label>
                    <br>
                    <button class="btn fe fe-delete fa-3x icon-dark float-right"
                            name="linkRemoveDetail"
                            title="Remove this detail"
                            type="button">
                        Remove
                    </button>
                </div>
            </div>

        </div>
        <hr>
    </th:block>

    <div class="row" th:id="'divDetail' + ${#lists.size(memberInstitutionDonation.donationItems)}">
        <input name="detailIDs" type="hidden" value="0">
        <div class="col-12 col-md-3">
            <div class="form-group">
                <label class="form-label">
                    Description
                </label>
                <input class="form-control" name="description" type="text">
            </div>
        </div>
        <div class="col-12 col-md-3">
            <div class="form-group">
                <label class="form-label">
                    Amount
                </label>
                <input class="form-control" name="amount" type="number">
            </div>
        </div>
    </div>

</div>
</body>
</html>
