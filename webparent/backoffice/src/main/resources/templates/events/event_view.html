<body>


<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">

                <!-- Header -->
                <div class="header mt-md-5">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Events
                                </h6>
                                <th:block th:if="${announcement.requiresResponse == true}">
                                    <div class="badge bg-warning">
                                        <h3 id="countdown"></h3>
                                    </div>
                                </th:block>
                            </div>
                            <div class="col-auto">
                                <h2 class="mb-2">
                                    <a th:href="@{'/events/view/'+${announcement.id}}">
                                        [[${announcement.name}]]
                                    </a>
                                </h2>
                            </div>
                            <div class="col-auto">

                                <th:block th:if="${announcement.requiresResponse == true}">
                                    <button class="btn btn-primary" data-bs-target="#eventUpdateModal"
                                            data-bs-toggle="modal"
                                            type="button">
                                        <span class="fe fe-message-square"></span>
                                        Send Update
                                    </button>
                                </th:block>
                            </div>
                        </div> <!-- / .row -->
                    </div>
                </div>

                <!-- Content -->
                <div class="card card-body p-5">
                    <div class="row">
                        <div class="col text-end">

                            <!-- Badge -->

                            <th:block th:if="${announcement.enabled == true}">
                                <div class="badge bg-success">
                                    Enabled
                                </div>
                            </th:block>
                            <th:block th:if="${announcement.enabled == false}">
                                <div class="badge bg-danger">
                                    Not enabled
                                </div>
                            </th:block>
                        </div>
                    </div> <!-- / .row -->

                    <th:block th:if="${announcement.requiresResponse == true}">
                        <div class="row">
                            <div class="header">
                                <div class="container-fluid">
                                    <div class="header-body mt-n5 mt-md-n6">
                                        <div class="row align-items-center">
                                            <div class="col">
                                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                                    <li class="nav-item">
                                                        <a class="nav-link" data-toggle="tab"
                                                           href="#infoTab">
                                                            Info
                                                        </a>
                                                    </li>
                                                    <li class="nav-item">
                                                        <a class="nav-link active" data-toggle="tab"
                                                           href="#attendeesTab">
                                                            Attendees
                                                        </a>
                                                    </li>
                                                    <li class="nav-item">
                                                        <a class="nav-link" data-toggle="tab" href="#vendorsTab">
                                                            Vendors
                                                        </a>
                                                    </li>
                                                    <li class="nav-item">
                                                        <a class="nav-link" data-toggle="tab" href="#attendanceTab">
                                                            Attendance
                                                        </a>
                                                    </li>
                                                    <li class="nav-item">
                                                        <a class="nav-link" data-toggle="tab" href="#scheduleTab">
                                                            Schedule
                                                        </a>
                                                    </li>
                                                    <li class="nav-item">
                                                        <a class="nav-link" data-toggle="tab" href="#reportsTab">
                                                            Reports
                                                        </a>
                                                    </li>
                                                    <li class="nav-item">
                                                        <a class="nav-link" data-toggle="tab" href="#miscTab">
                                                            Miscellaneous
                                                        </a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="container-fluid">
                                <div class="tab-content">
                                    <div class="tab-pane fade" id="infoTab">
                                        <div class="row">
                                            <div th:replace="events/view_tabs/info :: content"></div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade show active" id="attendeesTab">
                                        <div class="row">
                                            <div th:replace="events/view_tabs/attendees :: content"></div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="vendorsTab">
                                        <div class="row">
                                            <div th:replace="events/view_tabs/vendors :: content"></div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="attendanceTab">
                                        <div class="row">
                                            <div th:replace="events/view_tabs/attendance :: content"></div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="scheduleTab">
                                        <div class="row">
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="reportsTab">
                                        <div class="row">
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="miscTab">
                                        <div class="row">
                                        </div>
                                    </div>

                                </div>
                                <!-- / .row -->
                            </div>
                        </div>
                    </th:block>

                </div>

            </div>
        </div> <!-- / .row -->
    </div>

    <div aria-hidden="true" aria-labelledby="exampleModalLabel" class="modal fade" id="attendeeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Add Attendee Record</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>

                <form method="post"
                      th:action="@{/events/save-attendee}">
                    <input id="eventId" name="eventId" th:value="${announcement.id}"
                           type="hidden"/>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Type
                                    </label>

                                    <select class="form-select mb-3" data-choices name="attendeeType" required>
                                        <option value="">Select...</option>

                                        <th:block
                                                th:each="ps : ${T(org.commons.enums.AttendeeType).values()}">
                                            <option th:defaultDescription="${ps.name()}"
                                                    th:text="${ps}"
                                                    th:value="${ps}">
                                            </option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Title/Position
                                    </label>
                                    <input class="form-control" name="attendeeTitlePosition" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Name
                                    </label>
                                    <input class="form-control" name="attendeeName" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Phone Number
                                    </label>
                                    <input class="form-control" name="attendeePhoneNumber" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Email
                                    </label>
                                    <input class="form-control" name="attendeeEmail" required type="email">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        NRC
                                    </label>
                                    <input class="form-control" name="attendeeNRC" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Organization
                                    </label>
                                    <input class="form-control" name="attendeeOrganization" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Province
                                    </label>
                                    <select class="form-select" data-choices name="attendeeProvince">
                                        <option value="">Select...</option>
                                        <th:block th:each="vh : ${stateList}">
                                            <option th:value="${vh.id}">
                                                [[${vh.name}]] ([[${vh.country.name}]])
                                            </option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        District
                                    </label>
                                    <input class="form-control" name="attendeeDistrict" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-6 d-none">
                                <div class="form-group">
                                    <label class="form-label">
                                        Accommodation
                                    </label>
                                    <select class="form-select" data-choices id="requiresAccomodation"
                                            name="requiresAccomodation" required>
                                        <option value="">Select...</option>
                                        <option value="true">Yes</option>
                                        <option value="false">No</option>
                                    </select>
                                </div>
                            </div>
                            <div id="accommodationDetails" style="display: none;">
                                <div class="col-12 col-md-12">
                                    <div class="form-group">
                                        <label class="form-label">
                                            Preferred Accomodation
                                        </label>
                                        <select class="form-select" data-choices name="accomodationOption">
                                            <option value="">Select...</option>
                                            <th:block th:each="vh : ${eventAccomodationOptions}">
                                                <option th:value="${vh.id}">
                                                    [[${vh}]]
                                                </option>
                                            </th:block>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label class="form-label">
                                            Sharing
                                        </label>
                                        <select class="form-select" data-choices id="accomodationSharing"
                                                name="accomodationSharing">
                                            <option value="">Select...</option>
                                            <option value="true">Yes</option>
                                            <option value="false">No</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                        <button class="btn btn-primary" type="submit">Save & Print</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div aria-hidden="true" aria-labelledby="exampleModalLabel" class="modal fade" id="vendorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="vendorModalLabel">Add Vendor Record</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>

                <form method="post"
                      th:action="@{/events/save-vendor}">
                    <input name="eventId" th:value="${announcement.id}"
                           type="hidden"/>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Name
                                    </label>
                                    <input class="form-control" name="vendorName" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Phone Number
                                    </label>
                                    <input class="form-control" name="vendorPhoneNumber" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Email
                                    </label>
                                    <input class="form-control" name="vendorEmail" required type="email">
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Organization
                                    </label>
                                    <input class="form-control" name="vendorOrganization" required type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Package
                                    </label>

                                    <select class="form-select"
                                            data-choices name="eventVendorPackage"
                                            required>
                                        <option value="">Select...</option>
                                        <th:block th:each="vh : ${packages}">
                                            <option th:value="${vh.id}">
                                                [[${vh}]]
                                            </option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        Payment Method
                                    </label>

                                    <!-- Input -->
                                    <select class="form-select mb-3" data-choices name="paymentMethod">
                                        <option value="">Select...</option>

                                        <th:block
                                                th:each="ps : ${T(org.commons.enums.PaymentMethod).values()}">
                                            <option th:defaultDescription="${ps.name()}"
                                                    th:text="${ps}"
                                                    th:value="${ps}">
                                            </option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                        <button class="btn btn-primary" type="submit">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div aria-hidden="true" aria-labelledby="exampleModalLabel" class="modal fade" id="eventUpdateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="">Send Event Update</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>

                <form method="post"
                      th:action="@{/events/attendees/send-reminder}">
                    <input name="eventId" th:value="${announcement.id}"
                           type="hidden"/>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Message
                                    </label>
                                    <textarea class="form-control form-control-xs"
                                              id="eventUpdateMessage"
                                              maxlength="256"
                                              minlength="3"
                                              name="eventUpdateMessage"
                                              placeholder="Event Update"
                                              required
                                              rows="5"
                                              type="text">
                                    </textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                        <button class="btn btn-primary" type="submit">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <div aria-hidden="true" aria-labelledby="exampleModalLabel" class="modal fade" id="attendeeAttendanceModal"
         tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

            </div>
        </div>
    </div>
</div><!-- / .main-content -->

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    contextPath = "[[@{/}]]";
    const requiresAccommodationSelect = document.getElementById('requiresAccomodation');
    const accommodationDetailsDiv = document.getElementById('accommodationDetails');
    const accomodationOptionSelect = document.getElementById('accomodationOption');
    const accomodationSharingSelect = document.getElementById('accomodationSharing');

    requiresAccommodationSelect.addEventListener('change', function () {
        const selectedValue = requiresAccommodationSelect.value;
        if (selectedValue === 'true') {
            accommodationDetailsDiv.style.display = 'block';
            accomodationOptionSelect.required = true;
            accomodationSharingSelect.required = true;
        } else {
            accommodationDetailsDiv.style.display = 'none';
            accomodationOptionSelect.required = false;
            accomodationSharingSelect.required = false;
        }
    });

    $(document).ready(function () {
        $("#eventUpdateMessage").richText();
    })

    const inactivityTimeout = 60; // in seconds
    let countdownValue = inactivityTimeout;

    function refreshPage() {
        location.reload(true);
    }

    function updateCountdown() {
        document.getElementById('countdown').textContent = `Refreshing in ${countdownValue} seconds`;
    }

    function resetTimer() {
        clearTimeout(inactivityTimer);
        countdownValue = inactivityTimeout;
        updateCountdown();
        inactivityTimer = setTimeout(refreshPage, inactivityTimeout * 1000);
    }

    document.addEventListener('mousemove', resetTimer);
    document.addEventListener('keydown', resetTimer);

    let inactivityTimer = setTimeout(refreshPage, inactivityTimeout * 1000);

    // Update countdown every second
    setInterval(function () {
        countdownValue -= 1;
        if (countdownValue >= 0) {
            updateCountdown();
        }
    }, 1000);

</script>
<script th:src="@{/assets/js/announcement/event_attendee_details.js}" type="text/javascript"></script>

</body>

</html>
