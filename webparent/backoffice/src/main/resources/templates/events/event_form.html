<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Event Mgt','none')"></head>

<body>


<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">

                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Event Management
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    [[${pageTitle}]]
                                </h1>

                            </div>
                            <div class="col-auto">

                                <!-- Navigation (button group) -->
                                <div class="nav btn-group d-inline-flex d-none" role="tablist">
                                    <button aria-controls="dealsListPane" aria-selected="true"
                                            class="btn btn-white active"
                                            data-bs-target="#dealsListPane" data-bs-toggle="tab" id="dealsListTab"
                                            role="tab">
                                        <span class="fe fe-list"></span>
                                    </button>
                                    <button aria-controls="dealsCardsPane" aria-selected="false" class="btn btn-white"
                                            data-bs-target="#dealsCardsPane" data-bs-toggle="tab" id="dealsCardsTab"
                                            role="tab">
                                        <span class="fe fe-sidebar"></span>
                                    </button>
                                </div> <!-- / .nav -->

                                <!-- Buttons -->
                                <a class="btn btn-primary ms-2" th:href="@{/events}">
                                    Events
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Nav -->
                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                    <li class="nav-item d-none">
                                        <a class="nav-link text-nowrap active" href="#!">
                                            Total <span
                                                class="badge rounded-pill bg-secondary-soft"></span>
                                        </a>
                                    </li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form enctype="multipart/form-data"
                      method="post"
                      onsubmit="return checkEventUnique(this)"
                      th:action="@{/events/save}"
                      th:object="${announcement}">
                    <input id="id" th:field="*{id}" type="hidden"/>

                    <div class="row justify-content-between align-items-center">
                        <div class="col">
                            <div class="row align-items-center">
                                <div class="col-auto">

                                    <!-- Avatar -->
                                    <div class="avatar">
                                        <img alt="..." class="avatar-img rounded-circle"
                                             id="thumbnail" th:src="@{${announcement.photosImagePath}}">
                                    </div>

                                </div>
                                <div class="col ms-n2">

                                    <!-- Heading -->
                                    <h4 class="mb-1">
                                        Event Photo
                                    </h4>

                                    <!-- Text -->
                                    <small class="text-muted">
                                        <p class="font-size-xs text-muted" id="fileImageName"
                                           th:if="${announcement.photos == null}">
                                        <p class="font-size-xs text-muted" id="fileImageName"
                                           th:if="${announcement.photos != null}" th:text="${announcement.photos}">
                                        </p>
                                    </small>

                                </div>
                            </div> <!-- / .row -->
                        </div>
                        <div class="col-auto">

                            <input th:field="*{photos}" type="hidden">
                            <input accept="image/png, image/jpeg" capture="user" class="m-2 form-control" id="fileImage"
                                   name="image" type="file">

                        </div>
                    </div> <!-- / .row -->

                    <!-- Divider -->
                    <hr class="my-5">

                    <div class="row">
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Name
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="name" maxlength="45"
                                       minlength="2" placeholder="Name" required
                                       th:field="*{name}"
                                       type="text">
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Date
                                </label>

                                <input class="form-control" required th:field="*{updatedTimeOnForm}" type="date">

                            </div>
                        </div>
                        <div class="col-12 col-md-6">

                            <!-- Last name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Details
                                </label>

                                <!-- Input -->
                                <textarea class="form-control" id="details" placeholder="Details"
                                          required rows="4" th:field="*{details}"
                                          type="text">
                                </textarea>
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Number of Days
                                </label>

                                <input class="form-control" max="10" min="1" required th:field="*{eventDays}"
                                       type="number">

                            </div>
                        </div>
                        <div class="col-12 col-md-3">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Enabled
                                </label>

                                <!-- Input -->
                                <input class="form-check-input is-invalid" id="enabledInput" th:field="*{enabled}"
                                       type="checkbox">
                            </div>

                        </div>
                        <div class="col-12 col-md-3">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Requires Reponse
                                </label>

                                <!-- Input -->
                                <input class="form-check-input is-invalid" id="requiresResponse"
                                       th:field="*{requiresResponse}"
                                       type="checkbox">
                            </div>

                        </div>

                    </div> <!-- / .row -->

                    <div class="col-12 col-md-6" sec:authorize="hasAnyAuthority('General', 'Admin')">
                        <button class="btn btn-primary" type="submit">Submit</button>
                        <button class="btn btn-secondary" id="btnCancel" type="button">Cancel</button>
                    </div>


                </form>

                <br><br>

            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkEventUnique(form) {
        url = "[[@{/events/rest/check-announcement}]]";
        eventName = $("#name").val();
        eventId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {id: eventId, name: eventName, _csrf: csrfValue};

        $.post(url, params, function (response) {
            if (response === "OK") {
                form.submit();
            } else if (response === "Duplicated") {
                showWarningModal("There is another announcement having the email " + eventName);
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>

</body>


</html>
