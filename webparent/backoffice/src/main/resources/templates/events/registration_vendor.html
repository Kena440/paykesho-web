<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Event Mgt','none')"></head>

<body>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Event Management
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    [[${pageTitle}]]
                                </h1>

                            </div>
                            <div class="col-auto">
                                <!-- Buttons -->
                                <a class="btn btn-primary ms-2" th:href="@{/events}">
                                    Events
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row">
                            <div class="col text-center">

                                <!-- Title -->
                                <h2 class="mb-2">
                                    <img alt="..." class="img-fluid mb-4" style="max-width: 4.5rem;"
                                         th:src="@{/assets/img/logo.svg}">
                                    &nbsp;
                                    <a th:href="@{'/events/view/'+${announcement.id}}">
                                        [[${announcement.name}]]
                                    </a>
                                </h2>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-12 col-md-4">

                                <!-- Heading -->
                                <h6 class="text-uppercase text-muted">
                                    Name
                                </h6>

                                <!-- Text -->
                                <p class="text-muted mb-4">
                                    <strong class="text-body">[[${announcement.name}]]</strong>
                                </p>


                            </div>
                            <div class="col-12 col-md-4 text-center">

                                <img alt="..." class="img-fluid mb-4" style="max-width: 8.5rem;"
                                     th:src="@{${qrCodeContent}}">


                            </div>
                            <div class="col-12 col-md-4 text-md-end">
                                <!-- Heading -->
                                <h6 class="text-uppercase text-muted">
                                    Details
                                </h6>

                                <!-- Text -->
                                <p class="text-muted mb-4">
                                    <strong class="text-body">[[${announcement.details}]]</strong>
                                </p>
                                <!-- Text -->
                                <p class="mb-4">
                                    <time datetime="2018-04-23"
                                          th:replace="fragments/fragments :: format_date(${announcement.eventDate})"></time>
                                </p>


                            </div>
                        </div>
                        <hr>
                        <th:block th:if="${announcement.requiresResponse == true}">
                            <div class="card">
                                <div class="card-body">
                                    <form enctype="multipart/form-data"
                                          method="post"
                                          th:action="@{/events/registration/vendor/save}"
                                          th:object="${eventVendorRegistration}">
                                        <input id="id" th:field="*{id}" type="hidden"/>
                                        <input id="announcement" th:field="*{announcement}" type="hidden"/>

                                        <div class="row">
                                            <div class="col-12 col-md-6">

                                                <!-- First name -->
                                                <div class="form-group">

                                                    <!-- Label -->
                                                    <label class="form-label">
                                                        Name
                                                    </label>

                                                    <!-- Input -->
                                                    <input class="form-control" id="name" maxlength="128"
                                                           minlength="2" placeholder="Name" required
                                                           th:field="*{name}"
                                                           type="text">
                                                </div>

                                            </div>
                                            <div class="col-12 col-md-6">

                                                <!-- First name -->
                                                <div class="form-group">

                                                    <!-- Label -->
                                                    <label class="form-label">
                                                        Phone Number
                                                    </label>

                                                    <!-- Input -->
                                                    <input class="form-control" id="phoneNumber" maxlength="128"
                                                           minlength="2" placeholder="Phone" required
                                                           th:field="*{phoneNumber}"
                                                           type="text">
                                                </div>

                                            </div>
                                            <div class="col-12 col-md-6">

                                                <!-- First name -->
                                                <div class="form-group">

                                                    <!-- Label -->
                                                    <label class="form-label">
                                                        Email
                                                    </label>

                                                    <!-- Input -->
                                                    <input class="form-control" id="email" maxlength="108"
                                                           minlength="2" placeholder="Email" required
                                                           th:field="*{email}"
                                                           type="email">
                                                </div>

                                            </div>
                                            <div class="col-12 col-md-6">

                                                <!-- First name -->
                                                <div class="form-group">

                                                    <!-- Label -->
                                                    <label class="form-label">
                                                        Organization
                                                    </label>

                                                    <!-- Input -->
                                                    <input class="form-control" id="organization" maxlength="128"
                                                           minlength="2" placeholder="Org." required
                                                           th:field="*{organization}"
                                                           type="text">
                                                </div>

                                            </div>
                                            <div class="col-12 col-md-6">

                                                <!-- First name -->
                                                <div class="form-group">

                                                    <!-- Label -->
                                                    <label class="form-label">
                                                        Package
                                                    </label>

                                                    <!-- Input -->
                                                    <select class="form-select mb-3"
                                                            data-choices required="required"
                                                            th:field="*{eventVendorPackage}">
                                                        <option value="">Select...</option>
                                                        <th:block th:each="vh : ${packages}">
                                                            <option th:value="${vh.id}">
                                                                [[${vh}]]
                                                            </option>
                                                        </th:block>
                                                    </select>
                                                </div>

                                            </div>

                                            <div class="col-12 col-md-6">

                                                <!-- First name -->
                                                <div class="form-group">

                                                    <!-- Label -->
                                                    <label class="form-label">
                                                        Payment Method
                                                    </label>

                                                    <!-- Input -->
                                                    <select class="form-select mb-3" data-choices id="paymentMethod"
                                                            th:field="*{paymentMethod}">
                                                        <option value="">Select...</option>

                                                        <th:block
                                                                th:each="ps : ${T(org.commons.enums.PaymentMethod).values()}">
                                                            <option th:defaultDescription="${ps.name()}"
                                                                    th:text="${ps}"
                                                                    th:value="${ps}">
                                                            </option>
                                                        </th:block>
                                                    </select>
                                                </div>

                                            </div>


                                        </div> <!-- / .row -->

                                        <div class="col-12 col-md-6">
                                            <button class="btn btn-primary" type="submit">Submit</button>
                                            <button class="btn btn-secondary" id="btnCancel" type="button">Cancel
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </th:block>
                    </div>
                </div>
                <!-- Form -->
            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>

</body>


</html>
