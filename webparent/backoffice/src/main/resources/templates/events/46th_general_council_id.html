<!DOCTYPE html>
<html lang="en">

<!-- Mirrored from dashkit.goodthemes.co/ by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 11 May 2022 13:04:22 GMT -->
<!-- Added by HTTrack -->
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Event ID','none')"></head>

<body>


<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <input id="fileSerial" th:value="${eventAttendeeRegistration.eventRegId}" type="hidden">

        <div class="row justify-content-center">
            <div class="col-12">

                <!-- Header -->
                <div class="header mt-md-5">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Events
                                </h6>

                            </div>
                            <div class="col-auto">


                            </div>
                        </div> <!-- / .row -->
                    </div>
                </div>

                <!-- Content -->
                <div class="card card-body p-5">
                    <div class="row">
                        <div class="col-6 text-start">
                            <!-- Badge -->
                            <a class="fe fe-chevron-left"
                               th:href="@{'/events/view/'+${eventAttendeeRegistration.announcement.id}}"
                               title="Back to announcement...">
                                ...Back
                            </a>
                        </div>
                        <div class="col-6 text-end">
                            <!-- Badge -->
                            <th:block th:if="${eventAttendeeRegistration.approved == true}">
                                <div class="badge bg-success">
                                    Approved
                                </div>
                            </th:block>
                            <th:block th:if="${eventAttendeeRegistration.approved == false}">
                                <div class="badge bg-danger">
                                    Not Approved
                                </div>
                            </th:block>

                            <button class="btn btn-white lift" id="print">Print</button>

                        </div>
                    </div> <!-- / .row -->
                    <div class="row">
                        <div class="col text-center">

                            <!-- Title -->
                            <h2 class="mb-2">
                                <a th:href="@{'/events/view/'+${eventAttendeeRegistration.announcement.id}}">
                                    [[${eventAttendeeRegistration.announcement.name}]]
                                </a>
                            </h2>
                        </div>
                    </div>
                    <hr>
                    <div class="row" id="print-section" style="height: 900px">
                        <div class="col-12 col-md-6">
                            <!-- Heading -->
                            <h6 class="text-uppercase text-muted text-center">
                                Front
                            </h6>

                            <div class="card card-body"
                                 th:style="'background-image:url(' + ${frontImage}+ '); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; width: 70%; height: 80%;'">
                                <!-- Content goes here -->
                                <div class="row">
                                    <div class="col-md-6 text-start">
                                        <h3><strong>[[${eventAttendeeRegistration.packNumber}]]</strong></h3>
                                    </div>
                                    <div class="col-md-6 text-end">
                                        <th:block th:if="${eventAttendeeRegistration.qrCode != null}">
                                            <img alt="QR Code" style="max-width: 100%; height: auto;"
                                                 th:src="${eventAttendeeRegistration.qrCode}"/>
                                            <br>
                                            <small class="text-white">[[${eventAttendeeRegistration.eventRegId}]]</small>
                                        </th:block>
                                    </div>
                                </div>
                                <br><br>
                                <br><br>
                                <br><br>
                                <br><br>
                                <br><br>
                                <br><br>
                                <br><br>
                                <br>
                                <div class="row">
                                    <div class="col-md-12 text-center">
                                        <h3 class="display-4 text-center mb-3 uppercase">
                                            [[${eventAttendeeRegistration.name}]]
                                        </h3>
                                    </div>
                                </div>
                            </div>

                        </div>
                        <div class="col-12 col-md-6">
                            <!-- Heading -->
                            <h6 class="text-uppercase text-muted text-center">
                                Back
                            </h6>

                            <div class="card card-body"
                                 th:style="'background-image:url(' + ${backImage}+ '); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; width: 70%; height: 80%;'">

                            </div>
                        </div>
                    </div>
                    <br>

                </div>

            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->

<footer th:replace="fragments/fragments:: js_code"></footer>
<script th:src="@{/assets/js/events/print.js}" type="text/javascript"></script>

<script type="text/javascript">
    contextPath = "[[@{/}]]";
    const csrfHeaderName = "[[${_csrf.headerName}]]";
    let csrfValue = "[[${_csrf.token}]]";

</script>
</body>


</html>
