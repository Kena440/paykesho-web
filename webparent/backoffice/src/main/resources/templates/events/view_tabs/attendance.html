<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
    <div class="row">
        <div class="col-12 col-md-6">

            <!-- Heading -->
            <h6 class="text-uppercase ">
                Attendance Register (Barcode Scanner Compatible)
            </h6>
        </div>
        <div class="col-12 col-md-6 text-md-end">
            <button class="btn btn-primary" data-bs-target="#vendorModal" data-bs-toggle="modal"
                    type="button">
                <span class="fe fe-file-plus"></span>
                Record
            </button>
            <a class="btn btn-primary" th:href="@{'/events/export/excel/attendance/' + ${event.id}}">
                <span class="fe fe-printer"></span>
                Export
            </a>
        </div>
    </div>
    <div class="row" th:if="${eventAttendeeAttendances.size() > 0}">
        <div class="col-6 d-none">
            <input class="form-control" id="searchAttendeeAttendanceInput" placeholder="Search..." type="text">
        </div>

        <div class="col-12 col-md-6">
            <div class="table-responsive">
                <table class="table table-sm table-bordered my-4" id="attendeeAttendanceTable">
                    <thead>
                    <tr>
                        <th class="px-0 bg-transparent border-top-0">
                            <span class="h6">#</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Name</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Day</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Date/Time</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Action</span>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="attendee, eventStat : ${eventAttendeeAttendances}">

                        <td class="px-0">
                            <small>[[${eventStat.count}]]</small>
                        </td>
                        <td class="px-0 text-center">
                            <small>[[${attendee.eventAttendeeRegistration.name}]]</small>
                        </td>
                        <td class="px-0 text-center" style="width: auto;">
                            <small>[[${attendee.eventDay}]] of
                                [[${attendee.eventAttendeeRegistration.event.eventDays}]]</small>
                        </td>
                        <td class="px-0 text-sm-center">
                            <small>
                                <time datetime="2018-04-23"
                                      th:replace="fragments/fragments :: format_date(${attendee.signedDate})"></time>
                            </small>
                        </td>
                        <td class="px-0 text-center">
                            <th:block sec:authorize="hasAnyAuthority('General', 'Admin')">
                                <a class="fe fe-trash" th:href="@{'/events/attendee-attendance/delete/'+${attendee.id}}"
                                   title="Delete">
                                </a>

                            </th:block>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <hr>
                <button class="btn btn-primary" id="showMoreBtn">Show More</button>
                <!--<div th:replace="fragments/fragments :: pagnation('attendees')"></div>-->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let currentIndex = 0;

            document.querySelector('#searchAttendeeAttendanceInput').addEventListener('input', function () {
                var searchQuery = this.value.toLowerCase();
                currentIndex = 0;
                var rows = document.querySelectorAll('#attendeeAttendanceTable tbody tr');
                rows.forEach(function (row) {
                    var rowData = row.textContent.toLowerCase();
                    if (rowData.includes(searchQuery)) {
                        row.style.display = 'table-row';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            let barcodeData = '';
            let interval = null;

            document.addEventListener("keydown", function (evt) {
                console.log(evt)
                if (evt.code === 'F12') {
                    evt.preventDefault();
                }

                if (evt.code === 'Enter' || evt.code === 'NumpadEnter') {
                    // Scanning is complete, process the barcode data
                    processBarcode(barcodeData);
                    barcodeData = ''; // Clear barcodeData for the next scan
                    return;
                }

                if (evt.key !== 'Shift') {
                    barcodeData += evt.key; // Accumulate the scanned characters
                }

                clearInterval(interval); // Clear the previous interval
                interval = setInterval(() => barcodeData = '', 20); // Reset barcodeData if no key events for 20ms
            });

            // Other code you want to run when the DOM is ready
        });

        function processBarcode(barcodeData) {
            // Make an API call to retrieve data
            const linkDetailURL = "/events/attendee/retrieve/" + barcodeData;
            $("#attendeeAttendanceModal").modal("show").find(".modal-content").load(linkDetailURL);
        }

    </script>
</div>
</body>
</html>
