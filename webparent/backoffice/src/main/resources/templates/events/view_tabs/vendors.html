<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
    <div class="row">
        <div class="col-12 col-md-6">

            <!-- Heading -->
            <h6 class="text-uppercase ">
                Registered Vendors : [[${vendorRegistrations.size()}]]
            </h6>
        </div>
        <div class="col-12 col-md-6 text-md-end">
            <button class="btn btn-primary" data-bs-target="#vendorModal" data-bs-toggle="modal"
                    type="button">
                <span class="fe fe-file-plus"></span>
                Vendor
            </button>
            <a class="btn btn-primary" th:href="@{'/events/export/excel/vendors/' + ${event.id}}">
                <span class="fe fe-printer"></span>
                Export
            </a>
        </div>
    </div>
    <div class="row" th:if="${vendorRegistrations.size() > 0}">
        <div class="col-6">
            <input class="form-control" id="searchVendorInput" placeholder="Search..." type="text">
        </div>
        <div class="col-12">

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-sm table-bordered my-4" id="vendorTable">
                    <thead>
                    <tr>
                        <th class="px-0 bg-transparent border-top-0 d-none">
                            <span class="h6">Event Reg</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Name</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Phone</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Email</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Organization</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Date</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Package</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Approved</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Action</span>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="vendor, eventStat : ${vendorRegistrations}">
                        <td class="px-0 text-center d-none">
                            <th:block th:if="${vendor.qrCode != null}">
                                <img alt="QR Code" height="50" th:src="${vendor.qrCode}"
                                     width="50"/>
                            </th:block>
                            <th:block th:unless="${vendor.qrCode != null}">
                                <span class="fe fe-loader"></span>
                            </th:block>
                        </td>
                        <td class="px-0 text-center">
                            <small>[[${vendor.name}]]</small>
                        </td>
                        <td class="px-0 text-center">
                            <small>[[${vendor.phoneNumber}]]</small>
                        </td>
                        <td class="px-0 text-center">
                            <small>[[${vendor.email}]]</small>
                        </td>
                        <td class="px-0 text-center">
                            <small>[[${vendor.organization}]]</small>
                        </td>
                        <td class="px-0 text-center">
                            <small>
                                <time datetime="2018-04-23"
                                      th:replace="fragments/fragments :: format_date(${vendor.registrationDate})"></time>
                            </small>
                        </td>
                        <td class="px-0 text-center">
                            <small>[[${vendor.eventVendorPackage}]]</small>
                        </td>
                        <td class="px-0 text-sm-center">
                            <th:block th:if="${vendor.approved == true}">
                                <div class="badge bg-success">
                                    Approved
                                </div>
                            </th:block>
                            <th:block th:if="${vendor.approved == false}">
                                <div class="badge bg-danger">
                                    Pending
                                </div>
                                &nbsp;
                                <a class="fe fe-check-circle"
                                   th:href="@{'/events/approve-vendor/'+${vendor.id}}"
                                   title="Approve">
                                </a>
                            </th:block>
                        </td>
                        <td class="px-0 text-center">
                            <th:block sec:authorize="hasAnyAuthority('General', 'Admin')">
                                <a class="fe fe-credit-card" th:href="@{'/events/vendor/print-id/'+${vendor.id}}"
                                   title="Print ID">
                                </a>
                                &nbsp;
                                <a class="fe fe-trash" th:href="@{'/events/vendor/delete/'+${vendor.id}}"
                                   title="Delete">
                                </a>
                                &nbsp;
                                <a class="fe fe-edit" th:href="@{'/events/vendor/edit/'+${vendor.id}}"
                                   title="Edit">
                                </a>
                            </th:block>
                        </td>
                    </tr>

                    </tbody>
                </table>
                <hr>
                <button class="btn btn-primary" id="showMoreBtn">Show More</button>

                <!-- <div th:replace="fragments/fragments :: pagnation('vendors')"></div>-->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let currentIndex = 0;

            document.querySelector('#searchVendorInput').addEventListener('input', function () {
                var searchQuery = this.value.toLowerCase();
                currentIndex = 0;
                var rows = document.querySelectorAll('#vendorTable tbody tr');
                rows.forEach(function (row) {
                    var rowData = row.textContent.toLowerCase();
                    if (rowData.includes(searchQuery)) {
                        row.style.display = 'table-row';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });

    </script>
</div>
</body>
</html>
