<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Repayments Mgt','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Repayments Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <a class="btn btn-primary shadow-sm" th:href="@{/repayments/schedules}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> Repayments
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="alert alert-warning alert-dismissible" role="alert" th:if="${message != null}">
                            <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                    type="button"></button>
                            <div class="alert-icon">
                                <i class="fas fa-fw fa-lock"></i>
                            </div>
                            <div class="alert-message">
                                <strong>Hello there!</strong>
                                <span class="alert-inner--text">[[${message}]] 😎👍</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">A list of repayment schedules.</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped w-100" id="datatables-reponsive">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Ref.</th>
                                        <th>Amount Due</th>
                                        <th>Amount Paid</th>
                                        <th>Status</th>
                                        <th>Due Date</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="repaymentSchedule, repaymentScheduleStat : ${repaymentScheduleList}">
                                        <td class="hideable-column">[[${repaymentScheduleStat.count}]]</td>
                                        <td>
                                            <span class="font-weight-normal">
                                                    <span class="font-weight-normal"> [[${repaymentSchedule.reference}]]</span>
                                            </span>
                                        </td>
                                        <td><span class="font-weight-normal"
                                                  th:replace="fragments/fragments :: format_currency(${repaymentSchedule.amountDue})"></span>
                                        </td>
                                        <td><span class="font-weight-normal"
                                                  th:replace="fragments/fragments :: format_currency(${repaymentSchedule.amountPaid})"></span>
                                        </td>
                                        <td>
                                            <span class="font-weight-normal">[[${repaymentSchedule.status}]]</span>
                                        </td>
                                        <td><span class="font-weight-normal">[[${repaymentSchedule.dueDate}]]</span>
                                        </td>

                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/vouchers}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'voucher');
        });
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Datatables Responsive
        $("#datatables-reponsive").DataTable({
            destroy: true,
            responsive: true
        });
    });
</script>

</body>
</html>
