<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
>
<body>
<div th:fragment="content" th:remove="tag">
    <div style="width: 100%; margin: 0 auto">
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <p class="text-gray-500">
                        Use this page to manage Denominations which will be
                        displayed in the trip request forms
                        <br>
                        Click 'Load Denominations list' first
                    </p>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <button class="btn btn-primary mr-1" id="buttonLoadDenominations" type="submit">Load Denominations
                        list
                    </button>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <select class="form-control" id="dropDownDenominations" size="3" style="height: 200px"></select>
                </div>
            </div>
        </div>
        <form id="formDenomination">
            <div class="form-group row">
                <div class="col-6">
                    <div class="form-group">
                        <label for="fieldDenominationName" id="lblDenominationName">Denomination Name</label>
                        <input class="form-control form-control-xs"
                               id="fieldDenominationName"
                               maxlength="256"
                               minlength="3"
                               name="denominationName"
                               placeholder="Denomination Name"
                               required
                               type="text">
                    </div>
                </div>
                <div class="col-6 mt-1"><label for="fieldDenominationName">Actions</label>
                    <div class="text-left">
                        <button class="btn btn-primary mr-1 btn-xs" id="btnAddDenomination" type="button">New</button>
                        <button class="btn btn-primary mr-1 btn-xs" disabled="disabled" id="btnUpdateDenomination"
                                type="button"> Update
                        </button>
                        <button class="btn btn-secondary btn-xs" disabled="disabled" id="btnDeleteDenomination"
                                type="button">Delete
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
