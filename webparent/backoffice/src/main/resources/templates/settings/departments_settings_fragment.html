<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
>
<body>
<div th:fragment="content" th:remove="tag">
    <div style="width: 100%; margin: 0 auto">
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <p class="text-gray-500">
                        Use this page to manage Departments which will be
                        displayed in the trip request forms
                        <br>
                        Click 'Load Departments list' first
                    </p>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <button class="btn btn-primary mr-1" id="buttonLoadDepartments" type="submit">Load Departments list
                    </button>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <select class="form-control" id="dropDownDepartments" size="3" style="height: 200px"></select>
                </div>
            </div>
        </div>
        <form id="formDepartment">
            <div class="form-group row">
                <div class="col-3">
                    <div class="form-group">
                        <label for="fieldDepartmentName" id="lblDepartmentName">Department Name</label>
                        <input class="form-control form-control-xs"
                               id="fieldDepartmentName"
                               maxlength="256"
                               minlength="3"
                               name="departmentName"
                               placeholder="Department Name"
                               required
                               type="text">
                    </div>
                </div>
                <div class="col-3">
                    <div class="form-group">
                        <label for="fieldDepartmentCode" id="lblDepartmentCode">Department Code</label>
                        <input class="form-control form-control-xs"
                               id="fieldDepartmentCode"
                               maxlength="256"
                               minlength="3"
                               name="departmentCode"
                               placeholder="Department Code"
                               required
                               type="text">
                    </div>
                </div>
                <div class="col-3">
                    <div class="form-group">
                        <label for="fieldHodEmail" id="lblHodEmail">HOD Email</label>
                        <input class="form-control form-control-xs"
                               id="fieldHodEmail"
                               maxlength="156"
                               minlength="3"
                               name="hodEmail"
                               placeholder="Hod Email"
                               required
                               type="email">
                    </div>
                </div>
                <div class="col-6 mt-1"><label for="fieldDepartmentCode">Actions</label>
                    <div class="text-left">
                        <button class="btn btn-primary mr-1 btn-xs" id="btnAddDepartment" type="button">New</button>
                        <button class="btn btn-primary mr-1 btn-xs" disabled="disabled" id="btnUpdateDepartment"
                                type="button"> Update
                        </button>
                        <button class="btn btn-secondary btn-xs" disabled="disabled" id="btnDeleteDepartment"
                                type="button">Delete
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
