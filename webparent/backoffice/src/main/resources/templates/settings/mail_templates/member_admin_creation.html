<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
    <div style="width: 100%; margin: 0 auto">
        <div class="form-group row">
            <div class="col-12">
                <div class="form-group">
                    <label for="MEMBER_ADMIN_CREATION_SUBJECT"> MEMBER_ADMIN_CREATION_SUBJECT</label>
                    <input class="form-control form-control-xs"
                           id="MEMBER_ADMIN_CREATION_SUBJECT"
                           maxlength="256"
                           minlength="3"
                           name="MEMBER_ADMIN_CREATION_SUBJECT"
                           placeholder="MEMBER_ADMIN_CREATION_SUBJECT"
                           required
                           th:value="${MEMBER_ADMIN_CREATION_SUBJECT}"
                           type="text">
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-12">
                <div class="form-group">
                    <label for="MEMBER_ADMIN_CREATION_CONTENT"> MEMBER_ADMIN_CREATION_CONTENT</label>
                    <textarea class="form-control form-control-xs"
                              id="MEMBER_ADMIN_CREATION_CONTENT"
                              maxlength="256"
                              minlength="3"
                              name="MEMBER_ADMIN_CREATION_CONTENT"
                              placeholder="MEMBER_ADMIN_CREATION_CONTENT"
                              required
                              rows="5"
                              th:value="${MEMBER_ADMIN_CREATION_CONTENT}"
                              type="text">
                        [[${MEMBER_ADMIN_CREATION_CONTENT}]]
                    </textarea>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
