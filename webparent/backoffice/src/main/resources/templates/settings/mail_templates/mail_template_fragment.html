<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">

    <form method="post" style="width: 100%; margin: 0 auto"
          th:action="@{/settings/save-mail-templates}">
        <div>
            <!-- Nav -->
            <ul class="nav nav-tabs nav-tabs-sm nav-overflow" id="mailTemplatesTab">
                <li class="nav-item">
                    <a class="nav-link active" data-toggle="tab" href="#tripRequestMailTemplateTab">
                        Member Admin Creation
                    </a>
                </li>
            </ul>

            <!-- Content -->
            <div class="tab-content">
                <div class="tab-pane fade show active" id="tripRequestMailTemplateTab">
                    <div class="row justify-content-left py-9">
                        <div th:replace="settings/mail_templates/member_admin_creation :: content"></div>
                    </div>
                </div>
            </div>

            <div class="text-left">
                <button class="btn btn-primary mr-1" type="submit">Save</button>
                <button class="btn btn-secondary" id="btnCancel" type="button">Cancel</button>
            </div>

        </div>
    </form>
</div>

</body>
</html>
