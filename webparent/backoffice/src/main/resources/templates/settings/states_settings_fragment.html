<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
>
<body>
<div th:fragment="content" th:remove="tag">
    <div style="width: 100%; margin: 0 auto">
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <p class="text-gray-500">
                        Use this page to manage states which will be
                        displayed in the assessor registration.
                        <br>
                        Click 'Load Country list' first
                    </p>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <button class="btn btn-primary mr-1" id="buttonLoadCountriesForStates" type="submit">Load Country
                        list
                    </button>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <label for="dropDownCountriesForStates" id="lblCountryName">Country Name</label>
                    <select class="form-control" id="dropDownCountriesForStates"></select>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <label for="dropDownStates" id="lblStateDropdown">All States/Province</label>
                    <select class="form-control" id="dropDownStates" size="3" style="height: 300px"></select>
                </div>
            </div>
        </div>
        <form id="formState">
            <div class="form-group row">
                <div class="col-6">
                    <div class="form-group">
                        <label for="fieldStateName" id="lblStateName">All States/Province</label>
                        <input class="form-control form-control-xs"
                               id="fieldStateName"
                               maxlength="256"
                               minlength="3"
                               name="stateName"
                               placeholder="State Name"
                               required
                               type="text">
                    </div>
                </div>
                <div class="col-6 mt-1"><label>Actions</label>
                    <div class="text-left">
                        <button class="btn btn-primary mr-1 btn-xs" id="btnAddState" type="button">New</button>
                        <button class="btn btn-primary mr-1 btn-xs" disabled="disabled" id="btnUpdateState"
                                type="button"> Update
                        </button>
                        <button class="btn btn-secondary btn-xs" disabled="disabled" id="btnDeleteState" type="button">
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
