<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
>
<body>
<div th:fragment="content" th:remove="tag">
    <div style="width: 100%; margin: 0 auto">
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <p class="text-gray-500">
                        Use this page to manage funding projects which will be
                        displayed in the trip request forms
                        <br>
                        Click 'Load Projects list' first
                    </p>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <button class="btn btn-primary mr-1" id="buttonLoadProjects" type="submit">Load Projects list
                    </button>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-8">
                <div class="form-group">
                    <select class="form-control" id="dropDownProjects" size="3" style="height: 200px"></select>
                </div>
            </div>
        </div>
        <form id="formProject">
            <div class="form-group row">
                <div class="col-3">
                    <div class="form-group">
                        <label for="fieldProjectName" id="lblProjectName">Project Name</label>
                        <input class="form-control form-control-xs"
                               id="fieldProjectName"
                               maxlength="256"
                               minlength="3"
                               name="projectName"
                               placeholder="Project Name"
                               required
                               type="text">
                    </div>
                </div>
                <div class="col-3">
                    <div class="form-group">
                        <label for="fieldProjectCode" id="lblProjectCode">Project Code</label>
                        <input class="form-control form-control-xs"
                               id="fieldProjectCode"
                               maxlength="256"
                               minlength="3"
                               name="projectCode"
                               placeholder="Project Code"
                               required
                               type="text">
                    </div>
                </div>
                <div class="col-6 mt-1"><label for="fieldProjectCode">Actions</label>
                    <div class="text-left">
                        <button class="btn btn-primary mr-1 btn-xs" id="btnAddProject" type="button">New</button>
                        <button class="btn btn-primary mr-1 btn-xs" disabled="disabled" id="btnUpdateProject"
                                type="button"> Update
                        </button>
                        <button class="btn btn-secondary btn-xs" disabled="disabled" id="btnDeleteProject"
                                type="button">Delete
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
