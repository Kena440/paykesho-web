<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">

<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Dashboard','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <!-- HEADER -->
    <div class="header">
        <div class="container-fluid">

            <!-- Body -->
            <div class="header-body">
                <div class="row align-items-end">
                    <div class="col">

                        <!-- Pretitle -->
                        <h6 class="header-pretitle">
                            [[${country}]]
                        </h6>

                        <!-- Title -->
                        <h1 class="header-title">
                            Dashboard
                        </h1>

                    </div>
                    <div class="col-auto">

                        <!-- Button -->
                        <th:block sec:authorize="isAuthenticated()">
                            <a class="lift mr-2" sec:authentication="principal.username" th:href="@{/account}"></a>
                        </th:block>

                    </div>
                </div> <!-- / .row -->
            </div> <!-- / .header-body -->

        </div>
    </div> <!-- / .header -->

    <!-- CARDS -->
    <div class="container-fluid">

        <div class="row">
            <div class="col-12 col-xl-4">

                <!-- Traffic -->
                <div class="card">
                    <div class="card-body">
                        <div class="row align-items-center gx-0">
                            <div class="col">

                                <!-- Title -->
                                <h6 class="text-uppercase text-muted mb-2">
                                    Facility
                                </h6>

                                <!-- Heading -->
                                <span class="h2 mb-0" th:if="${memberInstitutionCount != null}"
                                      th:replace="fragments/fragments :: format_number(${memberInstitutionCount})"></span>


                            </div>
                            <div class="col-auto">

                                <!-- Icon -->
                                <span class="h2 fe fe-file-text text-muted mb-0"></span>

                            </div>
                        </div> <!-- / .row -->
                    </div>
                </div>
                <th:block th:if="${upcomingEvents.size() > 0}">
                    <div class="card">
                        <div class="card-header">

                            <!-- Title -->
                            <h4 class="card-header-title">
                                Upcoming Events
                            </h4>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive"
                                 data-list='{"valueNames": ["tables-row", "tables-first", "tables-last"]}'>
                                <table class="table table-sm">
                                    <thead>
                                    <tr>
                                        <th scope="col">
                                            <a class="text-muted list-sort" data-sort="tables-row" href="#">#</a>
                                        </th>
                                        <th scope="col">
                                            <a class="text-muted list-sort" data-sort="tables-first" href="#">Info</a>
                                        </th>
                                        <th scope="col">
                                            <a class="text-muted list-sort" data-sort="tables-last" href="#">Date</a>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody class="list">
                                    <tr th:each="event, eventStat : ${upcomingEvents}">
                                        <th class="tables-row" scope="row">[[${eventStat.count}]]</th>
                                        <td class="tables-first">
                                            <a th:href="@{'/events/view/'+${event.id}}"
                                               title="Event View">
                                                [[${event.name}]]
                                            </a>
                                        </td>
                                        <td class="tables-last">
                                            <time datetime="2018-04-23"
                                                  th:replace="fragments/fragments :: format_date(${event.eventDate})"></time>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </th:block>
                <div class="card">
                    <div class="card-header">

                        <!-- Title -->
                        <h4 class="card-header-title">
                            Facility Types
                        </h4>


                    </div>
                    <div class="card-body">
                        <canvas class="chart-canvas" id="memberTypeChart" style="width:100%;max-width:600px"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-12 col-xl-8">

                <!-- Traffic -->
                <div class="card">
                    <div class="card-header">

                        <!-- Title -->
                        <h4 class="card-header-title">
                            Facility Map
                        </h4>


                    </div>
                    <div class="card-body">

                        <div id='map' style='width: 100%; height: 500px'></div>

                    </div>
                </div>
            </div>
        </div> <!-- / .row -->
    </div>
</div><!-- / .main-content -->

<footer th:replace="fragments/fragments :: js_code"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>

<script type="text/javascript">
    let currYearTripData = [];
    let lastYearTripData = [];
    let memberTypes = [];
    let monthLabels = [];
    let memberTypesData = [];
    let memberGPSData = [];
    let memberGPSMapFeatures = [];
    contextPath = "[[@{/}]]";

    $(document).ready(function () {

        const memberTypesDataRequestUrl = contextPath + "facilties/rest/get-member-types-data/true";
        const memberGPSDataRequestUrl = contextPath + "facilties/rest/get-member-gps-data/true";

        $.get(memberTypesDataRequestUrl, function (responseJSON) {
            $.each(responseJSON, function (index, reportItem) {
                memberTypes.push(reportItem.identifier);
                memberTypesData.push(reportItem.itemCount);
            });

            generateMembersTypeChart();
        });

        $.get(memberGPSDataRequestUrl, function (responseJSON) {
            $.each(responseJSON, function (index, reportItem) {
                memberGPSData.push(reportItem);
            });

            $.each(memberGPSData, function (index, item) {
                var element = {
                    'type': 'Feature',
                    'geometry': {
                        'type': 'Point',
                        'coordinates': [item.longitude, item.latitude]
                    },
                    'properties': {
                        'title': item.title
                    }
                }

                memberGPSMapFeatures.push(element);
            })

            generateMembersGPSMap();
        });

    });

    function generateMembersTypeChart() {
        var barColors = [
            "#b91d47",
            "#00aba9",
            "#2b5797",
            "#e8c3b9"
        ];

        new Chart("memberTypeChart", {
            type: "doughnut",
            data: {
                labels: memberTypes,
                datasets: [{
                    backgroundColor: barColors,
                    data: memberTypesData
                }]
            },
            options: {
                title: {
                    display: true,
                    text: "Legend"
                }
            }
        });
    }

    function generateMembersGPSMap() {
        mapboxgl.accessToken = 'pk.eyJ1IjoiY2hhemRldmVsb3BlcjcwIiwiYSI6ImNsOG11dXptNTBjc2Mzb3A2aTg3aXkzMmQifQ.EpRXqn3-sQCu8qEu9l7nCA';
        var map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v11',
            zoom: 5.0,
            center: [28.5589884, -13.1189121]
        });

        map.on('load', () => {
            map.loadImage(
                contextPath + 'assets/img/marker.png',
                (error, image) => {
                    if (error) throw error;
                    map.addImage('custom-marker', image);
                    map.addSource('points', {
                        'type': 'geojson',
                        'data': {
                            'type': 'FeatureCollection',
                            'features': memberGPSMapFeatures
                        }
                    });

                    map.addLayer({
                        'id': 'points',
                        'type': 'symbol',
                        'source': 'points',
                        'layout': {
                            'icon-image': 'custom-marker',
                            'text-field': [
                                'format',
                                ['downcase', ['get', 'title']],
                                {'font-scale': 0.6},
                            ],
                            'text-font': [
                                'Open Sans Semibold',
                                'Arial Unicode MS Bold'
                            ],
                            'text-offset': [0, 0.60],
                            'text-anchor': 'top'
                        },
                        'paint': {
                            "text-color": "#000"
                        }
                    });
                }
            );
        });
        map.addControl(new mapboxgl.FullscreenControl());
    }

</script>
</body>

</html>
