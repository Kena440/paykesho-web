<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/fragments :: page_head('Reset Password','none')"></head>
<style>
.form-control.is-invalid {
    border-color: #dc3545;
    box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
}

.form-control.is-invalid:focus {
    border-color: #dc3545;
    box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
}

.invalid-feedback {
    display: block;
    width: 100%;
    margin-top: 0.25rem;
    font-size: 0.875em;
    color: #dc3545;
}

.password-strength-meter {
    height: 5px;
    margin-top: 5px;
    border-radius: 3px;
    transition: all 0.3s ease;
}

.strength-weak { background: linear-gradient(to right, #dc3545 33%, #e9ecef 33%); }
.strength-medium { background: linear-gradient(to right, #ffc107 66%, #e9ecef 66%); }
.strength-strong { background: linear-gradient(to right, #28a745 100%); }
</style>
<body>
<main>
    <div class="auth-full-page d-flex">
        <div class="auth-form p-3">
            <div class="card card-body">
                <div class="mb-3">
                    <div class="d-grid gap-2 mb-3 text-center">
                        <div class="row align-middle">
                            <div class="col-md-5">
                                <img alt="logo" class="logo-img mb-4"
                                     height="80"
                                     th:src="@{/images/paykeshologo.png}" width="120">
                            </div>
                            <div class="col-md-7">
                                <div class="text-md-center mb-4 mt-md-0">
                                    <h1 class="mb-0 h3">Reset Your Password</h1>
                                    <p class="text-warning">Create a new secure password</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${message != null}">
                        <div class="alert alert-info alert-dismissible" role="alert">
                            <button aria-label="Close" class="btn-close" data-bs-dismiss="alert" type="button"></button>
                            <div class="alert-icon">
                                <i class="fas fa-fw fa-info-circle"></i>
                            </div>
                            <div class="alert-message">
                                <strong>[[${message}]]</strong>
                            </div>
                        </div>
                    </div>

                    <div th:if="${token != null}">
                        <form method="post" th:action="@{/reset-password}" id="resetPasswordForm">
                            <input type="hidden" name="token" th:value="${token}">

                            <div class="mb-3">
                                <label class="form-label" for="password">New Password *</label>
                                <div class="input-group">
                                    <input class="form-control form-control-lg" id="password" name="password"
                                           placeholder="Enter your new password"
                                           required type="password" minlength="6"/>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                                <div class="password-strength-meter" id="strengthMeter"></div>
                                <small class="text-muted" id="strengthText">
                                    <i class="fas fa-info-circle"></i> Password must be at least 6 characters
                                </small>
                                <div class="invalid-feedback" id="passwordError">
                                    Please enter a valid password (minimum 6 characters).
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="confirmPassword">Confirm Password *</label>
                                <div class="input-group">
                                    <input class="form-control form-control-lg" id="confirmPassword"
                                           placeholder="Confirm your new password"
                                           required type="password" minlength="6"/>
                                    <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                                        <i class="fas fa-eye" id="toggleConfirmPasswordIcon"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback" id="confirmPasswordError">
                                    Passwords do not match.
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-3">
                                <button class='btn btn-lg btn-primary' type="submit" id="submitBtn">
                                    <i class="fas fa-lock"></i> Reset Password
                                </button>
                                <a class="btn btn-lg btn-outline-secondary" th:href="@{/login}">
                                    <i class="fas fa-arrow-left"></i> Back to Login
                                </a>
                            </div>
                        </form>
                    </div>

                    <div th:if="${token == null}">
                        <div class="text-center">
                            <a class="btn btn-lg btn-primary" th:href="@{/login}">
                                <i class="fas fa-arrow-left"></i> Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/fragments :: js_code"></footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetPasswordForm');
    if (!form) return;
    
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const strengthMeter = document.getElementById('strengthMeter');
    const strengthText = document.getElementById('strengthText');

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        const icon = document.getElementById('togglePasswordIcon');
        icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
        const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
        confirmPasswordInput.type = type;
        const icon = document.getElementById('toggleConfirmPasswordIcon');
        icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    // Password strength meter
    function checkPasswordStrength(password) {
        let strength = 0;
        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        if (/\d/.test(password)) strength++;
        if (/[^a-zA-Z0-9]/.test(password)) strength++;
        
        return strength;
    }

    function updateStrengthMeter(strength) {
        strengthMeter.classList.remove('strength-weak', 'strength-medium', 'strength-strong');
        
        if (strength <= 2) {
            strengthMeter.classList.add('strength-weak');
            strengthText.innerHTML = '<i class="fas fa-exclamation-triangle text-danger"></i> Weak password';
        } else if (strength <= 4) {
            strengthMeter.classList.add('strength-medium');
            strengthText.innerHTML = '<i class="fas fa-check-circle text-warning"></i> Medium strength';
        } else {
            strengthMeter.classList.add('strength-strong');
            strengthText.innerHTML = '<i class="fas fa-check-circle text-success"></i> Strong password';
        }
    }

    passwordInput.addEventListener('input', function() {
        const strength = checkPasswordStrength(this.value);
        updateStrengthMeter(strength);
        
        if (this.value.length > 0 && this.value.length < 6) {
            this.classList.add('is-invalid');
        } else {
            this.classList.remove('is-invalid');
        }
        
        // Also validate confirmation if it has a value
        if (confirmPasswordInput.value) {
            validatePasswordMatch();
        }
    });

    function validatePasswordMatch() {
        if (confirmPasswordInput.value !== passwordInput.value) {
            confirmPasswordInput.classList.add('is-invalid');
            return false;
        } else {
            confirmPasswordInput.classList.remove('is-invalid');
            return true;
        }
    }

    confirmPasswordInput.addEventListener('input', validatePasswordMatch);

    // Form validation
    form.addEventListener('submit', function(e) {
        let isValid = true;

        // Validate password
        if (passwordInput.value.length < 6) {
            passwordInput.classList.add('is-invalid');
            isValid = false;
        } else {
            passwordInput.classList.remove('is-invalid');
        }

        // Validate password match
        if (!validatePasswordMatch()) {
            isValid = false;
        }

        if (!isValid) {
            e.preventDefault();
            return false;
        }

        // Show loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Resetting Password...';
    });

    // Auto-hide alerts
    const alerts = document.querySelectorAll('.alert');
    alerts.forEach(function(alert) {
        setTimeout(function() {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        }, 10000);
    });
});
</script>

</body>
</html>
