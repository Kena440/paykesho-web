<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/fragments :: page_head('Login','none')"></head>
<body>
<main>
    <div class="auth-full-page d-flex">
        <div class="auth-form p-3">
            <div class="card card-body">
                <div class="mb-3">
                    <div class="d-grid gap-2 mb-3 text-center">
                        <div class="row align-middle">
                            <div class="col-md-5">
                                <img alt="logo" class="logo-img mb-4"
                                     height="80"
                                     th:src="@{/images/paykeshologo.png}" width="120">
                            </div>
                            <div class="col-md-7">
                                <div class="text-md-center mb-4 mt-md-0">
                                    <h1 class="mb-0 h3"> Back Office Portal</h1>
                                    <p class="text-warning">Sign in to your admin account.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <form method="post" th:action="@{/login}">
                        <div class="mb-4">
                            <div class="alert alert-warning alert-dismissible" role="alert" th:if="${param.error}">
                                <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                        type="button"></button>
                                <div class="alert-icon">
                                    <i class="far fa-fw fa-lock"></i>
                                </div>
                                <div class="alert-message">
                                    <strong>Hello there!</strong> [[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]!
                                </div>
                            </div>
                            <div class="alert alert-success alert-dismissible" role="alert" th:if="${param.logout}">
                                <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                        type="button"></button>
                                <div class="alert-icon">
                                    <i class="far fa-fw fa-unlock"></i>
                                </div>
                                <div class="alert-message">
                                    <strong>Hi!</strong> You have been logged out
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control form-control-lg" id="email" name="email" placeholder="Enter your email"
                                   type="email"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password"
                                   type="password"/>
                            <small>
                                <a href='auth-reset-password.html'>Forgot password?</a>
                            </small>
                        </div>
                        <div>
                            <div class="form-check align-items-center">
                                <input checked class="form-check-input" id="customControlInline"
                                       name="remember-me"
                                       type="checkbox" value="remember-me">
                                <label class="form-check-label text-small" for="customControlInline">Remember me</label>
                            </div>
                        </div>
                        <div class="d-grid gap-2 mt-3">
                            <button class='btn btn-lg btn-primary' type="submit">Sign in</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="fragments/fragments :: js_code"></footer>

</body>

</html>
