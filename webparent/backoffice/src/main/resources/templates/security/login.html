<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/fragments :: page_head('Login','none')"></head>
<body>
<main>
    <div class="auth-full-page d-flex">
        <div class="auth-form p-3">
            <div class="card card-body">
                <div class="mb-3">
                    <div class="d-grid gap-2 mb-3 text-center">
                        <div class="row align-middle">
                            <div class="col-md-5">
                                <img alt="logo" class="logo-img mb-4"
                                     height="80"
                                     th:src="@{/images/paykeshologo.png}" width="120">
                            </div>
                            <div class="col-md-7">
                                <div class="text-md-center mb-4 mt-md-0">
                                    <h1 class="mb-0 h3"> Back Office Portal</h1>
                                    <p class="text-warning">Sign in to your admin account.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <form method="post" th:action="@{/login}">
                        <div class="mb-4">
                            <div class="alert alert-warning alert-dismissible" role="alert" th:if="${param.error}">
                                <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                        type="button"></button>
                                <div class="alert-icon">
                                    <i class="far fa-fw fa-lock"></i>
                                </div>
                                <div class="alert-message">
                                    <strong>Hello there!</strong> [[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]!
                                </div>
                            </div>
                            <div class="alert alert-success alert-dismissible" role="alert" th:if="${param.logout}">
                                <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                        type="button"></button>
                                <div class="alert-icon">
                                    <i class="far fa-fw fa-unlock"></i>
                                </div>
                                <div class="alert-message">
                                    <strong>Hi!</strong> You have been logged out
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control form-control-lg" id="email" name="email"
                                   placeholder="Enter your email"
                                   type="email"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input class="form-control form-control-lg" id="password" name="password"
                                   placeholder="Enter your password"
                                   type="password"/>
                            <small>
                                   <a type="button" class=" my-1" data-bs-toggle="modal"
                                       data-bs-target="#passwordResetModal">
                                        Forgot password?
                                    </a>
                            </small>
                        </div>
                        <div>
                            <div class="form-check align-items-center">
                                <input checked class="form-check-input" id="customControlInline"
                                       name="remember-me"
                                       type="checkbox" value="remember-me">
                                <label class="form-check-label text-small" for="customControlInline">Remember me</label>
                            </div>
                        </div>
                        <div class="d-grid gap-2 mt-3">
                            <button class='btn btn-lg btn-primary' type="submit">Sign in</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div class="modal fade" id="passwordResetModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <strong class="mx-auto">Forgot Password?</strong>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/forgot-password}" method="post">

                <div class="modal-body m-3">
                    <p class=" font-size-sm text-warning">
                        Please enter your Email Address. You will receive a link
                        to create a new password via Email.
                    </p>
                    <hr>

                    <!-- Email -->
                    <div class="form-group">
                        <label class="sr-only" for="modalPasswordResetEmail">
                            Email Address *
                        </label>
                        <input class="form-control form-control-lg" id="modalPasswordResetEmail"
                               name="modalPasswordResetEmail" type="email"
                               placeholder="Email Address *" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Reset</button>
                </div>
            </form>
        </div>
    </div>
</div>


<footer th:replace="fragments/fragments :: js_code"></footer>

</body>

</html>
