<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Client','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3 th:text="${customer.fullName}">Employee</h3>
                    </div>
                    <div class="col-auto ms-auto text-end mt-n1">
                        <a class="btn btn-primary shadow-sm" th:href="@{/clients}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> All Clients
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-xl-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">Client details</h5>
                            </div>
                            <div class="card-body">
                                <!-- Details for KYC review. -->
                                <dl class="row mb-0">
                                    <dt class="col-sm-4">PayKesho number</dt>
                                    <dd class="col-sm-8" th:text="${customer.code ?: '-'}">-</dd>
                                    <dt class="col-sm-4">Man number</dt>
                                    <dd class="col-sm-8" th:text="${customer.manNumber ?: '-'}">-</dd>
                                    <dt class="col-sm-4">NRC</dt>
                                    <dd class="col-sm-8" th:text="${customer.nrc ?: '-'}">-</dd>
                                    <dt class="col-sm-4">Email</dt>
                                    <dd class="col-sm-8" th:text="${customer.email ?: '-'}">-</dd>
                                    <dt class="col-sm-4">Phone</dt>
                                    <dd class="col-sm-8" th:text="${customer.phoneNumber ?: '-'}">-</dd>
                                    <dt class="col-sm-4">TPIN</dt>
                                    <dd class="col-sm-8" th:text="${customer.tpin ?: '-'}">-</dd>
                                    <dt class="col-sm-4">Employer</dt>
                                    <dd class="col-sm-8" th:text="${customer.organization != null ? customer.organization.name : '-'}">-</dd>
                                    <dt class="col-sm-4">Monthly income</dt>
                                    <dd class="col-sm-8" th:text="${customer.clientIncome != null ? 'K ' + #numbers.formatDecimal(customer.clientIncome, 1, 'COMMA', 2, 'POINT') : '-'}">-</dd>
                                    <dt class="col-sm-4">Address</dt>
                                    <dd class="col-sm-8" th:text="${customer.address ?: '-'}">-</dd>
                                    <dt class="col-sm-4">Status</dt>
                                    <dd class="col-sm-8">
                                        <span class="badge bg-success" th:if="${customer.enabled}">Active</span>
                                        <span class="badge bg-secondary" th:unless="${customer.enabled}">Disabled</span>
                                    </dd>
                                    <dt class="col-sm-4">Registered</dt>
                                    <dd class="col-sm-8" th:text="${customer.createdTime != null ? #dates.format(customer.createdTime, 'dd MMM yyyy') : '-'}">-</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="fragments/fragments :: js_code"></th:block>
</body>
</html>
