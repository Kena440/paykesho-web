<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Clients','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Client Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">
                        <a class="btn btn-primary shadow-sm" th:href="@{/clients}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> All Clients
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/clients/initiate}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Initiate
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title"><span th:text="${pageTitle ?: 'Clients'}">Clients</span></h5>
                                <h6 class="card-subtitle text-muted">A list of recorded clients.</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped w-100" id="datatables-responsive">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Photo</th>
                                        <th>Code</th>
                                        <th>Name</th>
                                        <th>Contact Details</th>
                                        <th>Enabled</th>
                                        <th>Balance</th>
                                        <th>Score</th>
                                        <th>Type</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="client, clientStat : ${clientList ?: {}}"
                                        th:if="${clientList != null and !clientList.isEmpty()}">
                                        <td class="hideable-column"><span th:text="${clientStat?.count ?: ''}">-</span>
                                        </td>
                                        <td>
                                        </td>
                                        <td>
                                            <span class="font-weight-normal">
                                                <a th:href="@{'/clients/view/'+${client.uuid}}"
                                                   th:if="${client?.uuid != null}"
                                                   title="client View">
                                                    <span class="font-weight-normal" th:text="${client?.code ?: 'N/A'}">N/A</span>
                                                </a>
                                                <span class="text-muted" th:unless="${client?.uuid != null}">N/A</span>
                                            </span>
                                        </td>
                                        <td>
                                            <span class="font-weight-normal">
                                                <span th:text="${client?.name ?: 'N/A'}">N/A</span>
                                                <small th:if="${client?.organization != null}"
                                                       th:text="'(' + ${client.organization} + ')'">()</small>
                                            </span>
                                        </td>
                                        <td>
                                            <span class="font-weight-normal">
                                                <span th:text="${client?.email ?: 'N/A'}">N/A</span>
                                                <small th:if="${client?.phoneNumber != null}"
                                                       th:text="'(' + ${client.phoneNumber} + ')'">()</small>
                                            </span>
                                        </td>
                                        <td>
                                            <div th:if="${client?.uuid != null}"
                                                 th:replace="fragments/fragments :: status(${client?.enabled ?: false}, 'client', '/clients/' + ${client.uuid})"></div>
                                            <span class="text-muted" th:unless="${client?.uuid != null}">N/A</span>
                                        </td>
                                        <td>
                                            <span class="font-weight-normal"
                                                  th:if="${client?.clientBalance?.availableBalance != null}"
                                                  th:replace="fragments/fragments :: format_currency(${client.clientBalance?.availableBalance ?: 0})"></span>
                                            <span class="text-muted"
                                                  th:unless="${client?.clientBalance?.availableBalance != null}">N/A</span>
                                        </td>
                                        <td>
                                            <span class="font-weight-normal"
                                                  th:if="${client?.creditScore != null}"
                                                  th:replace="fragments/fragments :: format_number(${client.creditScore})"></span>
                                            <span class="text-muted"
                                                  th:unless="${client?.creditScore != null}">N/A</span>
                                        </td>
                                        <td><span class="font-weight-normal" th:text="${client?.clientType ?: 'N/A'}">N/A</span>
                                        </td>
                                    </tr>
                                    <tr th:if="${clientList == null or clientList.isEmpty()}">
                                        <td class="text-center text-muted py-4" colspan="9">
                                            <i class="fas fa-info-circle me-2"></i>
                                            No clients found or data could not be loaded.
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/clients}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'client');
        });
    });

    currencySymbol = "[[${CURRENCY_SYMBOL}]]";
    thousandPointType = "[[${THOUSAND_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    decimalPointType = "[[${DECIMAL_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    currencySymbolPosition = "[[${CURRENCY_SYMBOL_POSITION}]]";
    decimalDigits = "[[${DECIMAL_DIGITS}]]";

    prefixCurrencySymbol = currencySymbolPosition === 'before price' ? currencySymbol : '';
    suffixCurrencySymbol = currencySymbolPosition === 'after price' ? currencySymbol : '';
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Initialize DataTable for server-side rendered table
        safeDataTable("#datatables-responsive");
    });
</script>

</body>
</html>
