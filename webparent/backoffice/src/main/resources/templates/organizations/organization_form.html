<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Organization Mgt','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Organization Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <a class="btn btn-primary shadow-sm" th:href="@{/organizations}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> List Organizations
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/organizations/new}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Add Organization
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-xl-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">Record organizations onto the system.</h6>
                            </div>
                            <div class="card-body">
                                <form enctype="multipart/form-data"
                                      method="post"
                                      onsubmit="return checkOrganizationUnique(this)"
                                      th:action="@{/organizations/save}"
                                      th:object="${organization}">
                                    <input id="id" th:field="*{id}" type="hidden"/>
                                    <input id="longitude" th:field="*{longitude}" type="hidden"/>
                                    <input id="latitude" th:field="*{latitude}" type="hidden"/>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Name</label>
                                                <input
                                                        class="form-control" id="name" maxlength="45"
                                                        minlength="2" placeholder="Name" required
                                                        th:field="*{name}"
                                                        type="text">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Type</label>
                                                <select class="form-control" th:field="*{organizationType}">
                                                    <option value="">Select...</option>
                                                    <th:block
                                                            th:each="ps : ${T(org.commons.enums.OrganizationType).values()}">
                                                        <option th:defaultDescription="${ps.name()}"
                                                                th:text="${ps}"
                                                                th:value="${ps}">
                                                        </option>
                                                    </th:block>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Phone Number</label>
                                                <input
                                                        class="form-control" id="phoneNumber" maxlength="45"
                                                        minlength="2" placeholder="Phone Number" required
                                                        th:field="*{phoneNumber}"
                                                        type="text">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Email</label>
                                                <input
                                                        class="form-control" id="email" maxlength="100"
                                                        minlength="2" placeholder="Email" required
                                                        th:field="*{email}"
                                                        type="email">
                                            </div>
                                        </div>
                                        <div class="col-md-6">

                                            <div class="mb-3">
                                                <img
                                                        alt="loading..."
                                                        class="rounded"
                                                        id="thumbnail"
                                                        style="height: 100px; width: 100px"
                                                        th:src="@{${organization.photoPath}}">
                                                <hr>
                                                <label class="form-label">File input</label>
                                                <input accept="image/png, image/jpeg"
                                                       capture="user"
                                                       class="form-control"
                                                       id="fileImage"
                                                       name="image"
                                                       type="file" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-check m-0">
                                                    <input class="form-check-input" id="enabledInput"
                                                           th:field="*{enabled}"
                                                           type="checkbox">
                                                    <span class="form-check-label">Enabled</span>
                                                </label>
                                            </div>
                                            <hr>
                                            <div class="mb-3">
                                                <label class="form-label">Location</label>
                                                <div class="text-center">
                                                    <div id="map" style='width: 100%; height: 250px'></div>
                                                    <pre id="info"></pre>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <button class="btn btn-primary" type="submit">Submit</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<div th:replace="fragments/modal_fragment :: modal_dialog"></div>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkOrganizationUnique(form) {
        url = "[[@{/organizations/rest/check-organization}]]";
        organizationName = $("#name").val();
        organizationType = $("#organizationType").val();
        organizationId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {
            id: organizationId,
            organizationName: organizationName,
            organizationType: organizationType,
            _csrf: csrfValue
        };

        $.post(url, params, function (response) {
            if (response == "OK") {
                form.submit();
            } else if (response == "Duplicated") {
                showWarningModal("There is another organization having the name " + organizationName);
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>
<script>
    // Initialize the Leaflet map
    var map = L.map('map').setView([-13.1189121, 28.5589884], 4.8); // Set map center and zoom level

    // Add OpenStreetMap tile layer (similar to the Mapbox streets-v11 style)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Add an initial marker at the coordinates from the input fields
    var marker1 = L.marker([$("#latitude").val(), $("#longitude").val()]).addTo(map);

    // Mousemove event to display container point (pixel coordinates) and lat-lng information
    map.on('mousemove', function (e) {
        document.getElementById('info').innerHTML =
            JSON.stringify({x: e.containerPoint.x, y: e.containerPoint.y}) + '<br />' +
            JSON.stringify({lng: e.latlng.lng, lat: e.latlng.lat}); // Display longitude and latitude
    });

    // Define a new marker to be added/updated on map click
    var marker = L.marker([0, 0]).addTo(map); // Initialize the marker at an arbitrary position

    // Function to add/update marker on map click
    function add_marker(e) {
        var coordinates = e.latlng; // Get the clicked location's lat-lng

        // Update input fields with new coordinates
        $("#longitude").val(coordinates.lng);
        $("#latitude").val(coordinates.lat);

        // Update the marker's position to the clicked location
        marker.setLatLng(coordinates).addTo(map);
    }

    // Add the click event listener to the map to place/update marker
    map.on('click', add_marker);

    // For geocoding functionality, you can add Leaflet geocoder or a plugin (like leaflet-control-geocoder)
    L.Control.geocoder({
        defaultMarkGeocode: false
    }).on('markgeocode', function (e) {
        var bbox = e.geocode.bbox;
        var poly = L.polygon([
            bbox.getSouthEast(),
            bbox.getNorthEast(),
            bbox.getNorthWest(),
            bbox.getSouthWest()
        ]).addTo(map);
        map.fitBounds(poly.getBounds());
    }).addTo(map);
</script>

</body>
</html>
