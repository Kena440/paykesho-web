<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Organization Mgt','none')"></head>
<body>
<div th:replace="fragments/fragments :: loader"></div>
<!--<nav th:replace="fragments/fragments :: nav"></nav>-->
<div class="container-fluid bg-soft">
    <div class="row">
        <div class="col-12">
            <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
            <main class="content">
                <div th:replace="fragments/fragments :: topbar"></div>
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-4">
                    <div class="d-block mb-4 mb-md-0">
                        <nav aria-label="breadcrumb" class="d-none d-md-inline-block">
                            <ol class="breadcrumb breadcrumb-dark breadcrumb-transparent">
                                <li class="breadcrumb-item"><a href="#"><span class="fas fa-home"></span></a></li>
                                <li class="breadcrumb-item"><a href="#">Organization Mgt</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Organizations List</li>
                            </ol>
                        </nav>
                    </div>
                    <div class="btn-toolbar mb-2 mb-md-0"><a th:href="@{/organizations/new}"
                                                             class="btn btn-sm btn-primary"><span
                            class="fas fa-plus"></span> <span>Add New Organization</span></a>
                        <div class="btn-group ml-3">
                            <button type="button" class="btn btn-sm btn-outline-secondary">Share</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary">Export</button>
                        </div>
                    </div>
                </div>
                <div th:replace="fragments/fragments :: search_form()"></div>
                <div class="card card-body border-light shadow-sm table-wrapper table-responsive pt-0">
                    <table class="table table-hover" th:if="${organizationList.size() > 0}">
                        <thead>
                        <tr>
                            <th class="list-sort text-muted" scope="col">
                                <a class="disabled" href="#">#</a>
                            </th>
                            <th class="list-sort text-muted" scope="col" style="width: 6%">
                                <a class="disabled" href="#">Photo</a>
                            </th>
                            <th class="list-sort text-muted" scope="col"
                                style="width: 15%"
                                th:replace="fragments/fragments :: column_Link('name', 'Name','none')">
                            </th>
                            <th scope="col"
                                th:replace="fragments/fragments :: column_Link('organizationType', 'Type', 'none')">
                            </th>
                            <!--<th:block sec:authorize="hasAnyAuthority('Admin','SuperAdmin')">-->
                            <th scope="col"
                                th:replace="fragments/fragments :: column_Link('enabled', 'Enabled', 'none')">
                            </th>
                            <th class="list-sort text-muted" scope="col">
                                <a class="disabled" href="#">Action</a>
                            </th>
                            <!--</th:block>-->
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="organization, organizationStat : ${organizationList}">
                            <td class="hideable-column">[[${organizationStat.count}]]</td>
                            <td>
                                <a href="#" class="d-flex align-items-center">
                                    <img th:if="${organization.photos != null}" th:src="@{${organization.photosImagePath}}"
                                         class="organization-avatar rounded-circle mr-3" alt="Avatar">
                                </a>
                            </td>
                            <td><span class="font-weight-normal">[[${organization.name}]]</span></td>
                            <td><span class="font-weight-normal">[[${organization.organizationType}]]</span></td>
                            <td>
                                <div th:replace="fragments/fragments :: status(${organization.enabled}, 'organization', '/organizations/' + ${organization.id})"></div>
                            </td>
                            <td>
                                <a class="dropdown-item" href="#">
                                    <div th:replace="fragments/fragments :: edit('organization', '/organizations/edit/' + ${organization.id})"></div>
                                </a>
                                &nbsp;
                                <a class="dropdown-item text-danger" href="#">
                                    <div th:replace="fragments/fragments :: delete(${organization.id}, 'organization', '/organizations/delete/' + ${organization.id}, true)"></div>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="card-footer px-3 d-flex align-items-center justify-content-between">
                        <div th:replace="fragments/fragments :: pagnation('organizations')"></div>
                    </div>
                </div>
                <br>
            </main>
        </div>
    </div>
</div>
<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/organizations}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'organization');
        });
    });
</script>

</body>

</html>
