<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Facility Mgt','none')"></head>

<body>


<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">

                <!-- Header -->
                <div class="header">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Facility Management
                                </h6>

                                <!-- Title -->
                                <h1 class="header-title text-truncate">
                                    [[${pageTitle}]]
                                </h1>

                            </div>
                            <div class="col-auto">

                                <!-- Navigation (button group) -->
                                <div class="nav btn-group d-inline-flex d-none" role="tablist">
                                    <button aria-controls="dealsListPane" aria-selected="true"
                                            class="btn btn-white active"
                                            data-bs-target="#dealsListPane" data-bs-toggle="tab" id="dealsListTab"
                                            role="tab">
                                        <span class="fe fe-list"></span>
                                    </button>
                                    <button aria-controls="dealsCardsPane" aria-selected="false" class="btn btn-white"
                                            data-bs-target="#dealsCardsPane" data-bs-toggle="tab" id="dealsCardsTab"
                                            role="tab">
                                        <span class="fe fe-sidebar"></span>
                                    </button>
                                </div> <!-- / .nav -->

                                <!-- Buttons -->
                                <a class="btn btn-primary ms-2" th:href="@{/facilities}">
                                    Facility
                                </a>

                            </div>
                        </div> <!-- / .row -->
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Nav -->
                                <ul class="nav nav-tabs nav-overflow header-tabs">
                                    <li class="nav-item d-none">
                                        <a class="nav-link text-nowrap active" href="#!">
                                            Total <span
                                                class="badge rounded-pill bg-secondary-soft"></span>
                                        </a>
                                    </li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form enctype="multipart/form-data"
                      method="post"
                      onsubmit="return checkInstitutionUnique(this)"
                      th:action="@{/facilities/save}"
                      th:object="${facility}">
                    <input id="id" th:field="*{id}" type="hidden"/>
                    <input id="longitude" th:field="*{longitude}" type="hidden"/>
                    <input id="latitude" th:field="*{latitude}" type="hidden"/>
                    <div class="row">
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Name
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="nameInput" maxlength="45"
                                       minlength="2" placeholder="Name of Institution" required
                                       th:field="*{name}"
                                       type="text">
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- Last name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Province
                                </label>

                                <!-- Input -->
                                <select class="form-select mb-3" data-choices th:field="*{province}">
                                    <option value="">Select...</option>
                                    <th:block th:each="vh : ${stateList}">
                                        <option th:selected="(${vh.id} == ${facility.province})"
                                                th:value="${vh.id}">
                                            [[${vh.name}]] ([[${vh.country.name}]])
                                        </option>
                                    </th:block>
                                </select>
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    District
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="district" maxlength="45"
                                       minlength="2" placeholder="District" required
                                       th:field="*{district}"
                                       type="text">
                            </div>

                        </div>
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Level of Care
                                </label>

                                <!-- Input -->
                                <select class="form-select mb-3" data-choices th:field="*{levelOfCare}">
                                    <option value="">Select...</option>
                                    <th:block th:each="vh : ${levelOfCareList}">
                                        <option th:selected="(${vh.id} == ${facility.levelOfCare})"
                                                th:value="${vh.id}">
                                            [[${vh.name}]]
                                        </option>
                                    </th:block>
                                </select>
                            </div>

                        </div>

                        <hr>
                        <div class="col-12 col-md-6">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Facility Email
                                </label>

                                <!-- Input -->
                                <input class="form-control" id="email" maxlength="45" minlength="2"
                                       placeholder="XXX"
                                       th:field="*{email}" type="email">
                            </div>

                        </div>


                        <hr>
                        <div class="col-12 col-md-12">

                            <!-- First name -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    GPS Location
                                </label>

                                <!-- Input -->
                                <div id="map" style='width: 100%; height: 400px'></div>
                                <pre id="info"></pre>

                            </div>

                        </div>
                        <hr>
                        <div class="col-12 col-md-6">

                            <!-- Birthday -->
                            <div class="form-group">

                                <!-- Label -->
                                <label class="form-label">
                                    Enabled
                                </label>

                                <!-- Input -->
                                <input class="form-check-input is-invalid" id="enabledInput" th:field="*{enabled}"
                                       type="checkbox">
                            </div>

                        </div>


                    </div>
                    <div class="col-12 col-md-6" sec:authorize="hasAnyAuthority('General', 'Admin')">
                        <button class="btn btn-primary" type="submit">Submit</button>
                        <button class="btn btn-secondary" id="btnCancel" type="button">Cancel</button>
                    </div>
                </form>

                <br><br>

            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 2502400; // 2502.4KB

    function checkInstitutionUnique(form) {
        url = "[[@{/facilities/rest/check-facility}]]";
        facilityName = $("#nameInput").val();
        levelOfCare = $("#levelOfCare").val();
        provinceId = $("#province").val();
        memberId = $("#id").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {
            id: memberId,
            provinceId: provinceId,
            facilityName: facilityName,
            levelOfCare: levelOfCare,
            _csrf: csrfValue
        };

        $.post(url, params, function (response) {
            if (response === "OK") {
                form.submit();
            } else if (response === "Duplicated") {
                showWarningModal("There is another facility having the provided details");
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }
</script>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiY2hhemRldmVsb3BlcjcwIiwiYSI6ImNsOG11dXptNTBjc2Mzb3A2aTg3aXkzMmQifQ.EpRXqn3-sQCu8qEu9l7nCA';
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v11',
        zoom: 4.8,
        center: [28.5589884, -13.1189121]
    });

    const marker1 = new mapboxgl.Marker()
        .setLngLat([$("#longitude").val(), $("#latitude").val()])
        .addTo(map);

    map.addControl(
        new MapboxGeocoder({
            accessToken: mapboxgl.accessToken,
            mapboxgl: mapboxgl
        })
    );

    map.on('mousemove', (e) => {
        document.getElementById('info').innerHTML =
            JSON.stringify(e.point) +
            '<br />' +
            // `e.lngLat` is the longitude, latitude geographical position of the event.
            JSON.stringify(e.lngLat.wrap());
    });

    var marker = new mapboxgl.Marker();

    function add_marker(event) {
        var coordinates = event.lngLat;

        $("#longitude").val(coordinates.lng);
        $("#latitude").val(coordinates.lat);

        marker.setLngLat(coordinates).addTo(map);
    }

    map.on('click', add_marker);
</script>
</body>

</html>
