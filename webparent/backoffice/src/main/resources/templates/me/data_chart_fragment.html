<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content(reportType, varName)" th:remove="tag">
    <div class="row justify-content-center">
        <input id="reportType" th:value="${reportType}" type="hidden">
        <input id="varName" th:value="${varName}" type="hidden">
        <div class="col-12">
            <div class="form-group" th:with="buttonClass = 'btn-data-by' + ${reportType}">
                <button class="btn btn-primary btn-xs" th:classappend="${buttonClass}" th:period="current-year"
                        type="button">Current Year
                </button>
                <button class="btn btn-primary btn-xs" th:classappend="${buttonClass}" th:period="last-year"
                        type="button">Last Year
                </button>
                <button class="btn btn-primary btn-xs" th:classappend="${buttonClass}" th:period="last-3-years"
                        type="button">Last 3 Years
                </button>
                <button class="btn btn-primary btn-xs" th:classappend="${buttonClass}" th:period="last-5-years"
                        type="button">Last 5 Years
                </button>
                <button class="btn btn-primary btn-xs" th:classappend="${buttonClass}" th:period="last-6-months"
                        type="button">Last 10 Years
                </button>
                <button class="btn btn-primary btn-xs" th:classappend="${buttonClass}" type="button">Custom</button>
            </div>
        </div>

        <div class="col-12 d-none" th:id="'divCustomYearRange' + ${reportType}">
            <form>
                <div class="form-group">
                    <div class="row">
                        <div class="col-6 col-md-6">
                            <div class="form-group">
                                <label class="sr-only">
                                    From year
                                </label>
                                <input class="form-control form-control-xs" required
                                       th:id="'startYear' + ${reportType}">
                            </div>
                        </div>
                        <div class="col-6 col-md-6">
                            <div class="form-group">
                                <label class="sr-only">
                                    To year
                                </label>
                                <input class="form-control form-control-xs" required th:id="'endYear' + ${reportType}">
                            </div>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-xs btn-dark" th:id="'viewReportByYearRange' + ${reportType}"
                                    type="button">
                                Fetch
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>


        <div class="col-12">
            <div class="form-group">
                <div class="mt-3" th:id="'chart-data-by' + ${reportType}"></div>
            </div>
        </div>
        <div class="col-12">
            <div class="form-group">
                <div class="col-12 col-lg-10 col-xl-12">
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm table-hover">
                            <thead>
                            <tr>
                                <th><span th:id="'labelTotalItems' + ${reportType}"></span></th>
                            </tr>
                            </thead>
                            <tbody>

                            <tr>
                                <td><span class="h3" th:id="'totalItems' + ${reportType}"></span></td>
                            </tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
