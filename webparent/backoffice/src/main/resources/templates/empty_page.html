<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Empty Page','none')"></head>
<body>
<div th:replace="fragments/fragments :: loader"></div>
<nav th:replace="fragments/fragments :: nav"></nav>
<div class="container-fluid bg-soft">
    <div class="row">
        <div class="col-12">
            <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
            <main class="content">
                <div th:replace="fragments/fragments :: topbar" class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-4">
                    <div><button class="btn btn-secondary mr-2 dropdown-toggle" data-toggle="dropdown" aria-haspopup="true"

                        <div class="dropdown-menu dashboard-dropdown dropdown-menu-left mt-2"><a
                                class="dropdown-item font-weight-bold" href="#"><span class="far fa-file-alt mr-2"></span>Document</a>
                            <a class="dropdown-item font-weight-bold" href="#"><span
                                    class="far fa-comment-dots mr-2"></span>Message</a> <a class="dropdown-item font-weight-bold"
                                                                                           href="#"><span class="fas fa-box-open mr-2"></span>Product</a>
                            <div role="separator" class="dropdown-divider"></div><a class="dropdown-item font-weight-bold"
                                                                                    href="#"><span class="fas fa-rocket text-danger mr-2"></span>Subscription Plan</a>
                        </div>
                    </div>
                    <div>
                        <button
                                class="btn btn-primary mr-2 dropdown-toggle" data-toggle="dropdown" aria-haspopup="true"
                                aria-expanded="false"><span class="fas fa-user-circle mr-2"></span><a class="h6 text-white" sec:authentication="principal.fullname" th:href="@{/my-account}"></a> <span

                        <div class="dropdown-menu dashboard-dropdown dropdown-menu-left mt-2"><a
                                class="dropdown-item font-weight-bold" href="#"><span class="fas fa-box-open mr-2"></span>Products</a>
                            <a class="dropdown-item font-weight-bold" href="#"><span class="fas fa-store mr-2"></span>Customers</a>
                            <a class="dropdown-item font-weight-bold" href="#"><span
                                    class="fas fa-cart-arrow-down mr-2"></span>Orders</a> <a class="dropdown-item font-weight-bold"
                                                                                             href="#"><span class="fas fa-chart-pie mr-2"></span>Console</a>
                            <div role="separator" class="dropdown-divider"></div><a class="dropdown-item font-weight-bold"
                                                                                    href="#"><span class="fas fa-rocket text-success mr-2"></span>All Reports</a>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>
</div>
<footer th:replace="fragments/fragments :: js_code"></footer>
