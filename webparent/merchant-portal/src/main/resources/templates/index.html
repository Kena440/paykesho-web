<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org"
>
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Dashboard','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <input id="longitude" th:value="${merchant.longitude}" type="hidden"/>
            <input id="latitude" th:value="${merchant.latitude}" type="hidden"/>
            <div class="container-fluid p-0">

                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Analytics</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <div class="dropdown me-2 d-inline-block position-relative">
                            <a class="btn btn-light bg-white shadow-sm dropdown-toggle" data-bs-display="static"
                               data-bs-toggle="dropdown" href="#">
                                <i class="align-middle mt-n1" data-lucide="calendar"></i> Today
                            </a>

                            <div class="dropdown-menu dropdown-menu-end">
                                <h6 class="dropdown-header">Settings</h6>
                                <a class="dropdown-item" href="#">Action</a>
                                <a class="dropdown-item" href="#">Another action</a>
                                <a class="dropdown-item" href="#">Something else here</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#">Separated link</a>
                            </div>
                        </div>

                        <button class="btn btn-primary shadow-sm">
                            <i class="align-middle" data-lucide="filter">&nbsp;</i>
                        </button>
                        <button class="btn btn-primary shadow-sm">
                            <i class="align-middle" data-lucide="refresh-cw">&nbsp;</i>
                        </button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-xl-5 d-flex">
                        <div class="w-100">

                            <div class="row">
                                <div class="col-sm-12 col-lg-12 col-xxl-12 d-flex">
                                    <div class="card illustration flex-fill">
                                        <div class="card-body p-0 d-flex flex-fill">
                                            <div class="row g-0 w-100">
                                                <div class="col-6">
                                                    <div class="illustration-text p-3 m-1">
                                                        <h4 class="illustration-text">Welcome Back,
                                                            [[${merchantAdmin.name}]]!</h4>
                                                        <p class="mb-0">Merchant Dashboard - [[${merchant}]]</p>
                                                    </div>
                                                </div>
                                                <div class="col-4 align-self-end text-end">


                                                    <div class="img-fluid mb-2"><img
                                                            alt="loading..."
                                                            class="img-fluid illustration-img"
                                                            style="max-width: 8.5rem;"
                                                            th:src="@{${qrCodeContent}}">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row d-lg-none d-xxl-flex">
                                <div class="col-sm-6 col-lg-12 col-xxl-6 d-flex">
                                    <div class="card flex-fill">
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col mt-0">
                                                    <h5 class="card-title">Merchant Code</h5>
                                                </div>

                                                <div class="col-auto">
                                                    <div class="stat stat-sm">
                                                        <i class="align-middle" data-lucide="clock"></i>
                                                    </div>
                                                </div>
                                            </div>
                                            <span class="h1 d-inline-block mt-1 mb-4">                                <a
                                                    class="badge badge-subtle-primary me-1 my-1" href="#">[[${merchant.code}]]</a></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6 col-lg-12 col-xxl-6 d-flex">
                                    <div class="card flex-fill">
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col mt-0">
                                                    <h5 class="card-title">Transactions</h5>
                                                </div>
                                                <div class="col-auto">
                                                    <div class="stat stat-sm">
                                                        <i class="align-middle" data-lucide="users"></i>
                                                    </div>
                                                </div>
                                            </div>
                                            <span class="h1 d-inline-block mt-1 mb-4"
                                                  th:text="${totalTransactions}">0</span>
                                            <div class="mb-0">
                                                <span class="badge badge-subtle-danger me-2"
                                                      th:text="${txnPercentageChange + '%'}">0.00%</span>
                                                <span class="text-muted">Since last week</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>

                        </div>
                    </div>

                    <div class="col-lg-6 col-xl-7">
                        <div class="card flex-fill w-100">
                            <div class="card-header">
                                <div class="card-actions float-end">
                                    <div class="dropdown position-relative">
                                        <a data-bs-display="static" data-bs-toggle="dropdown" href="#">
                                            <i class="align-middle" data-lucide="more-horizontal"></i>
                                        </a>

                                        <div class="dropdown-menu dropdown-menu-end">
                                            <a class="dropdown-item" href="#">Action</a>
                                            <a class="dropdown-item" href="#">Another action</a>
                                            <a class="dropdown-item" href="#">Something else here</a>
                                        </div>
                                    </div>
                                </div>
                                <h5 class="card-title mb-0">Map</h5>
                            </div>
                            <div class="card-body p-2">
                                <div id="map" style='width: 100%; height: 279px'></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <footer th:replace="fragments/fragments :: footer()"></footer>
    </div>
</div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script>
    // Initialize the Leaflet map
    var map = L.map('map').setView([$("#latitude").val(), $("#longitude").val()], 15);

    // Add OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Add a marker at the given coordinates
    var marker = L.marker([$("#latitude").val(), $("#longitude").val()]).addTo(map);

    // Optionally, if you need geocoding similar to MapboxGeocoder, you can integrate a Leaflet geocoder plugin.
    // Here is an example of using leaflet-control-geocoder:
    L.Control.geocoder({
        defaultMarkGeocode: false
    }).on('markgeocode', function (e) {
        var bbox = e.geocode.bbox;
        var poly = L.polygon([
            bbox.getSouthEast(),
            bbox.getNorthEast(),
            bbox.getNorthWest(),
            bbox.getSouthWest()
        ]).addTo(map);
        map.fitBounds(poly.getBounds());
    }).addTo(map);
</script>

</body>
</html>
