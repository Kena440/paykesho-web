<!doctype html>
<html lang="en">

<head th:replace="fragments/fragments :: page_head('Reset Password','none')"></head>

<style>
.form-control.is-invalid {
    border-color: #dc3545;
    box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
}

.form-control.is-invalid:focus {
    border-color: #dc3545;
    box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
}

.invalid-feedback {
    display: block;
    width: 100%;
    margin-top: 0.25rem;
    font-size: 0.875em;
    color: #dc3545;
}

.btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

.alert {
    animation: fadeIn 0.3s ease-in;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<body class="d-flex align-items-center bg-auth border-top border-top-2 border-primary">

<!-- CONTENT
================================================== -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-xl-4 my-5">

            <!-- Heading -->
            <h1 class="display-4 text-center mb-3">
                Paykesho
            </h1>

            <!-- Subheading -->
            <p class="text-muted text-center mb-5">
                Merchant Portal - Reset Password
            </p>

            <!-- Form -->
            <form method="post" th:action="@{/reset-password-action}" id="resetPasswordForm">
                <input name="token" th:value="${token}" type="hidden">
                
                <div class="position-relative mb-4">
                    <div class="alert alert-info" role="alert" th:if="${message != null}">
                        [[${message}]]
                    </div>
                </div>
                
                <!-- New Password -->
                <div class="form-group mb-3">
                    <label class="form-label">
                        New Password *
                    </label>
                    <input autofocus="autofocus" class="form-control"
                           id="password" maxlength="50"
                           minlength="6" name="password"
                           placeholder="Enter new password" required
                           type="password"/>
                    <div class="invalid-feedback" id="passwordError">
                        Please enter a password (minimum 6 characters).
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group mb-4">
                    <label class="form-label">
                        Confirm Password *
                    </label>
                    <input class="form-control" id="confirmPassword"
                           maxlength="50"
                           minlength="6" name="passwordConfirm"
                           placeholder="Confirm new password" required
                           type="password"/>
                    <div class="invalid-feedback" id="confirmPasswordError">
                        Passwords do not match.
                    </div>
                </div>

                <!-- Submit -->
                <button class="btn btn-lg w-100 btn-primary mb-3" type="submit" id="submitBtn">
                    Reset Password
                </button>
                
                <!-- Back to Login -->
                <div class="text-center">
                    <a th:href="@{/login}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-2"></i>Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetPasswordForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    
    function validateForm() {
        let isValid = true;
        
        // Clear previous error states
        passwordInput.classList.remove('is-invalid');
        confirmPasswordInput.classList.remove('is-invalid');
        
        // Validate password
        if (!passwordInput.value.trim()) {
            passwordInput.classList.add('is-invalid');
            document.getElementById('passwordError').textContent = 'Please enter a password.';
            isValid = false;
        } else if (passwordInput.value.length < 6) {
            passwordInput.classList.add('is-invalid');
            document.getElementById('passwordError').textContent = 'Password must be at least 6 characters long.';
            isValid = false;
        }
        
        // Validate confirm password
        if (!confirmPasswordInput.value.trim()) {
            confirmPasswordInput.classList.add('is-invalid');
            document.getElementById('confirmPasswordError').textContent = 'Please confirm your password.';
            isValid = false;
        } else if (passwordInput.value !== confirmPasswordInput.value) {
            confirmPasswordInput.classList.add('is-invalid');
            document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
            isValid = false;
        }
        
        return isValid;
    }
    
    // Show loading state on form submission
    form.addEventListener('submit', function(e) {
        if (!validateForm()) {
            e.preventDefault();
            return false;
        }
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Resetting...';
    });
    
    // Real-time password confirmation validation
    confirmPasswordInput.addEventListener('input', function() {
        if (this.value.trim() && passwordInput.value !== this.value) {
            this.classList.add('is-invalid');
            document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
        } else {
            this.classList.remove('is-invalid');
        }
    });
    
    passwordInput.addEventListener('input', function() {
        if (confirmPasswordInput.value.trim() && this.value !== confirmPasswordInput.value) {
            confirmPasswordInput.classList.add('is-invalid');
            document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
        } else {
            confirmPasswordInput.classList.remove('is-invalid');
        }
    });
});
</script>

</body>
</html>
