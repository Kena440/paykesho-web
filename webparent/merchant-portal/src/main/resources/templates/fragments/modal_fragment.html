<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div :class="{ 'show': isOpen }"
     :style="isOpen ? 'display: block;' : 'display: none;'"
     aria-hidden="true"
     aria-labelledby="modalTitle"
     class="modal fade"
     role="dialog"
     tabindex="-1"
     th:fragment="modal(id, title)"
     th:id="${id}"
     x-data="{ isOpen: false }"
     x-show="isOpen"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-end="opacity-100"
     x-transition:enter-start="opacity-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-end="opacity-0"
     x-transition:leave-start="opacity-100">

    <div class="modal-dialog modal-dialog-centered"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-end="opacity-100 transform scale-100"
         x-transition:enter-start="opacity-0 transform scale-95"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-end="opacity-0 transform scale-95"
         x-transition:leave-start="opacity-100 transform scale-100">

        <div class="modal-content shadow-lg">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title" id="modalTitle" th:text="${title}">Modal Title</h5>
                <button @click="isOpen = false"
                        aria-label="Close"
                        class="btn-close"
                        type="button">
                </button>
            </div>

            <div class="modal-body">
                <div th:replace="${content}">
                    <!-- Modal content will be inserted here -->
                </div>
            </div>

            <div class="modal-footer border-top-0">
                <button @click="isOpen = false"
                        class="btn btn-light"
                        type="button">
                    Cancel
                </button>
                <button @click="submitForm"
                        class="btn btn-primary"
                        type="button">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Backdrop -->
    <div :class="{ 'show': isOpen }"
         class="modal-backdrop fade"
         x-show="isOpen"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-end="opacity-50"
         x-transition:enter-start="opacity-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-end="opacity-0"
         x-transition:leave-start="opacity-50">
    </div>
</div>

<div class="modal fade text-center" id="confirmModal" th:fragment="confirm_modal">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Delete Confirmation</h4>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>

            </div>
            <div class="modal-body">
                <span id="confirmText">

                </span>
            </div>
            <div class="modal-footer">
                <a class="btn btn-success" href="" id="yesButton">Yes</a>
                <button class="btn btn-link text-danger ml-auto" data-bs-dismiss="modal" type="button">No</button>
            </div>
        </div>
    </div>
</div>

<script th:fragment="modal_scripts">
    // Function to open modal
    function openModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.__x.$data.isOpen = true;
        }
    }

    // Function to close modal
    function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.__x.$data.isOpen = false;
        }
    }

    // Function to submit form in modal
    function submitForm() {
        const form = this.$el.querySelector('form');
        if (form) {
            form.submit();
        }
    }
</script>

</body>
</html>
