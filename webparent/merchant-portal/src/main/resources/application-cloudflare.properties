# Cloudflare Containers profile: served by the Worker under /merchant and backed
# by the shared Supabase PostgreSQL "app" schema (same database as every portal).
server.port=8080
server.servlet.context-path=/merchant
spring.application.name=paykesho-merchant-portal
spring.main.lazy-initialization=true

spring.datasource.url=${PAYKESHO_DB_URL}
spring.datasource.username=${PAYKESHO_DB_USERNAME}
spring.datasource.password=${PAYKESHO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.data-source-properties.sslmode=${PAYKESHO_DB_SSLMODE:require}
spring.datasource.hikari.data-source-properties.currentSchema=app
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
file.service.url=${FILE_SERVICE_URL:http://localhost:8086}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8787/internal/payment}
paykesho.internal.token=${PAYKESHO_INTERNAL_TOKEN:}
paykesho.security.oauth2.enabled=${PAYKESHO_OAUTH2_ENABLED:false}
paykesho.security.rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}

server.servlet.session.cookie.name=PK_MERCHANT_SESSION
server.servlet.session.cookie.secure=${PAYKESHO_SECURE_COOKIES:true}
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=framework
paykesho.security.remember-me-cookie=pk_merchant_remember

logging.level.root=INFO
logging.level.org.paykesho.merchantportal=INFO

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Google/Facebook sign-in is off until its client IDs are configured; without
# this exclusion an empty client ID stops the portal from starting. To enable:
# set PAYKESHO_OAUTH2_ENABLED=true, the provider IDs/secrets, and PAYKESHO_OAUTH2_EXCLUDE to "".
spring.autoconfigure.exclude=${PAYKESHO_OAUTH2_EXCLUDE:org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration}
