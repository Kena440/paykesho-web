# Cloudflare production profile
server.port=8080
spring.application.name=paykesho-client-portal
spring.main.lazy-initialization=true

# Supabase/PostgreSQL
spring.datasource.url=${PAYKESHO_DB_URL}
spring.datasource.username=${PAYKESHO_DB_USERNAME}
spring.datasource.password=${PAYKESHO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.data-source-properties.sslmode=${PAYKESHO_DB_SSLMODE:require}
spring.datasource.hikari.data-source-properties.currentSchema=app
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
file.service.url=${FILE_SERVICE_URL:http://localhost:8086}

paykesho.security.oauth2.enabled=${PAYKESHO_OAUTH2_ENABLED:false}

paykesho.security.rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}
logging.level.root=INFO
logging.level.com.paykesho=INFO

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Payment settlement service
payment.service.url=${PAYMENT_SERVICE_URL:http://payment-service:8084}
paykesho.internal.token=${PAYKESHO_INTERNAL_TOKEN:}

# All portals share one host (paths /, /admin, /merchant, /employer). Distinct
# cookie names keep each portal's session and remember-me cookie separate.
server.servlet.session.cookie.name=PK_CLIENT_SESSION
server.servlet.session.cookie.secure=${PAYKESHO_SECURE_COOKIES:true}
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=framework
paykesho.security.remember-me-cookie=pk_client_remember
