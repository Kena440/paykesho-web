<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Transactions','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">
                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Transaction Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">
                        <a class="btn btn-primary shadow-sm" th:href="@{/transactions}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> My Transactions
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/transactions/initiate}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Initiate
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">A list of your recorded transactions.</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped w-100" id="datatables-reponsive">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Ref</th>
                                        <th>Amount</th>
                                        <th>Client</th>
                                        <th>Merchant</th>
                                        <th>Date</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="transaction, transactionStat : ${transactionList}">
                                        <td class="hideable-column">[[${transactionStat.count}]]</td>
                                        <td>
                                            <span class="font-weight-normal">
                                                    <span class="font-weight-normal"> [[${transaction.reference}]]</span>
                                            </span>
                                        </td>
                                        <td><span class="font-weight-normal"
                                                  th:replace="fragments/fragments :: format_currency(${transaction.amount})"></span>
                                        </td>
                                        <td><span class="font-weight-normal">[[${transaction.client}]]</span></td>
                                        <td><span class="font-weight-normal">[[${transaction.merchant}]]</span></td>
                                        <td><span class="font-weight-normal">[[${transaction.txnDate}]]</span></td>
                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="fragments/modal_fragment :: confirm_modal"></footer>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_list.js}" type="text/javascript"></script>
<script>
    moduleURL = "[[@{/transactions}]]";
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            showDeleteConfirmModal($(this), 'transaction');
        });
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Datatables Responsive
        $("#datatables-reponsive").DataTable({
            destroy: true,
            responsive: true
        });
    });
</script>

</body>
</html>
