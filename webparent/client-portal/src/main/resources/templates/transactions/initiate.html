<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Transactions','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">

                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Transaction Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">
                        <a class="btn btn-primary shadow-sm" th:href="@{/transactions}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> My Transactions
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/transactions/initiate}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Initiate
                        </a>
                    </div>
                </div>

                <!-- Loader GIF -->
                <div id="loader">
                    <img alt="Loading..." height="100" th:src="@{/images/loader.gif}" width="100">
                </div>

                <div class="row">
                    <div class="col-12 col-xl-6">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">Make a quick payment.</h6>
                            </div>
                            <div class="card-body">

                                <form id="paymentForm">
                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="form-group">
                                                <label for="merchantCode">Merchant Code</label>
                                                <input class="form-control" id="merchantCode"
                                                       placeholder="Enter Merchant Code"
                                                       required type="text">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col">
                                            <hr>
                                        </div>
                                        <div class="col-auto text-uppercase d-flex align-items-center">Or</div>
                                        <div class="col">
                                            <hr>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="form-group text-center">
                                                <button class="btn btn-primary" id="scanQrButton" style="width: 100%"
                                                        type="button">
                                                    <i class="align-middle" data-lucide="qr-code"></i> Scan QR Code
                                                </button>
                                            </div>

                                        </div>
                                    </div>


                                    <div class="row">
                                        <div class="col-md-12 ">
                                            <div class="card card-body" id="reader"
                                                 style="width: 100%; margin: auto; display: none;"></div>
                                        </div>
                                    </div>
                                    <hr>
                                    <div class="row">
                                        <div class="col-md-12" id="merchantDetails" style="display: none;">
                                            <div class="card">
                                                <div class="card-header">
                                                    <h5 class="card-title mb-0">Merchant Information</h5>
                                                </div>
                                                <div class="card-body">

                                                    <dl class="row mb-1">
                                                        <dt class="col-4 col-xxl-3">Name</dt>
                                                        <dd class="col-8 col-xxl-9">
                                                            <span id="merchantName"></span>
                                                        </dd>
                                                        <dt class="col-4 col-xxl-3">Type</dt>
                                                        <dd class="col-8 col-xxl-9">
                                                            <span id="merchantType"></span>
                                                        </dd>

                                                    </dl>

                                                    <hr>

                                                    <div class="form-group mt-3" id="amountSection"
                                                         style="display: none;">
                                                        <label for="amount">Amount</label>
                                                        <input class="form-control" id="amount"
                                                               min="20"
                                                               placeholder="Enter Amount"
                                                               required
                                                               step="0.1"
                                                               type="number">
                                                    </div>

                                                    <hr>

                                                    <div class="form-group mt-3" id="submitSection"
                                                         style="display: none;">
                                                        <button class="btn btn-success btn-block" type="submit">Confirm
                                                            Payment
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>


                                        </div>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
        <footer th:replace="fragments/fragments :: footer1()"></footer>
    </div>
</div>
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_modal.js}" type="text/javascript"></script>
<!-- Include Bootstrap JS and dependencies (optional for styling) -->
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<!-- Custom Scripts -->
<script>
    // Elements
    const merchantCodeInput = document.getElementById('merchantCode');
    const scanQrButton = document.getElementById('scanQrButton');
    const reader = document.getElementById('reader');
    const merchantDetailsDiv = document.getElementById('merchantDetails');
    const merchantNameSpan = document.getElementById('merchantName');
    const merchantAddressSpan = document.getElementById('merchantType');
    const amountSection = document.getElementById('amountSection');
    const submitSection = document.getElementById('submitSection');
    const paymentForm = document.getElementById('paymentForm');
    const loader = document.getElementById('loader');

    // Fetch Merchant Details Function
    function fetchMerchantDetails(merchantCode) {
        // Show loader
        loader.style.display = 'block';

        fetch(`/merchants/rest/merchant-details?code=${merchantCode}`)
            .then(response => response.json())
            .then(data => {
                // Hide loader
                loader.style.display = 'none';

                if (data != null) {
                    merchantNameSpan.textContent = data.name;
                    merchantAddressSpan.textContent = data.type;
                    merchantDetailsDiv.style.display = 'block';
                    amountSection.style.display = 'block';
                    submitSection.style.display = 'block';
                } else {
                    showWarningModal('Merchant not found.');
                }
            })
            .catch(error => {
                loader.style.display = 'none';
                console.error('Error fetching merchant details:', error);
                showWarningModal("An error occurred while fetching merchant details: " + merchantCode);
            });
    }

    // Event Listeners
    merchantCodeInput.addEventListener('change', () => {
        const merchantCode = merchantCodeInput.value.trim();
        if (merchantCode) {
            fetchMerchantDetails(merchantCode);
        }
    });

    scanQrButton.addEventListener('click', () => {
        reader.style.display = 'block';
        const html5QrCode = new Html5Qrcode("reader");

        html5QrCode.start(
            {facingMode: "environment"},
            {
                fps: 10,
                qrbox: 250
            },
            decodedText => {
                html5QrCode.stop();
                reader.style.display = 'none';
                merchantCodeInput.value = decodedText;
                fetchMerchantDetails(decodedText);
            },
            errorMessage => {
                console.warn('QR Code no match:', errorMessage);
            }
        ).catch(err => {
            console.error('Unable to start scanning:', err);
        });
    });

    paymentForm.addEventListener('submit', event => {
        event.preventDefault();
        const merchantCode = merchantCodeInput.value.trim();
        const amount = document.getElementById('amount').value.trim();

        if (!amount || amount <= 0) {
            showWarningModal('Please enter a valid amount.');
            return;
        }

        loader.style.display = 'block';

        fetch('/transactions/confirm', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({merchantCode, amount})
        })
            .then(response => response.json())
            .then(data => {
                // Hide loader
                loader.style.display = 'none';

                if (data.success) {
                    showModalDialog('Payment', 'Payment successful!');
                    paymentForm.reset();
                    merchantDetailsDiv.style.display = 'none';
                    amountSection.style.display = 'none';
                    submitSection.style.display = 'none';
                } else {
                    showWarningModal('Payment failed: ' + data.message);
                }
            })
            .catch(error => {
                loader.style.display = 'none';
                console.error('Error submitting payment:', error);
                showWarningModal('An error occurred while submitting payment.');
            });
    });

</script>
</body>
</html>
