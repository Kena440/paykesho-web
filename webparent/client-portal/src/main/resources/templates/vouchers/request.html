<!DOCTYPE html>
<html data-bs-theme="light"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Vouchers','none')"></head>
<style>
    .table {
        margin-top: 1rem;
        font-size: 0.9rem;
    }

    .table th {
        background-color: #f8f9fa;
    }

    .table td, .table th {
        vertical-align: middle;
    }

    .table th.text-center {
        font-weight: bold;
    }
</style>

<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">

                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Voucher Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">
                        <a class="btn btn-primary shadow-sm" th:href="@{/vouchers}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> My Vouchers
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/vouchers/request}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Request
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">[[${pageTitle}]]</h5>
                            <h6 class="card-subtitle text-muted">Request for a quick voucher.</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <form enctype="multipart/form-data"
                                          method="post"
                                          th:action="@{/vouchers/save}"
                                          th:object="${voucherRequest}">
                                        <div class="mb-3">
                                            <label class="form-label">Amount</label>
                                            <input class="form-control" id="amount"
                                                   max="999999" min="20" maxlength="5"
                                                   placeholder="amount" required step="0.1"
                                                   th:field="*{amount}" type="number"
                                                   oninput="calculateVoucherDetails()">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Reason</label>
                                            <textarea class="form-control" id="reason"
                                                      placeholder="Reason" required rows="3"
                                                      th:field="*{reason}"></textarea>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Latest Payslip</label>
                                            <input accept=".pdf, image/png, image/jpeg"
                                                   class="form-control" id="payslip"
                                                   name="payslip" type="file"
                                                   onchange="validateFileSize(this)">
                                        </div>
                                        <div class="alert alert-warning alert-dismissible" role="alert"
                                             id="fileSizeAlert" style="display: none;">
                                            <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                                    type="button"></button>
                                            <div class="alert-icon">
                                                <i class="far fa-fw fa-lock"></i>
                                            </div>
                                            <div class="alert-message">
                                                <span class="alert-inner--text"><strong>Warning!</strong>File size exceeds 1MB. Please upload a smaller file.</span>
                                            </div>
                                        </div>
                                        <button class="btn btn-primary" type="submit">Submit</button>
                                    </form>
                                </div>

                                <div class="col-md-6">
                                    <div class="table-responsive">
                                        <table class="table table-bordered table-striped">
                                            <thead>
                                            <tr>
                                                <th colspan="2" class="text-center">Voucher Calculation Details</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr>
                                                <td><strong>Interest Amount (15%):</strong></td>
                                                <td><span id="interestAmount">0</span></td>
                                            </tr>
                                            <tr>
                                                <td><strong>Total Repayment:</strong></td>
                                                <td><span id="totalRepayment">0</span></td>
                                            </tr>
                                            <tr>
                                                <td><strong>Repayment Date:</strong></td>
                                                <td><span id="repaymentDate">--</span></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="fragments/fragments :: footer1()"></footer>
    </div>
</div>

<footer th:replace="fragments/fragments :: js_code"></footer>

<script>
    function calculateVoucherDetails() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const interestRate = 0.15;
        const interestAmount = amount * interestRate;
        const totalRepayment = amount + interestAmount;

        // Display calculated values
        document.getElementById('interestAmount').innerText = interestAmount.toFixed(2);
        document.getElementById('totalRepayment').innerText = totalRepayment.toFixed(2);

        // Calculate repayment date (1 month from today)
        const today = new Date();
        const repaymentDate = new Date(today.setMonth(today.getMonth() + 1));
        document.getElementById('repaymentDate').innerText = repaymentDate.toISOString().split('T')[0];
    }
</script>

<script>
    let isFileValid = true;

    function validateFileSize(input) {
        const file = input.files[0];
        const maxSize = 1 * 1024 * 1024; // 1MB in bytes
        const alertBox = document.getElementById('fileSizeAlert');

        if (file && file.size > maxSize) {
            alertBox.style.display = 'block'; // Show alert
            input.value = ''; // Clear the file input
            isFileValid = false; // Mark file as invalid
        } else {
            alertBox.style.display = 'none'; // Hide alert if valid
            isFileValid = true; // Mark file as valid
        }
    }

    document.querySelector('form').onsubmit = function (event) {
        if (!isFileValid) {
            event.preventDefault(); // Prevent form submission
            alert('Please upload a valid payslip file under 1MB.');
        }
    };
</script>

</body>
</html>
