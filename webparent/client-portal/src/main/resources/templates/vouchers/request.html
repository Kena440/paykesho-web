<!DOCTYPE html>
<html data-bs-theme="dark"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Vouchers','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">

                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Voucher Management</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <a class="btn btn-primary shadow-sm" th:href="@{/vouchers}">
                            <i class="align-middle" data-lucide="list">&nbsp;</i> My Vouchers
                        </a>
                        <a class="btn btn-primary shadow-sm" th:href="@{/vouchers/request}">
                            <i class="align-middle" data-lucide="list-plus">&nbsp;</i> Request
                        </a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-xl-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">[[${pageTitle}]]</h5>
                                <h6 class="card-subtitle text-muted">Request for a quick voucher.</h6>
                            </div>
                            <div class="card-body">
                                <form enctype="multipart/form-data"
                                      method="post"
                                      th:action="@{/vouchers/save}"
                                      th:object="${voucher}">
                                    <input id="id" th:field="*{id}" type="hidden"/>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Name</label>
                                                <input
                                                        class="form-control" id="name" maxlength="45"
                                                        minlength="2" placeholder="Name" required
                                                        th:field="*{name}"
                                                        type="text">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Type</label>
                                                <select class="form-control" th:field="*{merchantType}">
                                                    <option value="">Select...</option>
                                                    <th:block
                                                            th:each="ps : ${T(org.commons.enums.MerchantType).values()}">
                                                        <option th:defaultDescription="${ps.name()}"
                                                                th:text="${ps}"
                                                                th:value="${ps}">
                                                        </option>
                                                    </th:block>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Phone Number</label>
                                                <input
                                                        class="form-control" id="phoneNumber" maxlength="45"
                                                        minlength="2" placeholder="Phone Number" required
                                                        th:field="*{phoneNumber}"
                                                        type="text">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Email</label>
                                                <input
                                                        class="form-control" id="email" maxlength="100"
                                                        minlength="2" placeholder="Email" required
                                                        th:field="*{email}"
                                                        type="email">
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label">Details</label>
                                                <textarea class="form-control" id="details" placeholder="Details"
                                                          required
                                                          rows="3" th:field="*{details}"></textarea>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Services</label>
                                                <textarea class="form-control" id="servicesOffered"
                                                          placeholder="Services" required
                                                          rows="3" th:field="*{servicesOffered}"></textarea>
                                            </div>
                                        </div>
                                        <div class="col-md-6">

                                            <div class="mb-3">
                                                <img
                                                        alt="change avatar"
                                                        class="rounded"
                                                        id="thumbnail"
                                                        style="height: 100px; width: 100px"
                                                        th:src="@{${merchant.photosImagePath}}">
                                                <hr>
                                                <label class="form-label">File input</label>
                                                <input accept="image/png, image/jpeg"
                                                       capture="user"
                                                       class="form-control"
                                                       id="fileImage"
                                                       name="image"
                                                       type="file">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-check m-0">
                                                    <input class="form-check-input" id="enabledInput"
                                                           th:field="*{enabled}"
                                                           type="checkbox">
                                                    <span class="form-check-label">Enabled</span>
                                                </label>
                                            </div>
                                            <hr>
                                            <div class="mb-3">
                                                <label class="form-label">Location</label>
                                                <div class="text-center">
                                                    <div id="map" style='width: 100%; height: 250px'></div>
                                                    <pre id="info"></pre>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <button class="btn btn-primary" type="submit">Submit</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>


            </div>
        </main>

        <footer th:replace="fragments/fragments :: footer1()"></footer>
    </div>
</div>

<footer th:replace="fragments/fragments :: js_code"></footer>
