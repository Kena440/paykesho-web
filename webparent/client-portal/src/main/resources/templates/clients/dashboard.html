<!DOCTYPE html>
<html data-bs-theme="dark"
      data-layout="fluid" data-sidebar-behavior="sticky" data-sidebar-position="left" data-sidebar-theme="dark"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Dashboard','none')"></head>
<body>
<div class="wrapper">
    <nav th:replace="fragments/fragments :: sidebarMenu"></nav>
    <div class="main">
        <nav th:replace="fragments/fragments :: topbar"></nav>
        <main class="content">
            <div class="container-fluid p-0">

                <div class="row mb-2 mb-xl-3">
                    <div class="col-auto d-none d-sm-block">
                        <h3>Analytics</h3>
                    </div>

                    <div class="col-auto ms-auto text-end mt-n1">

                        <div class="dropdown me-2 d-inline-block position-relative">
                            <a class="btn btn-light bg-white shadow-sm dropdown-toggle" data-bs-display="static"
                               data-bs-toggle="dropdown" href="#">
                                <i class="align-middle mt-n1" data-lucide="calendar"></i> Today
                            </a>

                            <div class="dropdown-menu dropdown-menu-end">
                                <h6 class="dropdown-header">Settings</h6>
                                <a class="dropdown-item" href="#">Action</a>
                                <a class="dropdown-item" href="#">Another action</a>
                                <a class="dropdown-item" href="#">Something else here</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#">Separated link</a>
                            </div>
                        </div>

                        <button class="btn btn-primary shadow-sm">
                            <i class="align-middle" data-lucide="filter">&nbsp;</i>
                        </button>
                        <button class="btn btn-primary shadow-sm">
                            <i class="align-middle" data-lucide="refresh-cw">&nbsp;</i>
                        </button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 col-xl-12 d-flex">
                        <div class="w-100">

                            <div class="row">
                                <div class="col-sm-6 col-lg-12 col-xxl-6 d-flex">
                                    <div class="card illustration flex-fill">
                                        <div class="card-body p-0 d-flex flex-fill">
                                            <div class="row g-0 w-100">
                                                <div class="col-6">
                                                    <div class="illustration-text p-3 m-1">
                                                        <h4 class="illustration-text">[[${greeting}]]
                                                            [[${client}]]!</h4>
                                                        <p class="mb-0">Paykesho Dashboard</p>
                                                    </div>
                                                </div>
                                                <div class="col-6 align-self-end text-end">
                                                    <img alt="Searching"
                                                         class="img-fluid illustration-img"
                                                         th:src="@{/assets/img/illustrations/searching.png}">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6 col-lg-12 col-xxl-6 d-flex">
                                    <div class="card flex-fill">
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col mt-0">
                                                    <h5 class="card-title">Balance</h5>
                                                </div>

                                                <div class="col-auto">
                                                    <div class="stat stat-sm">
                                                        <i class="align-middle" data-lucide="arrow-up-right"></i>
                                                    </div>
                                                </div>
                                            </div>
                                            <span class="h1 d-inline-block mt-1 mb-4">[[${availableBalance}]]</span>
                                            <!--   <div class="mb-0">
                                                   <span class="badge badge-subtle-success me-2"> +3.65% </span>
                                                   <span class="text-muted">Since last week</span>
                                               </div>-->
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row d-lg-none d-xxl-flex">
                                <div class="col-sm-6 col-lg-12 col-xxl-6 d-flex">
                                    <div class="card flex-fill">
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col mt-0">
                                                    <h5 class="card-title">Real-Time</h5>
                                                </div>

                                                <div class="col-auto">
                                                    <div class="stat stat-sm">
                                                        <i class="align-middle" data-lucide="clock"></i>
                                                    </div>
                                                </div>
                                            </div>
                                            <span class="h1 d-inline-block mt-1 mb-4">1.856</span>
                                            <div class="mb-0">
                                                <span class="badge badge-subtle-success me-2"> +2.25% </span>
                                                <span class="text-muted">Since last week</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6 col-lg-12 col-xxl-6 d-flex">
                                    <div class="card flex-fill">
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col mt-0">
                                                    <h5 class="card-title">Visitors</h5>
                                                </div>

                                                <div class="col-auto">
                                                    <div class="stat stat-sm">
                                                        <i class="align-middle" data-lucide="users"></i>
                                                    </div>
                                                </div>
                                            </div>
                                            <span class="h1 d-inline-block mt-1 mb-4">17.212</span>
                                            <div class="mb-0">
                                                <span class="badge badge-subtle-danger me-2"> -1.25% </span>
                                                <span class="text-muted">Since last week</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>


            </div>
        </main>

        <footer th:replace="fragments/fragments :: footer1()"></footer>
    </div>
</div>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Bar chart
        new Chart(document.getElementById("chartjs-dashboard-bar-devices"), {
            type: "bar",
            data: {
                labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
                datasets: [{
                    label: "Mobile",
                    backgroundColor: window.cssVariables.primary,
                    borderColor: window.cssVariables.primary,
                    hoverBackgroundColor: window.cssVariables.primary,
                    hoverBorderColor: window.cssVariables.primary,
                    data: [54, 67, 41, 55, 62, 45, 55, 73, 60, 76, 48, 79],
                    barPercentage: .5,
                    categoryPercentage: .5
                }, {
                    label: "Desktop",
                    backgroundColor: window.cssVariables.primarySubtle,
                    borderColor: window.cssVariables.primarySubtle,
                    hoverBackgroundColor: window.cssVariables.primarySubtle,
                    hoverBorderColor: window.cssVariables.primarySubtle,
                    data: [69, 66, 24, 48, 52, 51, 44, 53, 62, 79, 51, 68],
                    barPercentage: .5,
                    categoryPercentage: .5
                }]
            },
            options: {
                maintainAspectRatio: false,
                cornerRadius: 15,
                legend: {
                    display: false
                },
                scales: {
                    yAxes: [{
                        gridLines: {
                            display: false
                        },
                        ticks: {
                            stepSize: 20
                        },
                        stacked: true,
                    }],
                    xAxes: [{
                        gridLines: {
                            color: "transparent"
                        },
                        stacked: true,
                    }]
                }
            }
        });
    });
</script>

            {
                coords: [55.755825, 37.617298],
                name: "Moscow"
            },
            {
                coords: [40.416775, -3.703790],
                name: "Madrid"
            }
        ];
        var map = new jsVectorMap({
            map: "world",
            selector: "#world_map",
            zoomButtons: true,
            markers: markers,
            markerStyle: {
                initial: {
                    r: 9,
                    stroke: window.cssVariables.secondaryBg,
                    strokeWidth: 7,
                    stokeOpacity: .4,
                    fill: window.cssVariables.primary
                },
                hover: {
                    fill: window.cssVariables.primary,
                    stroke: window.cssVariables.primary
                }
            },
            regionStyle: {
                initial: {
                    fill: window.cssVariables.quaternaryBg
                }
            },
            zoomOnScroll: false
        });
        window.addEventListener("resize", () => {
            map.updateSize();
        });
        setTimeout(function () {
            map.updateSize();
        }, 250);
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Pie chart
        new Chart(document.getElementById("chartjs-dashboard-pie"), {
            type: "pie",
            data: {
                labels: ["Direct", "Affiliate", "E-mail", "Other"],
                datasets: [{
                    data: [2602, 1253, 541, 1465],
                    backgroundColor: [
                        window.cssVariables.primary,
                        window.cssVariables.warning,
                        window.cssVariables.danger,
                        "#E8EAED"
                    ],
                }]
            },
            options: {
                responsive: !window.MSInputMethodContext,
                maintainAspectRatio: false,
                cutoutPercentage: 70,
                legend: {
                    display: false
                },
                elements: {
                    arc: {
                        borderWidth: 5,
                        borderColor: window.cssVariables.secondaryBg
                    }
                },
            }
        });
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Radar chart
        new Chart(document.getElementById("chartjs-dashboard-radar"), {
            type: "radar",
            data: {
                labels: ["Technology", "Sports", "Media", "Gaming", "Arts"],
                datasets: [{
                    label: "Interests",
                    backgroundColor: "rgba(0, 123, 255, 0.2)",
                    borderColor: window.cssVariables.primary,
                    pointBackgroundColor: window.cssVariables.primary,
                    pointBorderColor: "#fff",
                    pointHoverBackgroundColor: "#fff",
                    pointHoverBorderColor: window.cssVariables.primary,
                    data: [70, 53, 82, 60, 33]
                }]
            },
            options: {
                maintainAspectRatio: false,
                legend: {
                    display: false,
                },
                scale: {
                    gridLines: {
                        color: window.cssVariables.quaternaryColor
                    },
                    ticks: {
                        backdropColor: window.cssVariables.secondaryBg,
                        fontColor: window.cssVariables.bodyColor
                    },
                    angleLines: {
                        color: window.cssVariables.quaternaryColor
                    },
                    pointLabels: {
                        fontColor: window.cssVariables.bodyColor
                    }
                }
            }
        });
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        $("#datatables-dashboard-traffic").DataTable({
            destroy: true,
            pageLength: 8,
            lengthChange: false,
            bFilter: false,
            autoWidth: false,
            order: [
                [1, "desc"]
            ]
        });
    });
</script>
</body>
</html>
