<!doctype html>
<html lang="en">


<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head(${pageTitle},'none')"></head>

<body>

<nav th:replace="fragments/fragments :: navBar"></nav>

<section class="py-5 bg-white">
    <div class="container">

        <div class="row">
            <div class="col-md-6 col-lg-6 mx-auto">
                <div class="card card-body">
                    <div class="mb-3">
                        <div class="row justify-content-center">
                            <div class="col-12 col-md-10 col-lg-8 col-xl-6 text-center">

                                <!-- Icon -->
                                <div class="mb-7 font-size-h1">&#[[${emoji}]];</div>

                                <!-- Heading -->
                                <h2 class="mb-5">[[${pageTitle}]]</h2>

                                <!-- Text -->
                                <p class="mb-7 text-gray-500">
                                    [[${message}]]
                                </p>

                                <!-- Button -->
                                <a class="btn btn-dark" th:href="@{/}">
                                    Go to Homepage
                                </a>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<footer th:replace="fragments/fragments :: js_code"></footer>

</body>

</html>
