<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/fragments :: page_head('Password Reset','none')"></head>
<style>
    .form-control.is-invalid {
        border-color: #dc3545;
        box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
    }

    .form-control.is-invalid:focus {
        border-color: #dc3545;
        box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
    }

    .invalid-feedback {
        display: block;
        width: 100%;
        margin-top: 0.25rem;
        font-size: 0.875em;
        color: #dc3545;
    }

    .btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
    }

    .alert {
        animation: fadeIn 0.3s ease-in;
    }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<body>
<main>
    <div class="auth-full-page d-flex">
        <div class="auth-form p-3">
            <div class="card card-body">
                <div class="mb-3">
                    <div class="d-grid gap-2 mb-3 text-center">
                        <div class="row align-middle">
                            <div class="col-md-5">
                                <img alt="logo" class="logo-img mb-4"
                                     height="80"
                                     th:src="@{/images/paykeshologo.png}" width="120">
                            </div>
                            <div class="col-md-7">
                                <div class="text-md-center mb-4 mt-md-0">
                                    <h1 class="mb-0 h3"> Client Portal</h1>
                                    <p class="text-warning">Reset your password.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                        <form id="resetPasswordForm" method="post" th:action="@{/reset-password-action}">
                            <input name="token" th:value="${token}" type="hidden">

                            <div class="mb-4">
                                <div class="alert alert-info alert-dismissible" role="alert" th:if="${message != null}">
                                    <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                            type="button"></button>
                                    <div class="alert-icon">
                                        <i class="fas fa-fw fa-info"></i>
                                    </div>
                                    <div class="alert-message">
                                        <strong>Info!</strong> [[${message}]]
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input autofocus="autofocus" class="form-control form-control-lg" id="password"
                                       maxlength="50"
                                       minlength="6" name="password"
                                       placeholder="Enter new password" required
                                       type="password"/>
                                <div class="invalid-feedback" id="passwordError">
                                    Please enter a password (minimum 6 characters).
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input class="form-control form-control-lg" id="confirmPassword"
                                       maxlength="50"
                                       minlength="6" name="passwordConfirm"
                                       placeholder="Confirm new password" required
                                       type="password"/>
                                <div class="invalid-feedback" id="confirmPasswordError">
                                    Passwords do not match.
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-3">
                                <button class="btn btn-lg btn-primary" id="submitBtn" type="submit">
                                    Reset Password
                                </button>
                            </div>

                            <div class="text-center mt-3">
                                <a class="text-decoration-none" th:href="@{/login}">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Login
                                </a>
                            </div>
                        </form>

                    </div>
                    <div class="text-center">
                        Don't have an account? <a th:href="@{/clients/register}">Sign up</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/fragments :: js_code"></footer>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('resetPasswordForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');

        function validateForm() {
            let isValid = true;

            // Clear previous error states
            passwordInput.classList.remove('is-invalid');
            confirmPasswordInput.classList.remove('is-invalid');

            // Validate password
            if (!passwordInput.value.trim()) {
                passwordInput.classList.add('is-invalid');
                document.getElementById('passwordError').textContent = 'Please enter a password.';
                isValid = false;
            } else if (passwordInput.value.length < 6) {
                passwordInput.classList.add('is-invalid');
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters long.';
                isValid = false;
            }

            // Validate confirm password
            if (!confirmPasswordInput.value.trim()) {
                confirmPasswordInput.classList.add('is-invalid');
                document.getElementById('confirmPasswordError').textContent = 'Please confirm your password.';
                isValid = false;
            } else if (passwordInput.value !== confirmPasswordInput.value) {
                confirmPasswordInput.classList.add('is-invalid');
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
                isValid = false;
            }

            return isValid;
        }

        // Show loading state on form submission
        form.addEventListener('submit', function (e) {
            if (!validateForm()) {
                e.preventDefault();
                return false;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Resetting...';
        });

        // Real-time password confirmation validation
        confirmPasswordInput.addEventListener('input', function () {
            if (this.value.trim() && passwordInput.value !== this.value) {
                this.classList.add('is-invalid');
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
            } else {
                this.classList.remove('is-invalid');
            }
        });

        passwordInput.addEventListener('input', function () {
            if (confirmPasswordInput.value.trim() && this.value !== confirmPasswordInput.value) {
                confirmPasswordInput.classList.add('is-invalid');
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
            } else {
                confirmPasswordInput.classList.remove('is-invalid');
            }
        });

        // Auto-hide alerts after 5 seconds
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(function (alert) {
            setTimeout(function () {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            }, 5000);
        });
    });
</script>

</body>

</html>
