<!doctype html>
<html lang="en">

<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Password Reset','none')"></head>

<body>

<nav th:replace="fragments/fragments :: navBar"></nav>

<section class="py-5 bg-white">
    <div class="container">

        <div class="row">
            <div class="col-md-6 col-lg-6 mx-auto">
                <div class="card card-body">
                    <div class="mb-3">
                        <div class="d-grid gap-2 mb-3 text-center d-none">
                            <div class="row align-middle">
                                <div class="col-md-5">
                                    <img alt="logo" class="logo-img mb-4"
                                         height="80"
                                         th:src="@{/images/paykeshologo.png}" width="120">
                                </div>
                                <div class="col-md-7">
                                    <div class="text-md-center mb-4 mt-md-0">
                                        <h1 class="mb-0 h3"> Client Portal</h1>
                                        <p class="text-warning">Sign in to your account.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <form method="post" th:action="@{/reset-password-action}">
                            <input name="token" th:value="${token}" type="hidden">
                            <div class="position-relative mb-4">
                                <div class="alert alert-warning alert-dismissible" role="alert"
                                     th:if="${message != null}">
                                    <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                            type="button"></button>
                                    <div class="alert-icon">
                                        <i class="far fa-fw fa-lock"></i>
                                    </div>
                                    <div class="alert-message">
                                        <strong>Hello there!</strong>
                                        [[${message}]]!
                                    </div>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label"> New Password *</label>
                                <input class="form-control form-control-lg" id="password" maxlength="15"
                                       minlength="6" name="password"
                                       oninput="checkPasswordMatch(document.getElementById('confirmPassword'))"
                                       placeholder="Password *" required
                                       type="password"/>
                            </div>
                            <div class="mb-4">
                                <label class="form-label"> Confirm Password *</label>
                                <input class="form-control form-control-lg" id="passwordConfirm"
                                       maxlength="15"
                                       minlength="6" name="passwordConfirm" oninput="checkPasswordMatch(this)"
                                       placeholder="Confrm Password *" required
                                       type="password"/>
                            </div>

                            <div>
                                <div class="form-check align-items-center">
                                    <input checked class="form-check-input" id="customControlInline"
                                           name="remember-me"
                                           type="checkbox" value="remember-me">
                                    <label class="form-check-label text-small" for="customControlInline">Remember
                                        me</label>
                                </div>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid gap-2 mt-3">
                                <button class='btn btn-lg btn-primary' type="submit">Sign in</button>
                            </div>

                            <!-- Link -->

                        </form>

                    </div>
                    <div class="text-center">
                        Don't have an account? <a th:href="@{/clients/register}">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>
<script th:src="@{/assets/js/customer/customer_form.js}" type="text/javascript"></script>

</body>

</html>
