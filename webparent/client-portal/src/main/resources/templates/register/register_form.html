<!DOCTYPE html>
<html lang="en">

<meta content="text/html;charset=UTF-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Login','none')"></head>

<body>

<nav th:replace="fragments/fragments :: navBar"></nav>

<section class="py-5 bg-white">
    <div class="container">

        <div class="row">
            <div class="col-md-6 col-lg-9 mx-auto">
                <div class="card">
                    <div class="card-header text-center">
                        <p class="card-title">Sign up to Paykesho</p>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="alert alert-warning alert-dismissible" role="alert">
                                    <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                                            type="button"></button>
                                    <div class="alert-icon">
                                        <i class="far fa-fw fa-lock"></i>
                                    </div>
                                    <div class="alert-message">
                                        <strong>Hello there!</strong>
                                        <span class="alert-inner--text"><strong>Warning!</strong> Registration only applies to clients in employment in the meantime</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <form method="post"
                              onsubmit="return checkClientStatus(this)"
                              th:action="@{/clients/save-client}"
                              th:object="${client}">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Salutation</label>
                                        <select class="form-control"
                                                placeholder="Salutation" required
                                                th:field="*{salutation}">
                                            <option selected value="">Select</option>
                                            <option th:each="os : ${T(org.commons.enums.SalutationType).values()}"
                                                    th:text="${os}"
                                                    th:value="${os}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Name</label>
                                        <input class="form-control" placeholder="Name" required
                                               th:field="*{name}" type="text">
                                    </div>
                                    <div class="mb-3">

                                        <label class="form-label">NRC</label>
                                        <input class="form-control" placeholder="NRC" required
                                               th:field="*{nrc}" type="text">
                                    </div>
                                    <div class="mb-3">

                                        <label class="form-label">Phone Number</label>
                                        <input class="form-control" placeholder="Phone Number" required
                                               th:field="*{phoneNumber}" type="text">
                                    </div>
                                    <div class="mb-3">

                                        <label class="form-label">TPIN</label>
                                        <input class="form-control" placeholder="TPIN" required
                                               th:field="*{tpin}" type="text">
                                    </div>
                                    <div class="mb-3">

                                        <label class="form-label">Man Number</label>
                                        <input class="form-control" placeholder="Man Number" required
                                               th:field="*{manNumber}" type="text">
                                    </div>
                                    <div class="mb-3">

                                        <label class="form-label">Net Income</label>
                                        <input class="form-control" max="999999999999" min="20"
                                               placeholder="Net Income" required
                                               step="0.1"
                                               th:field="*{clientIncome}"
                                               type="number">
                                    </div>
                                    <div class="mb-3">

                                        <label class="form-label">Gender</label>
                                        <select class="form-control"
                                                placeholder="Gender" required
                                                th:field="*{genderType}">
                                            <option selected value="">Select Gender</option>
                                            <option th:each="os : ${T(org.commons.enums.GenderType).values()}"
                                                    th:text="${os}"
                                                    th:value="${os}"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">

                                        <label class="form-label">Address</label>
                                        <input class="form-control" placeholder="Address" required
                                               th:field="*{address}" type="text">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Type</label>
                                        <select class="form-control "
                                                disabled placeholder="Client Type" required
                                                th:field="*{clientType}">
                                            <option th:each="os : ${T(org.commons.enums.ClientType).values()}"
                                                    th:text="${os}"
                                                    th:value="${os}"></option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Organization</label>
                                        <select class="form-control"
                                                placeholder="Organization" required
                                                th:field="*{organization}">
                                            <option selected value="">Select Organization</option>
                                            <option th:each="os : ${organizationList}"
                                                    th:text="${os}"
                                                    th:value="${os.id}"></option>
                                        </select>

                                    </div>
                                    <div class="mb-3">

                                        <label class="form-label">Email</label>

                                        <input class="form-control" placeholder="Email" required
                                               th:field="*{email}" type="email">

                                    </div>
                                    <div class="mb-3">

                                        <label class="form-label">Password</label>

                                        <input class="form-control" id="password" maxlength="15"
                                               minlength="6"
                                               oninput="checkPasswordMatch(document.getElementById('confirmPassword'))"
                                               placeholder="Password"
                                               required
                                               th:field="*{password}" type="password">
                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">Confirm Password</label>

                                        <input class="form-control" id="confirmPassword"
                                               maxlength="15" minlength="6"
                                               oninput="checkPasswordMatch(this)"
                                               placeholder="Confrm Password *"
                                               required
                                               th:field="*{password}" type="password">
                                    </div>
                                </div>
                                <div class="col-md-6 text-right">
                                    <button class="btn mb-2 mr-2 btn-lg btn-secondary" type="button">Cancel</button>
                                    <button class="btn mb-2 mr-2 btn-lg btn-warning" type="reset">Reset</button>
                                    <button class="btn mb-2 mr-2 btn-lg btn-primary" type="submit">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div th:replace="fragments/modal_fragment :: modal_dialog"></div>

<footer th:replace="fragments/fragments :: footer1()"></footer>

<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>
<script th:src="@{/assets/js/common_modal.js}" type="text/javascript"></script>
<script th:src="@{/assets/js/customer/customer_form.js}" type="text/javascript"></script>

<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkClientStatus(form) {
        const url = "[[@{/clients/rest/check-client}]]";
        const name = $("#name").val();
        const nrc = $("#nrc").val();
        const tpin = $("#tpin").val();
        const manNumber = $("#manNumber").val();
        const organization = $("#organization").val();
        const csrfValue = $("input[name='_csrf']").val();
        const params = {
            name: name,
            nrc: nrc,
            tpin: tpin,
            manNumber: manNumber,
            organization: organization,
            _csrf: csrfValue
        };

        $.post(url, params, function (resp) {
            console.log(resp)
            if (resp === "OK") {
                form.submit();
            } else if (resp === "Duplicated") {
                showWarningModal("Client already exists : " + nrc);
            } else if (resp === "Not Found") {
                showWarningModal("Client does not match any records : " + nrc);
            } else {
                showErrorModal("Unknown response from server. Contact admin")
            }
        }).fail(function () {
            showErrorModal("Could not connect to server. Contact admin")
        });
        return false;
    }

</script>

</body>

</html>
