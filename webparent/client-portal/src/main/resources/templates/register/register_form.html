<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/fragments :: page_head('Home', 'none')"></head>
<body>
<header th:replace="fragments/fragments :: header"></header>
<main>
    <div th:replace="fragments/fragments :: loader"></div>
    <section class="section-header pb-2 pb-lg-4 bg-soft">
        <div class="container">
            <div class="row justify-content-between align-items-center text-center">
                <div class="col-12 col-lg-12 order-1 order-lg-2">
                    <div class="card">
                        <div class="card-header">
                            <p class="lead">Sign up to Paykesho</p>
                        </div>
                        <form method="post"
                              onsubmit="return checkClientStatus(this)"
                              th:action="@{/clients/save-client}"
                              th:object="${client}">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="alert alert-warning alert-dismissible fade show" role="alert">
                                            <span class="alert-inner--icon"><i
                                                    class="fas fa-exclamation-circle"></i></span>
                                            <span class="alert-inner--text"><strong>Warning!</strong> Registration only applies to formal clients in the meantime</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i
                                                            class="fas fa-info-circle"></i></span>
                                                </div>
                                                <input class="form-control" placeholder="Salutation" required
                                                       th:field="*{salutation}" type="text">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i class="fas fa-pen"></i></span>
                                                </div>
                                                <input class="form-control" placeholder="Name" required
                                                       th:field="*{name}" type="text">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                                                </div>
                                                <input class="form-control" placeholder="NRC" required
                                                       th:field="*{nrc}" type="text">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                                </div>
                                                <input class="form-control" placeholder="Phone Number" required
                                                       th:field="*{phoneNumber}" type="text">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                                                </div>
                                                <input class="form-control" placeholder="TPIN" required
                                                       th:field="*{tpin}" type="text">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                                                </div>
                                                <input class="form-control" placeholder="Man Number" required
                                                       th:field="*{manNumber}" type="text">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i class="fas fa-pen"></i></span>
                                                </div>
                                                <select class="custom-select"
                                                        placeholder="Gender" required
                                                        th:field="*{genderType}">
                                                    <option th:each="os : ${T(org.commons.enums.GenderType).values()}"
                                                            th:text="${os}"
                                                            th:value="${os}"/>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i
                                                            class="fas fa-address-card"></i></span>
                                                </div>
                                                <input class="form-control" placeholder="Address" required
                                                       th:field="*{address}" type="text">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i
                                                            class="fas fa-briefcase"></i></span>
                                                </div>
                                                <select class="custom-select "
                                                        disabled placeholder="Client Type" required
                                                        th:field="*{clientType}">
                                                    <option th:each="os : ${T(org.commons.enums.ClientType).values()}"
                                                            th:text="${os}"
                                                            th:value="${os}"/>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i
                                                            class="fas fa-building"></i></span>
                                                </div>
                                                <select class="custom-select"
                                                        placeholder="Organization" required
                                                        th:field="*{organization}">
                                                    <option selected value="">Select Organization</option>
                                                    <option th:each="os : ${organizationList}"
                                                            th:text="${os}"
                                                            th:value="${os}"/>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i
                                                            class="fas fa-mail-bulk"></i></span>
                                                </div>
                                                <input class="form-control" placeholder="Email" required
                                                       th:field="*{email}" type="email">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i
                                                            class="fas fa-lock"></i></span>
                                                </div>
                                                <input class="form-control" id="password" maxlength="15"
                                                       minlength="6" oninput="checkPasswordMatch(document.getElementById('confirmPassword'))" placeholder="Password"
                                                       required
                                                       th:field="*{password}" type="password">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <div class="input-group mb-4">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i
                                                            class="fas fa-lock"></i></span>
                                                </div>
                                                <input class="form-control" id="passwordConfirm"
                                                       maxlength="15" minlength="6"
                                                       oninput="checkPasswordMatch(this)" placeholder="Confrm Password *"
                                                       required
                                                       th:field="*{password}" type="password">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button class="btn mb-2 mr-2 btn-pill btn-secondary" type="button">Cancel</button>
                                <button class="btn mb-2 mr-2 btn-pill btn-warning" type="reset">Reset</button>
                                <button class="btn mb-2 mr-2 btn-pill btn-primary" type="submit">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <footer th:replace="fragments/fragments :: footer"></footer>
</main>
<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>
<script th:src="@{/assets/js/common_modal.js}" type="text/javascript"></script>
<script th:src="@{/assets/js/customer/customer_form.js}" type="text/javascript"></script>

<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 502400; // 500KB

    function checkClientStatus(form) {
        const url = "[[@{/clients/rest/check-client}]]";
        const name = $("#name").val();
        const nrc = $("#nrc").val();
        const tpin = $("#tpin").val();
        const manNumber = $("#manNumber").val();
        const organization = $("#organization").val();
        const csrfValue = $("input[name='_csrf']").val();
        const params = {email: email, _csrf: csrfValue};

        $.post(url, params, function (resp) {
            if (resp === "OK") {
                form.submit();
            } else if (resp === "Duplicated") {
                showWarningModal("Client already exists : " + nrc);
            } else if (resp === "Not Found") {
                showWarningModal("Client does not match any records : " + nrc);
            } else {
                showErrorModal("Unknown response from server. Contact admin")
            }
        }).fail(function () {
            showErrorModal("Could not connect to server. Contact admin")
        });
        return false;
    }

</script>
</body>
</html>
