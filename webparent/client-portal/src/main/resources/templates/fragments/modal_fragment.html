<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div aria-hidden="true" aria-labelledby="modalDialog" class="modal fade" id="modalDialog"
     role="dialog" tabindex="-1" th:fragment="modal_dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="modalTitle">Warning</h4>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <span id="modalBody">

                </span>
            </div>
            <div class="modal-footer">
                <button class="btn btn-link text-danger ml-auto" data-bs-dismiss="modal" type="button">Close</button>
            </div>
        </div>
    </div>
</div>

<div aria-hidden="true" aria-labelledby="confirm_modal" class="modal fade" id="confirmModal"
     role="dialog" tabindex="-1" th:fragment="confirm_modal">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Delete Confirmation</h4>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <span id="confirmText">

                </span>
            </div>
            <div class="modal-footer">
                <a class="btn btn-sm btn-secondary" href="" id="yesButton">Yes</a>
                <button class="btn btn-link text-danger ml-auto" data-bs-dismiss="modal" type="button">No</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
