# Server Configuration
server.port=8081
spring.application.name=client-portal
#server.servlet.context-path=/client-portal
# Database Configuration
spring.datasource.password=p@ssw0rd
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/paykesho_db
spring.datasource.username=root
# HikariCP Configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.pool-name=SpringBootHikariCP
spring.datasource.hikari.validation-timeout=3000
# JPA Configuration - AUTO DATABASE SCHEMA UPDATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
# Auto-create missing tables and columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
