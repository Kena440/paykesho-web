# Server Configuration
server.port=8081
spring.application.name=client-portal
#server.servlet.context-path=/client-portal
# Database Configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP Configuration
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.pool-name=SpringBootHikariCP
spring.datasource.hikari.validation-timeout=3000
# JPA Configuration - AUTO DATABASE SCHEMA UPDATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
# Auto-create missing tables and columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# OAuth2 Configuration - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
# OAuth2 Configuration - Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
# File-based Logging Configuration
logging.config=classpath:logback-spring.xml
logging.file.path=/logs/${spring.application.name}
logging.level.root=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.paykesho.clientportal=WARN
# Notification Service Configuration
notification.service.url=http://notification.internal
# File Service Configuration
file.service.url=http://file.internal
# Rate Limiting Configuration
paykesho.security.rate-limiting.enabled=${RATE_LIMITING_ENABLED:false}
# Note: Set to false for development, true for production