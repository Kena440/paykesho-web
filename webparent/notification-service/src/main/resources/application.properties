# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.template-resolver-order=1
# Server Configuration
server.port=8085
spring.application.name=notification-service
#server.servlet.context-path=/institutions
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}          
spring.datasource.hikari.connection-timeout=30000     
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}               
spring.datasource.hikari.max-lifetime=1800000          
spring.datasource.hikari.idle-timeout=300000           
spring.datasource.hikari.leak-detection-threshold=5000  
spring.datasource.hikari.pool-name=SpringBootHikariCP
# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.default_schema=app
# File-based Logging Configuration
logging.config=classpath:logback-spring.xml
logging.file.path=/logs/${spring.application.name}
logging.level.root=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.paykesho.notificationservice=WARN
spring.configs.values.from-email=${SMTP_USERNAME:}
spring.configs.values.from-name=Paykesho
spring.configs.values.smtp-port=587
spring.configs.values.smtp-password=${SMTP_PASSWORD:}
spring.configs.values.smtp-server=${SMTP_HOST:smtp.gmail.com}
spring.configs.values.smtp-user=${SMTP_USERNAME:}
spring.configs.values.password=${NOTIFICATION_PASSWORD:}
spring.configs.values.sender-id=PAYKESHO
spring.configs.values.username=${NOTIFICATION_USERNAME:Paykesho}
# Rate Limiting Configuration
paykesho.security.rate-limiting.enabled=${RATE_LIMITING_ENABLED:false}
# Note: Set to false for development, true for production

