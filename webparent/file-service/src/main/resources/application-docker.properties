server.port=8086
spring.application.name=file-service

# Database Configuration for Docker
spring.datasource.url=jdbc:mysql://mysql:3306/paykesho_db
spring.datasource.username=paykesho_user
spring.datasource.password=${MYSQL_PASSWORD:}

# HikariCP settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.pool-name=FileServiceHikariCP

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Custom File Storage Configuration
file.storage.upload-dir=/app/uploads
file.storage.max-file-size=10485760
file.storage.base-url=https://files.paykesho.com

# Logging
logging.level.org.paykesho.fileservice=INFO
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.web.multipart=INFO

