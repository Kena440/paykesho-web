server.port=8086
spring.application.name=file-service

# Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/paykesho_db
spring.datasource.username=root
spring.datasource.password=p@ssw0rd

# HikariCP settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.pool-name=FileServiceHikariCP

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=2KB

# Custom File Storage Configuration
file.storage.upload-dir=uploads
file.storage.max-file-size=5242880
file.storage.base-url=http://localhost:8086

# Security Configuration
paykesho.security.rate-limiting.enabled=${RATE_LIMITING_ENABLED:false}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Logging
logging.level.org.paykesho.fileservice=INFO
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.springframework.security=INFO

