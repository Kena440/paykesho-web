server.port=8084
spring.datasource.url=${SUPABASE_DB_URL}
# HikariCP settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=30000     
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.max-lifetime=1800000          
spring.datasource.hikari.idle-timeout=300000           
spring.datasource.hikari.leak-detection-threshold=5000  
spring.datasource.hikari.pool-name=SpringBootHikariCP
# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.default_schema=app
spring.datasource.driver-class-name=org.postgresql.Driver
# Logging settings
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 
notification.service.url=http://notification-service:8085
# ZynlePay API Configuration
payment.merchantId=${ZYNLEPAY_MERCHANT_ID:}
payment.apiId=${ZYNLEPAY_API_ID:}
payment.apiKey=${ZYNLEPAY_API_KEY:}
payment.url=${ZYNLEPAY_URL:https://sandbox.zynlepay.com/zynlepay/jsonapi}