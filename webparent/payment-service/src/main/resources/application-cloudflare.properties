# Cloudflare production profile for the PayKesho payment service
server.port=8084
spring.application.name=paykesho-payment-service

spring.datasource.url=${PAYKESHO_DB_URL}
spring.datasource.username=${PAYKESHO_DB_USERNAME}
spring.datasource.password=${PAYKESHO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=4
# Five apps share one Supabase pooler: keep pools small and release idle connections.
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.data-source-properties.sslmode=${PAYKESHO_DB_SSLMODE:require}
spring.datasource.hikari.data-source-properties.currentSchema=app
# Same database and schema as the portals; schema changes go through Supabase migrations.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.show-sql=false

lenco.api.base-url=${LENCO_API_BASE_URL:https://api.lenco.co/access/v2}
lenco.api.token=${LENCO_API_TOKEN:}
lenco.api.account-id=${LENCO_ACCOUNT_ID:}
paykesho.internal.token=${PAYKESHO_INTERNAL_TOKEN:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
