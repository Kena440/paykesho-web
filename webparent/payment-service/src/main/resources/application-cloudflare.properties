# Cloudflare production profile for the PayKesho payment service
server.port=8084
spring.application.name=paykesho-payment-service

spring.datasource.url=${PAYKESHO_DB_URL}
spring.datasource.username=${PAYKESHO_DB_USERNAME}
spring.datasource.password=${PAYKESHO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=false

lenco.api.base-url=${LENCO_API_BASE_URL:https://api.lenco.co/access/v2}
lenco.api.token=${LENCO_API_TOKEN:}
lenco.api.account-id=${LENCO_ACCOUNT_ID:}
paykesho.internal.token=${PAYKESHO_INTERNAL_TOKEN:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
