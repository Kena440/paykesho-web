<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">

                <!-- Header -->
                <div class="header mt-md-5">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Assessments
                                </h6>

                                <div class="badge bg-warning">
                                    <h3 id="countdown"></h3>
                                </div>

                            </div>
                            <div class="col-auto">
                                <h2 class="mb-2">
                                    <a th:href="@{'/assessments/view/'+${assessment.id}}">
                                        [[${assessment.name}]]
                                    </a>
                                </h2>
                            </div>
                            <div class="col-auto">


                            </div>
                        </div> <!-- / .row -->
                    </div>
                </div>

                <!-- Content -->
                <div class="card card-body p-5">
                    <div class="row">
                        <div class="col text-end">

                            <!-- Badge -->

                            <th:block th:if="${assessment.enabled == true}">
                                <div class="badge bg-success">
                                    Enabled
                                </div>
                            </th:block>
                            <th:block th:if="${assessment.enabled == false}">
                                <div class="badge bg-danger">
                                    Not enabled
                                </div>
                            </th:block>
                        </div>
                    </div> <!-- / .row -->

                    <div class="row">
                        <div class="header">
                            <div class="container-fluid">
                                <div class="header-body mt-n5 mt-md-n6">
                                    <div class="row align-items-center">
                                        <div class="col">
                                            <ul class="nav nav-tabs nav-overflow header-tabs">
                                                <li class="nav-item">
                                                    <a class="nav-link active" data-toggle="tab"
                                                       href="#infoTab">
                                                        Info
                                                    </a>
                                                </li>
                                                <li class="nav-item">
                                                    <a class="nav-link" data-toggle="tab" href="#questionsTab">
                                                        Forms
                                                    </a>
                                                </li>
                                                <li class="nav-item">
                                                    <a class="nav-link" data-toggle="tab" href="#interviewsTab">
                                                        Interviews
                                                    </a>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="container-fluid">
                            <div class="tab-content">
                                <div class="tab-pane fade show active" id="infoTab">
                                    <div class="row">
                                        <div th:replace="assessments/view_tabs/info :: content"></div>
                                    </div>
                                </div>
                                <div class="tab-pane fade" id="questionsTab">
                                    <div class="row">
                                        <div th:replace="assessments/view_tabs/forms :: content"></div>
                                    </div>
                                </div>
                                <div class="tab-pane fade" id="interviewsTab">
                                    <div class="row">
                                        <div th:replace="assessments/view_tabs/interviews :: content"></div>
                                    </div>
                                </div>

                            </div>
                            <!-- / .row -->
                        </div>
                    </div>


                </div>

            </div>
        </div> <!-- / .row -->
    </div>

    <div aria-hidden="true" aria-labelledby="exampleModalLabel" class="modal fade" id="respondentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Start Interview</h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>

                <form method="post"
                      th:action="@{/assessments/interview/start}">
                    <input id="assessmentId" name="assessmentId" th:value="${assessment.id}"
                           type="hidden"/>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Assessment Form
                                    </label>
                                    <select class="form-select" data-choices name="assessmentForm">
                                        <option value="">Select...</option>
                                        <th:block th:each="vh : ${assessmentForms}">
                                            <option th:value="${vh.id}">
                                                [[${vh.formName}]] ([[${vh.assessment.name}]])
                                            </option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Respondent Facility
                                    </label>
                                    <select class="form-select" data-choices name="facility">
                                        <option value="">Select...</option>
                                        <th:block th:each="vh : ${facilityList}">
                                            <option th:value="${vh.id}">
                                                [[${vh.name}]] ([[${vh.levelOfCare}]])
                                            </option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Respondent Name
                                    </label>
                                    <input class="form-control" id="respondentName" name="respondentName" maxlength="45"
                                           minlength="2" placeholder="Name" required
                                           type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Respondent Phone Number
                                    </label>

                                    <!-- Input -->
                                    <input class="form-control" id="respondentPhoneNumber" name="respondentPhoneNumber"
                                           maxlength="45"
                                           minlength="2" placeholder="Phone Number" required
                                           type="text">
                                </div>
                            </div>
                            <div class="col-12 col-md-12">
                                <div class="form-group">
                                    <label class="form-label">
                                        Respondent Job Title
                                    </label>

                                    <!-- Input -->
                                    <input class="form-control" id="respondentJobTitle" name="respondentJobTitle"
                                           maxlength="45"
                                           minlength="2" placeholder="Job Title" required
                                           type="text">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                        <button class="btn btn-primary" type="submit">Save & Start</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div><!-- / .main-content -->

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    contextPath = "[[@{/}]]";

    const inactivityTimeout = 1000; // in seconds
    let countdownValue = inactivityTimeout;

    function refreshPage() {
        location.reload(true);
    }

    function updateCountdown() {
        document.getElementById('countdown').textContent = `Refreshing in ${countdownValue} seconds`;
    }

    function resetTimer() {
        clearTimeout(inactivityTimer);
        countdownValue = inactivityTimeout;
        updateCountdown();
        inactivityTimer = setTimeout(refreshPage, inactivityTimeout * 1000);
    }

    document.addEventListener('mousemove', resetTimer);
    document.addEventListener('keydown', resetTimer);

    let inactivityTimer = setTimeout(refreshPage, inactivityTimeout * 1000);

    // Update countdown every second
    setInterval(function () {
        countdownValue -= 1;
        if (countdownValue >= 0) {
            updateCountdown();
        }
    }, 1000);

</script>

</body>

</html>
