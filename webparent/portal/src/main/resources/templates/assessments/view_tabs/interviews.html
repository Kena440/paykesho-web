<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
    <div class="row">
        <div class="col-12 col-md-6">

            <!-- Heading -->
            <h6 class="text-uppercase ">
                Assessment Interviews
            </h6>
        </div>
        <div class="col-12 col-md-6 text-md-end">
         <!--   <a class="btn btn-primary" th:href="@{'/assessments/start/' + ${assessment.id}}">
                <span class="fe fe-file-plus"></span>
                Start
            </a>-->
            <a class="btn btn-primary" th:href="@{'/assessments/export/excel/feedback/' + ${assessment.id}}">
                <span class="fe fe-printer"></span>
                Export
            </a>
        </div>
    </div>
    <div class="row" th:if="${assessmentInterviews.size() > 0}">
        <div class="col-6 d-none">
            <input class="form-control" id="searchInterviewsInput" placeholder="Search..." type="text">
        </div>

        <div class="col-12 col-md-6">
            <div class="table-responsive">
                <table class="table table-sm table-bordered my-4" id="interviewsTable">
                    <thead>
                    <tr>
                        <th class="px-0 bg-transparent border-top-0">
                            <span class="h6">#</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Name</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Title</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Facility</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Date/Time</span>
                        </th>
                        <th class="px-0 bg-transparent border-top-0 text-center">
                            <span class="h6">Action</span>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="interview, interviewStat : ${assessmentInterviews}">

                        <td class="px-0">
                            <small>[[${interviewStat.count}]]</small>
                        </td>
                        <td class="px-0 text-start">
                            <small>[[${interview.respondentName}]]</small>
                        </td>
                        <td class="px-0 text-start">
                            <small>[[${interview.respondentJobTitle}]]</small>
                        </td>
                        <td class="px-0 text-start">
                            <time datetime="2018-04-23"
                                  th:replace="fragments/fragments :: format_date(${interview.createdDate})"></time>

                        </td>
                        <td class="px-0 text-start">

                        </td>
                    </tr>
                    </tbody>
                </table>
                <hr>
                <button class="btn btn-primary" id="showMoreBtn">Show More</button>
                <!--<div th:replace="fragments/fragments :: pagnation('attendees')"></div>-->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let currentIndex = 0;

            document.querySelector('#searchInterviewsInput').addEventListener('input', function () {
                var searchQuery = this.value.toLowerCase();
                currentIndex = 0;
                var rows = document.querySelectorAll('#interviewsTable tbody tr');
                rows.forEach(function (row) {
                    var rowData = row.textContent.toLowerCase();
                    if (rowData.includes(searchQuery)) {
                        row.style.display = 'table-row';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });

    </script>

</div>
</body>
</html>
