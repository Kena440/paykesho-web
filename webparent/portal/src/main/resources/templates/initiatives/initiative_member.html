<!DOCTYPE html>
<html lang="en">

<!-- Mirrored from dashkit.goodthemes.co/ by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 11 May 2022 13:04:22 GMT -->
<!-- Added by HTTrack -->
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Initiatives','none')"></head>

<body>

<form th:replace="fragments/fragments :: offcanvas_demo"></form>
<div th:replace="fragments/fragments :: sidebar_offcanvas_search"></div>
<div th:replace="fragments/fragments :: sidebar_offcanvas_activity"></div>

<!-- NAVIGATION -->
<nav th:replace="fragments/fragments :: side_bar"></nav>
<nav th:replace="fragments/fragments :: side_bar_small"></nav>
<nav th:replace="fragments/fragments :: topnav"></nav>

<!-- MAIN CONTENT -->
<div class="main-content">

    <nav th:replace="fragments/fragments :: topbar"></nav>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">

                <!-- Header -->
                <div class="header mt-md-5">
                    <div class="header-body">
                        <div class="row align-items-center">
                            <div class="col">

                                <!-- Pretitle -->
                                <h6 class="header-pretitle">
                                    Initiatives
                                </h6>

                            </div>
                            <div class="col-auto">


                            </div>
                        </div> <!-- / .row -->
                    </div>
                </div>

                <!-- Content -->
                <div class="card card-body p-5">
                    <div class="row">
                        <div class="col text-end">

                            <!-- Badge -->


                            <th:block th:if="${initiative.enabled == true}">
                                <div class="badge bg-success">
                                    Enabled
                                </div>
                            </th:block>
                            <th:block th:if="${initiative.enabled == false}">
                                <div class="badge bg-danger">
                                    Not enabled
                                </div>
                            </th:block>
                        </div>
                    </div> <!-- / .row -->
                    <div class="row">
                        <div class="col text-center">

                            <!-- Title -->
                            <h2 class="mb-2">
                                <a th:href="@{'/initiatives/view/'+${initiative.id}}">
                                    [[${initiative.name}]]
                                </a>
                            </h2>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-12 col-md-6">

                            <!-- Heading -->
                            <h6 class="text-uppercase text-muted">
                                Name
                            </h6>

                            <!-- Text -->
                            <p class="text-muted mb-4">
                                <strong class="text-body">[[${memberInstitution}]]</strong>
                            </p>

                        </div>
                        <div class="col-12 col-md-6 text-md-end">
                            <!-- Heading -->
                            <h6 class="text-uppercase text-muted">
                                Details
                            </h6>

                            <!-- Text -->
                            <p class="text-muted mb-4">
                                <strong class="text-body">[[${initiative.details}]]</strong>
                            </p>

                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-12 col-md-6">

                            <!-- Heading -->
                            <h6 class="text-uppercase text-muted">
                                Payments
                            </h6>
                        </div>

                    </div>
                    <div class="row" th:if="${paymentList.size() > 0}">
                        <div class="col-12">

                            <!-- Table -->
                            <div class="table-responsive">
                                <table class="table my-4">
                                    <thead>
                                    <tr>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">#</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Amount</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Description</span>
                                        </th>
                                        <th class="px-0 bg-transparent border-top-0">
                                            <span class="h6">Date</span>
                                        </th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="init, initStat : ${paymentList}">
                                        <td class="px-0">
                                            [[${initStat.count}]]
                                        </td>
                                        <td class="px-0">
                                            <span class="h3"
                                                  th:replace="fragments/fragments :: format_currency(${init.amount})"></span>
                                        </td>
                                        <td class="px-0">
                                            [[${init.description}]]
                                        </td>
                                        <td class="px-0">
                                            <time datetime="2018-04-23"
                                                  th:replace="fragments/fragments :: format_date(${init.paymentDate})"></time>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="px-0 border-top border-top-2">Total</td>
                                        <td class="px-0 border-top border-top-2">
                                            <strong><span class="h3"
                                                          th:replace="fragments/fragments :: format_currency(${initiativeMemberTotalRemittedFromPaymentItems})"></span></strong>
                                        </td>
                                    </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div> <!-- / .row -->
    </div>

</div><!-- / .main-content -->

<footer th:replace="fragments/fragments :: js_code"></footer>
<script type="text/javascript">
    contextPath = "[[@{/}]]";
    const csrfHeaderName = "[[${_csrf.headerName}]]";
    let csrfValue = "[[${_csrf.token}]]";

    currencySymbol = "[[${CURRENCY_SYMBOL}]]";
    thousandPointType = "[[${THOUSAND_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    decimalPointType = "[[${DECIMAL_POINT_TYPE == 'COMMA' ? ',' : '.'}]]";
    currencySymbolPosition = "[[${CURRENCY_SYMBOL_POSITION}]]";
    decimalDigits = "[[${DECIMAL_DIGITS}]]";

    prefixCurrencySymbol = currencySymbolPosition === 'before price' ? currencySymbol : '';
    suffixCurrencySymbol = currencySymbolPosition === 'after price' ? currencySymbol : '';


</script>
<script th:src="@{/assets/js/iga/loan_form_details.js}" type="text/javascript"></script>

</body>
