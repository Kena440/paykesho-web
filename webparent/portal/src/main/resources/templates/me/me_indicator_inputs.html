<script type="text/javascript">
    moduleURL = "[[@{/}]]";
    MAX_FILE_SIZE = 2502400; // 2502.4KB

    let submissionPeriodDropdown = document.getElementById('submissionPeriod');
    let currentYear = new Date().getFullYear();
    let earliestYear = 1970;

    while (currentYear >= earliestYear) {
        let dateOption = document.createElement('option');
        dateOption.text = currentYear;
        dateOption.value = currentYear;
        submissionPeriodDropdown.add(dateOption);
        currentYear -= 1;
    }

    function checkIndicatorUnique(form) {
        url = "[[@{/me-indicators/rest/check-indicator}]]";
        indicatorId = $("#id").val();
        memberId = $("#memberInstitution").val();
        submissionPeriod = $("#submissionPeriod").val();
        csrfValue = $("input[name='_csrf']").val();

        params = {
            id: indicatorId,
            memberId: memberId,
            submissionPeriod: submissionPeriod,
            _csrf: csrfValue
        };

        $.post(url, params, function (response) {
            if (response === "OK") {
                form.submit();
            } else if (response === "Duplicated") {
                showWarningModal("It seems you have already submitted data for the year.");
            } else {
                showErrorModal("Unknown response from server");
            }
        }).fail(function () {
            showErrorModal("Could not connect to the server");
        });

        return false;
    }


</script>
