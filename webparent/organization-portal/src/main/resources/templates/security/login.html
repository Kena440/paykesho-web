<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta content="text/html;charset=utf-8" http-equiv="content-type"/>
<head th:replace="fragments/fragments :: page_head('Login','none')"></head>
<body>
<main>
    <div th:replace="fragments/fragments :: loader"></div>
    <section class="vh-100 d-flex align-items-center section-image overlay-soft-dark"
             th:data-background="@{/assets/img/saas-form-image.jpg}">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 d-flex align-items-center justify-content-center">

                    <div class="signin-inner mt-3 mt-lg-0 bg-white shadow-soft border rounded border-light p-4 p-lg-5 w-100 fmxw-500">
                        <div class="row">
                            <div class="col-md-5">
                                <img alt="logo" class="logo-img mb-4"
                                     height="80"
                                     th:src="@{/images/paykeshologo.png}" width="120">
                            </div>
                            <div class="col-md-7">
                                <div class="text-center text-md-center mb-4 mt-md-0">
                                    <h1 class="mb-0 h3"> Organization Portal</h1>
                                </div>
                            </div>
                        </div>
                        <form class="mt-4" method="post" th:action="@{/login}">
                            <div class="mb-4">
                                <div class="alert alert-warning" role="alert" th:if="${param.error}">
                                    [[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
                                </div>
                                <div class="alert alert-success" role="alert" th:if="${param.logout}">
                                    You have been logged out
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="input-group">
                                    <div class="input-group-prepend"><span class="input-group-text"><i
                                            class="far fa-user"></i></span>
                                    </div>
                                    <input class="form-control" id="email" name="email" placeholder="name@address.com"
                                           type="email">
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="input-group">
                                    <div class="input-group-prepend"><span class="input-group-text"><i
                                            class="fas fa-unlock-alt"></i></span></div>
                                    <input class="form-control" id="password" name="password"
                                           placeholder="Enter your password" required type="password">
                                    <div class="input-group-append"><span class="input-group-text"><i
                                            class="far fa-eye"></i></span>
                                    </div>
                                </div>
                                <div class="d-block d-sm-flex justify-content-between align-items-center mt-2">
                                    <div class="form-group form-check mt-3"><input class="form-check-input"
                                                                                   id="exampleCheck1"
                                                                                   name="remember-me"
                                                                                   type="checkbox"> <label
                                            class="form-check-label form-check-sign-white"
                                            for="exampleCheck1">Remember me</label></div>
                                    <div><a class="small text-right" href="forgot-password.html">Lost password?</a>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-block btn-primary" type="submit">Sign in</button>
                            </div>
                        </form>
                        <div class="mt-3 mb-4 text-center"><span class="font-weight-normal">or login with</span></div>
                        <div class="btn-wrapper my-4 text-center">
                            <button class="btn mr-2 btn-icon-only btn-pill btn-twitter"
                                    type="button"><span class="btn-inner-icon"><i class="fab fa-twitter"></i></span>
                            </button>
                            <button
                                    class="btn mr-2 btn-icon-only btn-pill btn-facebook" type="button"><span
                                    class="btn-inner-icon"><i
                                    class="fab fa-facebook-f"></i></span></button>
                            <button
                                    class="btn mr-2 btn-icon-only btn-pill btn-google" type="button"><span
                                    class="btn-inner-icon"><i
                                    class="fab fa-google"></i></span></button>
                        </div>
                        <div class="d-block d-sm-flex justify-content-center align-items-center mt-4"><span
                                class="font-weight-normal">Not registered? <a class="font-weight-bold"
                                                                              href="sign-up.html">Create
                    account</a></span></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<footer th:replace="fragments/fragments :: js_code"></footer>

</body>

</html>
