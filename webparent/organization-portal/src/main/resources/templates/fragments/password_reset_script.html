<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="password_reset_captcha_script">
    <script>
    // Password Reset CAPTCHA functionality
    (function() {
        'use strict';
        
        // Wait for jQuery and Bootstrap to be loaded
        $(document).ready(function() {
            console.log('Password Reset CAPTCHA Script initialized');
            
            let currentCaptchaChallenge = null;
            let captchaAttempts = 0;
            const maxCaptchaAttempts = 3;

            // Load CAPTCHA when modal opens (Bootstrap 5 + jQuery)
            $('#passwordResetModal').on('show.bs.modal', function() {
                console.log('Password reset modal opened - loading CAPTCHA');
                loadCaptcha();
                captchaAttempts = 0;
            });

            // Load new CAPTCHA
            function loadCaptcha() {
                console.log('Loading CAPTCHA from /forgot-password/captcha');
                
                // Check if required elements exist
                const captchaQuestionEl = $('.captcha-question');
                const captchaChallengeIdEl = $('#captchaChallengeId');
                const captchaAnswerEl = $('#captchaAnswer');
                const captchaSectionEl = $('#captchaSection');
                
                if (!captchaQuestionEl.length || !captchaChallengeIdEl.length || 
                    !captchaAnswerEl.length || !captchaSectionEl.length) {
                    console.error('CAPTCHA elements not found in DOM:', {
                        captchaQuestion: captchaQuestionEl.length > 0,
                        captchaChallengeId: captchaChallengeIdEl.length > 0,
                        captchaAnswer: captchaAnswerEl.length > 0,
                        captchaSection: captchaSectionEl.length > 0
                    });
                    return;
                }
                
                $.ajax({
                    url: '/forgot-password/captcha',
                    method: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        console.log('CAPTCHA data received:', data);
                        if (data && data.question && data.challengeId) {
                            currentCaptchaChallenge = data;
                            captchaQuestionEl.text(data.question);
                            captchaChallengeIdEl.val(data.challengeId);
                            captchaAnswerEl.val('');
                            captchaSectionEl.show();
                            
                            // Reset form validation
                            captchaAnswerEl.removeClass('is-invalid');
                            console.log('CAPTCHA loaded successfully:', data.question);
                        } else {
                            console.error('Invalid CAPTCHA data:', data);
                            showCaptchaError('Failed to load security challenge. Please try again.');
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('Error loading CAPTCHA:', error);
                        showCaptchaError('Failed to load security challenge. Please try again.');
                    }
                });
            }

            // Refresh CAPTCHA button
            $('#refreshCaptcha').on('click', function() {
                console.log('Refresh CAPTCHA button clicked');
                loadCaptcha();
            });

            // Show CAPTCHA error
            function showCaptchaError(message) {
                const captchaInput = $('#captchaAnswer');
                if (captchaInput.length === 0) {
                    console.warn('Cannot show CAPTCHA error - captchaAnswer element not found');
                    return;
                }
                
                captchaInput.addClass('is-invalid');
                
                // Remove existing error message
                const existingError = captchaInput.parent().find('.invalid-feedback');
                existingError.remove();
                
                // Add new error message
                const errorDiv = $('<div class="invalid-feedback"></div>').text(message);
                captchaInput.parent().append(errorDiv);
            }

            // Clear CAPTCHA error
            function clearCaptchaError() {
                const captchaInput = $('#captchaAnswer');
                if (captchaInput.length === 0) {
                    return;
                }
                captchaInput.removeClass('is-invalid');
                captchaInput.parent().find('.invalid-feedback').remove();
            }

            // Validate CAPTCHA before form submission
            $('form[action*="forgot-password"]').on('submit', function(e) {
                const emailInput = $('#modalPasswordResetEmail');
                const captchaAnswer = $('#captchaAnswer');
                
                // Basic email validation
                if (emailInput.length === 0 || !emailInput.val().trim()) {
                    e.preventDefault();
                    if (emailInput.length > 0) {
                        emailInput.addClass('is-invalid');
                    }
                    return false;
                }
                
                // CAPTCHA validation
                if (captchaAnswer.length === 0 || !captchaAnswer.val().trim()) {
                    e.preventDefault();
                    showCaptchaError('Please solve the security challenge above.');
                    return false;
                }
                
                // Clear any previous errors
                emailInput.removeClass('is-invalid');
                clearCaptchaError();
                
                // Show loading state
                const submitBtn = $('#submitResetBtn');
                if (submitBtn.length > 0) {
                    submitBtn.prop('disabled', true);
                    submitBtn.html('<i class="fas fa-spinner fa-spin"></i> Sending...');
                }
            });

            // Clear errors on input
            $('#captchaAnswer').on('input', function() {
                clearCaptchaError();
            });

            $('#modalPasswordResetEmail').on('input', function() {
                $(this).removeClass('is-invalid');
            });
        });
    })();
    </script>
</th:block>
</body>
</html>
