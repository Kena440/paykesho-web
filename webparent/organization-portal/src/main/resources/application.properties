# Server Configuration
server.port=8083
#server.servlet.context-path=/organization-portal
# Database Configuration
spring.datasource.password=p@ssw0rd
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/paykesho_db
spring.datasource.username=root
# HikariCP Configuration - Optimized for faster login
spring.datasource.hikari.minimum-idle=5
# Maximum pool size
spring.datasource.hikari.maximum-pool-size=50
# Reduced connection timeout to 10 seconds
spring.datasource.hikari.connection-timeout=10000
# This remains unchanged; controls max connection lifetime
spring.datasource.hikari.max-lifetime=1800000
# Idle timeout to 5 minutes
spring.datasource.hikari.idle-timeout=300000
# Leak detection threshold to 5 seconds
spring.datasource.hikari.leak-detection-threshold=5000
# Pool name remains unchanged
spring.datasource.hikari.pool-name=SpringBootHikariCP
spring.datasource.hikari.validation-timeout=3000
# JPA Configuration - AUTO DATABASE SCHEMA UPDATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
# Auto-create missing tables and columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# OAuth2 Configuration - Google (with environment variable support)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:827368659610-1qt3difhpegg4qr12df9p9oqu9uo1s2h.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:CHANGE_IN_PRODUCTION}
spring.security.oauth2.client.registration.google.scope=email,profile
# OAuth2 Configuration - Facebook (with environment variable support)
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:970438970542534}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:CHANGE_IN_PRODUCTION}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
# Logging Configuration
logging.level.com.zaxxer.hikari=ERROR
# Notification Service Configuration
notification.service.url=http://notification-service:8085
# Rate Limiting Configuration
paykesho.security.rate-limiting.enabled=${RATE_LIMITING_ENABLED:false}
# Note: Set to false for development, true for production