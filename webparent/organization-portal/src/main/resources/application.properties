# Server Configuration
server.port=8083
spring.application.name=organization-portal
#server.servlet.context-path=/organization-portal
# Database Configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP Configuration - Optimized for faster login
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
# Maximum pool size
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
# Reduced connection timeout to 10 seconds
spring.datasource.hikari.connection-timeout=10000
# This remains unchanged; controls max connection lifetime
spring.datasource.hikari.max-lifetime=1800000
# Idle timeout to 5 minutes
spring.datasource.hikari.idle-timeout=300000
# Leak detection threshold to 5 seconds
spring.datasource.hikari.leak-detection-threshold=5000
# Pool name remains unchanged
spring.datasource.hikari.pool-name=SpringBootHikariCP
spring.datasource.hikari.validation-timeout=3000
# JPA Configuration - AUTO DATABASE SCHEMA UPDATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
# Auto-create missing tables and columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# OAuth2 Configuration - Disabled (not used in organization-portal)
# Explicitly disable OAuth2 login in this application
paykesho.security.oauth2.enabled=false
# OAuth2 auto-configuration is excluded via @SpringBootApplication annotation
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
#spring.security.oauth2.client.registration.google.scope=email,profile
#spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
#spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
#spring.security.oauth2.client.registration.facebook.scope=email,public_profile
# File-based Logging Configuration
logging.config=classpath:logback-spring.xml
logging.file.path=/logs/${spring.application.name}
logging.level.root=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.paykesho.organizationportal=WARN
# Notification Service Configuration
notification.service.url=http://notification-service:8085
# Rate Limiting Configuration
paykesho.security.rate-limiting.enabled=${RATE_LIMITING_ENABLED:false}
# Note: Set to false for development, true for production