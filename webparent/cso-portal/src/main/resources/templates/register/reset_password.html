<!doctype html>
<html lang="en">

<!-- Mirrored from dashkit.goodthemes.co/sign-in.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 11 May 2022 13:05:06 GMT -->
<!-- Added by HTTrack -->
<meta content="text/html;charset=utf-8" http-equiv="content-type"/><!-- /Added by HTTrack -->
<head th:replace="fragments/fragments :: page_head('Login','none')"></head>

<body class="d-flex align-items-center bg-auth border-top border-top-2 border-primary">

<!-- CONTENT
================================================== -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-xl-4 my-5">

            <!-- Heading -->
            <h1 class="display-4 text-center mb-3">
                CHAZ Defaulter Tracer
            </h1>

            <!-- Subheading -->
            <p class="text-muted text-center mb-5">
                Portal
            </p>

            <!-- Form -->
            <form method="post" th:action="@{/reset-password-action}">
                <input name="token" th:value="${token}" type="hidden">
                <div class="position-relative mb-4">
                    <div class="alert alert-info" role="alert" th:if="${message != null}">
                        [[${message}]]
                    </div>
                </div>
                <!-- Email address -->
                <div class="form-group">

                    <!-- Label -->
                    <label class="form-label">
                        New Password *
                    </label>

                    <!-- Input -->
                    <input autofocus="autofocus" class="form-control"
                           id="password" maxlength="15"
                           minlength="6" name="password"
                           oninput="checkPasswordMatch(document.getElementById('confirmPassword'))"
                           placeholder="Password *" required
                           type="password"/>

                </div>

                <!-- Password -->
                <div class="form-group">
                    <div class="row">
                        <div class="col">

                            <!-- Label -->
                            <label class="form-label">
                                Confirm Password *
                            </label>

                        </div>
                        <div class="col-auto">

                            <!-- Help text -->
                        </div>
                    </div> <!-- / .row -->

                    <!-- Input group -->
                    <div class="input-group input-group-merge">

                        <!-- Input -->
                        <input class="form-control" id="passwordConfirm"
                               maxlength="15"
                               minlength="6" name="passwordConfirm" oninput="checkPasswordMatch(this)"
                               placeholder="Confrm Password *" required
                               type="password"/>
                        <!-- Icon -->
                        <span class="input-group-text">
                  <i class="fe fe-eye"></i>
                </span>

                    </div>
                </div>


                <div class="form-group">
                    <div class="form-check">
                        <input class="form-check-input is-invalid" id="loginRemember" name="remember-me" type="checkbox"
                               value="">
                        <label class="form-check-label" for="loginRemember">
                            Remember me
                        </label>
                    </div>
                </div>

                <!-- Submit -->
                <button class="btn btn-lg w-100 btn-primary mb-3">
                    Sign in
                </button>

                <!-- Link -->

            </form>

        </div>
    </div> <!-- / .row -->
</div> <!-- / .container -->

<footer th:replace="fragments/fragments :: js_code"></footer>
<script th:src="@{/assets/js/common_form.js}" type="text/javascript"></script>
<script th:src="@{/assets/js/customer/customer_form.js}" type="text/javascript"></script>

</body>

</html>
